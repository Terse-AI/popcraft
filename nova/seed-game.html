<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Starfall</title>
<style>
  html,body{margin:0;height:100%;background:#0b1026;overflow:hidden;
    font-family:ui-sans-serif,system-ui,sans-serif;color:#fff;touch-action:none}
  #c{display:block;width:100%;height:100%}
  #hud{position:fixed;top:12px;left:0;right:0;text-align:center;font-size:15px;
    letter-spacing:.1em;opacity:.9;pointer-events:none}
  #over{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;background:rgba(5,8,22,.8)}
  #over h1{font-size:34px;margin:0 0 6px} #over p{opacity:.7;margin:0 0 18px}
  button{padding:11px 22px;border-radius:12px;border:0;font:inherit;font-weight:700;
    background:linear-gradient(90deg,#ffd36b,#ff9f6b);color:#201206;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">Starfall — catch the stars · ← → or move the mouse</div>
<div id="over"><h1>Game over</h1><p id="final"></p><button onclick="reset()">Play again</button></div>
<script>
const cv=document.getElementById('c'), x=cv.getContext('2d');
let W,H; function size(){ W=cv.width=innerWidth; H=cv.height=innerHeight; } addEventListener('resize',size); size();
let px, stars, score, lives, spawn, over, t;
function reset(){ px=W/2; stars=[]; score=0; lives=3; spawn=0; over=false; t=0;
  document.getElementById('over').style.display='none'; }
reset();
addEventListener('mousemove', e=>{ px=e.clientX; });
addEventListener('touchmove', e=>{ if(e.touches[0]) px=e.touches[0].clientX; }, {passive:true});
const keys={}; addEventListener('keydown',e=>keys[e.key]=1); addEventListener('keyup',e=>keys[e.key]=0);
const PW=64;
function star(){ return { x:40+Math.random()*(W-80), y:-20, v:2.4+Math.random()*2.6+t*0.0006,
  r:9+Math.random()*7, a:Math.random()*6.28, s:Math.random()<0.12 }; }
function loop(){
  t++; x.clearRect(0,0,W,H);
  // starry backdrop
  x.fillStyle='#0b1026'; x.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){ const sx=(i*149%W), sy=((i*83+t*0.3)%H);
    x.globalAlpha=0.25+0.25*Math.sin(i+t*0.03); x.fillStyle='#9fb6ff'; x.fillRect(sx,sy,2,2); }
  x.globalAlpha=1;
  if(!over){
    if(keys['ArrowLeft']) px-=7; if(keys['ArrowRight']) px+=7;
    px=Math.max(PW/2,Math.min(W-PW/2,px));
    if(--spawn<=0){ stars.push(star()); spawn=Math.max(16,46-t*0.01); }
    for(const s of stars){ s.y+=s.v; s.a+=0.05;
      if(s.y>H-60 && Math.abs(s.x-px)<PW/2+s.r){ s.dead=1; score+=s.s?5:1; }
      else if(s.y>H+30){ s.dead=1; if(!s.s){ lives--; if(lives<=0) endGame(); } }
    }
    stars=stars.filter(s=>!s.dead);
  }
  // stars
  for(const s of stars){ drawStar(s.x,s.y,s.r,s.a,s.s?'#ffe08a':'#bcd0ff'); }
  // basket
  x.fillStyle='#ffd36b'; x.strokeStyle='#b98a3a'; x.lineWidth=4;
  x.beginPath(); x.moveTo(px-PW/2,H-54); x.lineTo(px+PW/2,H-54);
  x.lineTo(px+PW/2-10,H-24); x.lineTo(px-PW/2+10,H-24); x.closePath(); x.fill(); x.stroke();
  // hud
  x.fillStyle='#fff'; x.font='bold 20px system-ui'; x.textAlign='left';
  x.fillText('Score '+score, 16, 34);
  x.textAlign='right'; x.fillText('♥ '.repeat(Math.max(0,lives)), W-16, 34);
  requestAnimationFrame(loop);
}
function drawStar(cx,cy,r,a,col){ x.save(); x.translate(cx,cy); x.rotate(a);
  x.fillStyle=col; x.beginPath();
  for(let i=0;i<10;i++){ const rr=i%2?r*0.45:r, an=-Math.PI/2+i*Math.PI/5;
    const X=Math.cos(an)*rr, Y=Math.sin(an)*rr; i?x.lineTo(X,Y):x.moveTo(X,Y); }
  x.closePath(); x.fill(); x.restore(); }
function endGame(){ over=true; document.getElementById('final').textContent='You caught '+score+' stars';
  document.getElementById('over').style.display='flex'; }
loop();
</script></body></html>
