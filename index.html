<html lang="zh">
<head>

<title>StarVale · 星星人露谷</title>
<style>
  :root{
    --neon:#e8a34a; --gold:#f4c95d; --leaf:#b9c46a; --ink:#2a1a12; --panel:rgba(26,18,13,.2); --panel-deep:rgba(26,18,13,.3); --line:rgba(255,244,224,.2); --cream:#fff6e6; --soft:#f4e9d4;
    --glass:blur(16px) saturate(1.55) brightness(.5); --glass-deep:blur(22px) saturate(1.4) brightness(.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#231610;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;color:var(--cream);-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block}
  #c{position:fixed;inset:0}
  .hidden{display:none!important}

  /* ---- loading ---- */
  #load{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(130% 100% at 50% 0%,#5a3424 0%,#2e1c14 55%,#1a100c 100%)}
  #load h1{margin:0;font-size:34px;letter-spacing:.5px;font-weight:800;background:linear-gradient(90deg,#f6d9a0,#f2a95c 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
  #load .sub{color:#d8c4a0;font-size:13px}
  #bar{width:min(320px,70vw);height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  #bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#e8a34a,#f4c95d);transition:width .3s}

  /* ---- HUD ---- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:50}
  /* glass: the scene shows through, darkened behind the words so they stay sharp on the brightest sky */
  .card{background:var(--panel);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid var(--line);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.17),0 8px 26px rgba(14,9,5,.2);text-shadow:0 1px 2px rgba(0,0,0,.6)}
  body.lowfx{--glass:blur(9px) saturate(1.4) brightness(.46);--glass-deep:blur(11px) saturate(1.3) brightness(.38)}
  #status{position:absolute;top:12px;left:12px;padding:10px 14px;display:flex;gap:16px;align-items:center;font-size:13px}
  #status .ic{font-size:17px;margin-right:5px}
  #status b{font-weight:700}
  #clock b{font-variant-numeric:tabular-nums}
  #goldv{color:var(--gold)}
  #energy{position:absolute;bottom:92px;left:12px;width:180px;padding:8px 10px}
  #energy .lab{font-size:11px;color:var(--soft);display:flex;justify-content:space-between;margin-bottom:5px}
  #ebar{height:9px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  #hpbar{height:9px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}
  #hpbar>i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#d8603c,#e88a5a);transition:width .25s}
  #ebar>i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#b9c46a,#8ea04a);transition:width .25s}

  /* minimap */
  #mini{position:absolute;top:12px;right:12px;width:168px;height:168px;padding:7px;pointer-events:auto;cursor:zoom-in;transition:transform .15s}#mini:hover{transform:scale(1.03)}
  #mini .t{font-size:10px;color:var(--soft);letter-spacing:1px;text-transform:uppercase;margin:0 0 5px 3px}
  #mmc{width:154px;height:132px;border-radius:8px;display:block;background:#d6c59c;border:1px solid var(--line);opacity:.9}

  /* hotbar */
  #hot{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px}
  .slot{width:52px;height:52px;border-radius:10px;background:rgba(255,246,230,.08);border:1px solid rgba(255,246,230,.18);
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:.12s}
  .slot .em{font-size:23px;line-height:1}
  .slot .nm{font-size:8.5px;color:var(--soft);margin-top:2px;white-space:nowrap}
  .slot .cnt{position:absolute;right:4px;bottom:2px;font-size:10px;font-weight:700;color:var(--gold)}
  .slot .key{position:absolute;left:4px;top:2px;font-size:9px;color:#d8ccb4}
  .slot.on{background:rgba(232,163,74,.22);border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 6px 14px rgba(232,163,74,.25);transform:translateY(-3px)}

  /* crosshair */
  #cross{position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 0 2px rgba(0,0,0,.25);pointer-events:none}

  /* toasts */
  #toasts{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
  .toast{padding:7px 14px;border-radius:99px;font-size:13px;animation:tp 2.6s forwards}
  @keyframes tp{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

  /* panels (shop / inventory / menu) */
  .panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,90vw);max-height:80vh;overflow:auto;padding:20px;z-index:60;pointer-events:auto;background:var(--panel-deep);-webkit-backdrop-filter:var(--glass-deep);backdrop-filter:var(--glass-deep)}
  .panel h2{margin:0 0 4px;font-size:20px}
  .panel .hint{color:var(--soft);font-size:12px;margin-bottom:14px}
  .grid{clear:both;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
  .buy{background:rgba(255,246,230,.07);border:1px solid rgba(255,246,230,.14);border-radius:11px;padding:10px;cursor:pointer;transition:.12s;text-align:center}
  .buy:hover{border-color:var(--neon);background:rgba(232,163,74,.14)}
  .buy .em{font-size:26px}
  .buy .nm{font-size:12px;font-weight:600;margin-top:4px}
  .buy .pr{font-size:11px;color:#ffdc82;margin-top:2px}
  .buy.dim{opacity:.4;pointer-events:none}
  .xbtn{position:absolute;top:12px;right:14px;cursor:pointer;color:var(--soft);font-size:20px;pointer-events:auto}

  /* top controls */
  #top{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
  @media(max-width:1180px){#top{top:66px;left:12px;transform:none;flex-wrap:wrap;max-width:calc(100% - 200px)}#todo{top:112px!important}}
  .pill{font:600 12px/1 system-ui;color:var(--cream);background:var(--panel);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.15);text-shadow:0 1px 2px rgba(0,0,0,.6);padding:8px 13px;border-radius:999px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .pill:hover{border-color:var(--neon)}

  /* help */
  #help{position:absolute;bottom:14px;right:12px;max-width:230px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:var(--soft)}
  #help b{color:var(--cream)}
  kbd{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:1px 5px;font:600 10px/1 ui-monospace,monospace;color:var(--cream)}

  /* hiding panels */
  #hud>*{transition:opacity .22s}
  #hud>.gone,body.hudoff #top,body.hudoff #status,body.hudoff #mini,body.hudoff #energy,body.hudoff #hot,body.hudoff #cross,body.hudoff #help,body.hudoff #todo{opacity:0;pointer-events:none;visibility:hidden}
  #buffs{position:absolute;left:12px;top:64px;padding:6px 11px;font-size:12px} body.hudoff #buffs{opacity:0}
  #eyeback{position:fixed;right:14px;top:14px;z-index:58;opacity:.34;display:none;pointer-events:auto} #eyeback:hover{opacity:1} body.hudoff #eyeback{display:inline-flex}
  .hudrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:10px 2px;border-top:1px solid rgba(255,246,230,.14);cursor:pointer;font-size:14px} .hudrow i{font-style:normal;color:#ffdc82;font-size:13px}

  /* day transition */
  #fade{position:fixed;inset:0;z-index:150;background:#1a100c;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center}
  #fade.on{opacity:1}
  #fade .ft{font-size:22px;font-weight:700;color:#f1e4c8}

  @media (max-width:560px){

    .slot{width:40px;height:40px} .slot .em{font-size:17px} .slot .nm{display:none} .slot img{max-width:26px;max-height:26px}
    #hot{gap:4px;padding:5px;bottom:8px}
    #top{top:58px;left:12px;transform:none;flex-wrap:wrap;max-width:50%;gap:5px} .pill{padding:6px 8px;font-size:11px}
    #energy{width:136px;bottom:66px;padding:6px 8px}
    #help{display:none}
  }
  #guide{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(20,14,8,.16)}
  .gcard{width:min(460px,90vw);padding:30px 32px 24px;border-radius:20px;background:var(--panel-deep);-webkit-backdrop-filter:var(--glass-deep);backdrop-filter:var(--glass-deep);border:1px solid var(--line);color:var(--cream);text-shadow:0 1px 2px rgba(0,0,0,.6);text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.17),0 24px 70px rgba(0,0,0,.34)}
  .gcard .gic{font-size:42px} .gcard h2{margin:10px 0 12px;font-size:23px} .gcard p{white-space:pre-line;line-height:1.75;font-size:15px;color:var(--soft);margin:0 0 18px}
  .gdots{display:flex;justify-content:center;gap:7px;margin-bottom:18px} .gdots i{width:6px;height:6px;border-radius:50%;background:rgba(243,231,210,.26)} .gdots i.on{background:#f0c674}
  .grow{display:flex;justify-content:space-between;gap:12px} .grow button,#signprompt button{font:inherit;border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
  .gskip{background:none;color:var(--soft)} .gnext{background:#f0c674;color:#2a1e10;font-weight:700;flex:1}
  #todo{position:absolute;left:12px;top:120px;max-width:260px;padding:11px 13px;font-size:13px;line-height:1.7;z-index:30} #todo b{display:block;margin-bottom:3px} #todo b span{opacity:.6;font-weight:400;margin-left:6px} #todo .done{opacity:.46;text-decoration:line-through} #todo .now{color:#f0c674;font-weight:600}
  #bigmap{position:fixed;inset:0;z-index:85;display:flex;align-items:center;justify-content:center;background:rgba(20,14,8,.62);cursor:zoom-out} #bigmap canvas{border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
  #signprompt{position:fixed;right:20px;bottom:90px;z-index:88;width:300px;padding:16px 18px;color:#f3e7d2} #signprompt p{font-size:13px;line-height:1.6;margin:6px 0 12px;color:#dccfb8} #signprompt div{display:flex;gap:8px} #signprompt .go{background:#f0c674;color:#2a1e10;font-weight:700;flex:1} #signprompt .no{background:rgba(255,255,255,.08);color:#dccfb8}
</style>

    const holder=new THREE.Group(); holder.rotation.y=charYaw; holder.add(m);
    while(avatar.children.length) avatar.remove(avatar.children[0]);

function interact(){
  if(S.inHouse){ const sp=house.userData.spots, p=player.pos, n=q=>Math.hypot(p.x-q.x,p.z-q.z)<1.9;
    if(n(sp.door)){ leaveHouse(); return; } if(n(sp.bed)){ sleep(); return; } if(n(sp.tv)){ openTV(); return; }

const mm=$('#mmc'), mx=mm.getContext('2d');

let mapBase=null; const MAP_R=240;
function bakeMap(){
  const c=document.createElement('canvas'); c.width=c.height=720; const g=c.getContext('2d'), im=g.createImageData(720,720);
  for(let j=0;j<720;j++) for(let i=0;i<720;i++){ const x=(i/720-.5)*MAP_R*2, z=(j/720-.5)*MAP_R*2, f=lakeField(x,z), o=(j*720+i)*4;
    const a=vnoise(x*.12,z*.12)*14-7; let r=214+a,gg=197+a,b=156+a;
    if(f>0){ r=148+a*.4; gg=163+a*.4; b=128+a*.4; if(f<.012){ r=102; gg=120; b=92; } }
    else if(f>-.008){ r=176; gg=156; b=112; }
    im.data[o]=r; im.data[o+1]=gg; im.data[o+2]=b; im.data[o+3]=255; }
  g.putImageData(im,0,0);
  const px=(x,z)=>[(x/(MAP_R*2)+.5)*720,(z/(MAP_R*2)+.5)*720];
  g.strokeStyle='rgba(124,92,58,.75)'; g.lineWidth=2.6; g.setLineDash([7,4]); g.lineCap='round';
  for(const p of PATHS){ g.beginPath(); p.forEach((q,i)=>{ const a=px(q[0],q[1]); i?g.lineTo(a[0],a[1]):g.moveTo(a[0],a[1]); }); g.stroke(); }
  g.setLineDash([]);
  const cols=['#5b6e4c','#b08a3c','#a8603a'];
  miniTrees.forEach((t,i)=>{ if(i%2) return; const a=px(t.x,t.z); if(a[0]<0||a[0]>720||a[1]<0||a[1]>720) return; g.fillStyle=cols[t.c]; g.beginPath(); g.moveTo(a[0],a[1]-5); g.lineTo(a[0]+3,a[1]+2); g.lineTo(a[0]-3,a[1]+2); g.closePath(); g.fill(); });
  mapBase=c;
}
function drawMini(){
  const W=mm.width,H=mm.height, cx=W/2, cy=H/2, sc=W/(MM_RANGE*2);
  mx.clearRect(0,0,W,H);

  mx.fillStyle='#d6c59c'; mx.fillRect(0,0,W,H);
  const wx=player.pos.x, wz=player.pos.z;
  const toPx=(x,z)=>[cx+(x-wx)*sc, cy+(z-wz)*sc];
  // farm boundary
  mx.strokeStyle='rgba(255,255,255,.25)'; mx.lineWidth=1;
  mx.strokeStyle='rgba(90,60,30,.5)'; let a=toPx(-FARM_HALF,-FARM_HALF), b=toPx(FARM_HALF,FARM_HALF); mx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
  // pond
  if(mapBase) mx.drawImage(mapBase,cx-(wx+MAP_R)*sc,cy-(wz+MAP_R)*sc,MAP_R*2*sc,MAP_R*2*sc);
  // props
  // tilled + crops
  for(const [k,tl] of S.tiles){ if(!tl.tilled) continue; const [x,z]=k.split(',').map(Number); const p=toPx(x,z);
    mx.fillStyle=tl.crop?(tl.crop.stage>=CROPS[tl.crop.id].days?'#ffd66b':'#8fe39a'):(tl.watered?'#4a3322':'#6a4a30');
    mx.fillRect(p[0]-sc*0.4,p[1]-sc*0.4,sc*0.8,sc*0.8); }
  // landmarks
  const mark=(pp,col,lab)=>{ const p=toPx(pp.x,pp.z); mx.fillStyle=col; mx.beginPath(); mx.arc(p[0],p[1],3,0,7); mx.fill(); mx.fillStyle='#fff'; mx.font='7px sans-serif'; mx.fillText(lab,p[0]+4,p[1]+2); };
  mx.font='600 9px -apple-system,"PingFang SC",sans-serif'; for(const q of places()){ const p=toPx(q.x,q.z); if(p[0]<-4||p[1]<-4||p[0]>W+4||p[1]>H+4) continue; mx.fillStyle='#3a2a1c'; mx.beginPath(); mx.arc(p[0],p[1],2.2,0,7); mx.fill(); const tx=L(q.zh,q.en), tw=mx.measureText(tx).width; mx.fillStyle='rgba(250,242,226,.86)'; mx.fillRect(p[0]+3,p[1]-6,tw+4,11); mx.fillStyle='#3a2a1c'; mx.fillText(tx,p[0]+5,p[1]+3); }
  // player arrow
  mx.save(); mx.translate(cx,cy); mx.rotate(-cam.yaw+Math.PI);

let composer=null, gradeFx=null, lastRig=null;
// the hour's three-colour key: every value in the frame is pulled toward it, so the picture stays in one harmony
class HourGrade extends Effect {
  constructor(){ super('HourGrade',
    `uniform vec3 gS,gM,gH,uTint,uSunC; uniform float amt,flash,uLine,uT,uShaft,uAsp,uAO,uSharp; uniform vec2 uSunP; uniform sampler2D tUnder;
     float ign(vec2 p){ return fract(52.9829189*fract(dot(p,vec2(.06711056,.00583715)))); }
     float zlin(float d){ return cameraNear*cameraFar/(cameraFar-d*(cameraFar-cameraNear)); }
     // contact shade: a few depth taps around each pixel, so things sit on the ground and boughs hold shadow between them
     float contact(vec2 uv,float d){ if(d>=.99999) return 0.; float z=zlin(d); if(z>64.) return 0.; float j=ign(gl_FragCoord.xy)*6.2832, rad=clamp(1.5/z,.003,.024), o=0.; for(int i=0;i<6;i++){ float a=j+float(i)*1.0472, r=rad*(.4+float(i)*.14); float dz=z-zlin(readDepth(uv+vec2(cos(a)/uAsp,sin(a))*r)); o+=smoothstep(.03,.12,dz)*(1.-smoothstep(.7,1.8,dz)); } return o/6.*(1.-smoothstep(38.,64.,z)); }
     void mainImage(const in vec4 c, const in vec2 uv, const in float depth, out vec4 o){
       vec3 src=c.rgb; if(uSharp>.001){ vec3 nb=(texture2D(inputBuffer,uv+vec2(texelSize.x,0.)).rgb+texture2D(inputBuffer,uv-vec2(texelSize.x,0.)).rgb+texture2D(inputBuffer,uv+vec2(0.,texelSize.y)).rgb+texture2D(inputBuffer,uv-vec2(0.,texelSize.y)).rgb)*.25; src=max(src+(src-nb)*uSharp,vec3(0.)); }
       if(uAO>.001) src*=1.-contact(uv,depth)*uAO;
       float wob=sin(uv.x*30.+uT*2.)*.0016+sin(uv.x*11.-uT*1.3)*.0022, ln=uLine+wob*step(.001,uLine);
       if(uv.y<ln){ float dp=1.-uv.y/ln; vec2 q=vec2(uv.x+sin(uv.y*40.+uT*1.6)*.0015,(uv.y/ln)); vec3 u=texture2D(tUnder,q).rgb; u=mix(u*1.25,uTint*.3+vec3(.0,.012,.02),.2+dp*.28); u*=.96-dp*.5; float ray=smoothstep(.55,1.,sin(uv.x*22.+uT*.3+uv.y*6.)*.5+.5)*(1.-dp)*.1; src=u+uTint*ray; }
       vec3 col=pow(max(src,0.0),vec3(1.0/2.2));
       vec3 s=pow(gS,vec3(1.0/2.2)), m=pow(gM,vec3(1.0/2.2)), h=pow(gH,vec3(1.0/2.2));
       float l=dot(col,vec3(0.2126,0.7152,0.0722));
       vec3 g=l<0.5?mix(s,m,l*2.0):mix(m,h,(l-0.5)*2.0);
       col=mix(col,g+(col-vec3(l))*1.0,amt);
       col=clamp(col,0.0,1.0); col=mix(col,col*col*(3.0-2.0*col),0.14);
       if(uShaft>.001&&uv.y>=ln){ vec2 dl=uSunP-uv; float r=length(dl*vec2(uAsp,1.));              // light falling through the trees and over the ridges, stopped by whatever stands in the way
         if(r<1.5){ float j=ign(gl_FragCoord.xy), occ=0.; for(int i=0;i<10;i++){ vec2 q=clamp(uv+dl*(float(i)+j)/10.,vec2(.001),vec2(.999)); occ+=step(.9999995,readDepth(q)); } occ/=10.;
           vec3 sc=pow(uSunC,vec3(1.0/2.2)); float a=occ*(exp(-r*2.5)*.42+exp(-r*r*16.)*.5)*uShaft; col=1.-(1.-col)*(1.-sc*clamp(a,0.,.9)); } }
       float d=distance(uv,vec2(0.5)); col*=1.0-d*d*0.2;
       if(uLine>.01){ float e=smoothstep(.0035,.0,abs(uv.y-ln)); col=mix(col,vec3(.96,.98,1.),e*.85); }
       col+=flash*.42;
       o=vec4(pow(col,vec3(2.2)),c.a);
     }`,

function dayNight(t,dt){
  if(S.inMine||S.inHouse){ if(gradeFx) gradeFx.uniforms.get('uShaft').value=0; return; }     // the mine keeps its own dark lighting
  const R=updateScenery(t,dt,S.time,S.weather,camera,player,S.day%9===4); lastRig=R;
  // long low shadows at the ends of the day. The light only turns in small steps and its frustum snaps to whole shadow texels, so edges stay still as you walk
  sunWant.copy(R.sunDir); sunWant.y=Math.max(sunWant.y,.25); sunWant.normalize(); if(sunWant.distanceToSquared(sunDirL)>.00002) sunDirL.copy(sunWant);
  lightX.crossVectors(sunDirL,UP3).normalize(); lightY.crossVectors(lightX,sunDirL).normalize();
  { const tex=2*sc/sun.shadow.mapSize.x, a=player.pos.dot(lightX), b=player.pos.dot(lightY); sunFix.copy(player.pos).addScaledVector(lightX,Math.round(a/tex)*tex-a).addScaledVector(lightY,Math.round(b/tex)*tex-b); }
  sun.position.copy(sunFix).addScaledVector(sunDirL,120);
  sun.target.position.copy(sunFix); sun.target.updateMatrixWorld();
  sun.intensity=R.sunI; sun.color.copy(R.sunCol);
  hemi.color.copy(R.ambCol); hemi.intensity=R.ambI;
  scene.fog.color.copy(R.fogCol); scene.fog.density=R.fog;
  updateBuildings(t,dt,R.night,clamp((S.time-1100)/120,0,1));
  if(jellyOn) updateJellies(t);

    camera.getWorldDirection(camFwd); const facing=camFwd.dot(R.sunDir); sunNdc.copy(camera.position).addScaledVector(R.sunDir,3000).project(camera); u.get('uSunP').value.set(sunNdc.x*.5+.5,sunNdc.y*.5+.5); u.get('uAsp').value=camera.aspect; u.get('uSunC').value.copy(R.sunC);

}
