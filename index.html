<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>StarVale · 星星人露谷</title>
<style>
  :root{
    --neon:#5bd1ff; --gold:#ffd66b; --leaf:#8fe39a; --ink:#06121f; --panel:rgba(8,16,26,.82);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0a1420;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#eaf6ff;-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block}
  #c{position:fixed;inset:0}
  .hidden{display:none!important}

  /* ---- loading ---- */
  #load{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(130% 100% at 50% 0%,#12314f 0%,#0a1726 55%,#060e18 100%)}
  #load h1{margin:0;font-size:34px;letter-spacing:.5px;font-weight:800;background:linear-gradient(90deg,#9fe8ff,#ffe39a 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
  #load .sub{color:#9fc0d8;font-size:13px}
  #bar{width:min(320px,70vw);height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  #bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--neon),var(--leaf));transition:width .3s}

  /* ---- HUD ---- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:50}
  .card{background:var(--panel);border:1px solid rgba(91,209,255,.22);border-radius:14px;backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);box-shadow:0 8px 30px rgba(0,0,0,.35)}
  #status{position:absolute;top:12px;left:12px;padding:10px 14px;display:flex;gap:16px;align-items:center;font-size:13px}
  #status .ic{font-size:17px;margin-right:5px}
  #status b{font-weight:700}
  #clock b{font-variant-numeric:tabular-nums}
  #goldv{color:var(--gold)}
  #energy{position:absolute;bottom:92px;left:12px;width:180px;padding:8px 10px}
  #energy .lab{font-size:11px;color:#a9c6da;display:flex;justify-content:space-between;margin-bottom:5px}
  #ebar{height:9px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  #ebar>i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#7CFFB2,#36d08a);transition:width .25s}

  /* minimap */
  #mini{position:absolute;top:12px;right:12px;width:168px;height:168px;padding:7px}
  #mini .t{font-size:10px;color:#9fc0d8;letter-spacing:1px;text-transform:uppercase;margin:0 0 5px 3px}
  #mmc{width:154px;height:132px;border-radius:9px;display:block;background:#0c1b2a}

  /* hotbar */
  #hot{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px}
  .slot{width:52px;height:52px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:.12s}
  .slot .em{font-size:23px;line-height:1}
  .slot .nm{font-size:8.5px;color:#bcd6e8;margin-top:2px;white-space:nowrap}
  .slot .cnt{position:absolute;right:4px;bottom:2px;font-size:10px;font-weight:700;color:var(--gold)}
  .slot .key{position:absolute;left:4px;top:2px;font-size:9px;color:#6d8598}
  .slot.on{background:rgba(91,209,255,.16);border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 6px 18px rgba(91,209,255,.25);transform:translateY(-3px)}

  /* crosshair */
  #cross{position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 0 2px rgba(0,0,0,.25);pointer-events:none}

  /* toasts */
  #toasts{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
  .toast{padding:7px 14px;border-radius:99px;font-size:13px;animation:tp 2.6s forwards}
  @keyframes tp{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

  /* panels (shop / inventory / menu) */
  .panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,90vw);max-height:80vh;overflow:auto;padding:20px;z-index:60;pointer-events:auto}
  .panel h2{margin:0 0 4px;font-size:20px}
  .panel .hint{color:#9fc0d8;font-size:12px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
  .buy{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:10px;cursor:pointer;transition:.12s;text-align:center}
  .buy:hover{border-color:var(--neon);background:rgba(91,209,255,.1)}
  .buy .em{font-size:26px}
  .buy .nm{font-size:12px;font-weight:600;margin-top:4px}
  .buy .pr{font-size:11px;color:var(--gold);margin-top:2px}
  .buy.dim{opacity:.4;pointer-events:none}
  .xbtn{position:absolute;top:12px;right:14px;cursor:pointer;color:#9fc0d8;font-size:20px;pointer-events:auto}

  /* top controls */
  #top{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
  .pill{font:600 12px/1 system-ui;color:#cfe;background:var(--panel);border:1px solid rgba(91,209,255,.3);padding:8px 13px;border-radius:999px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .pill:hover{border-color:var(--neon)}

  /* help */
  #help{position:absolute;bottom:14px;right:12px;max-width:230px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#bcd6e8}
  #help b{color:#eaf6ff}
  kbd{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:1px 5px;font:600 10px/1 ui-monospace,monospace;color:#eaf6ff}

  /* day transition */
  #fade{position:fixed;inset:0;z-index:150;background:#030912;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center}
  #fade.on{opacity:1}
  #fade .ft{font-size:22px;font-weight:700;color:#cfe}

  @media (max-width:560px){
    #mini{width:120px;height:122px} #mmc{width:106px;height:88px}
    #status{gap:9px;font-size:11px;padding:8px 10px}
    .slot{width:44px;height:44px} .slot .em{font-size:19px}
    #help{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="load">
  <h1>🌾 StarVale</h1>
  <div class="sub" id="loadsub">星星人露谷 · 正在生成世界…</div>
  <div id="bar"><i></i></div>
</div>

<div id="hud" class="hidden">
  <div id="top">
    <span class="pill" id="qualbtn">⚙ 均衡</span>
    <span class="pill" id="langbtn">🌐 中文</span>
    <a class="pill" href="./mc.html">⛏ Minecraft 模式</a>
    <span class="pill" id="resetbtn" title="new game">🆕</span>
    <span class="pill" id="fps" style="pointer-events:none;opacity:.75">60 fps</span>
  </div>

  <div id="status" class="card">
    <div id="season"><span class="ic">🌱</span><b>春 · 1</b></div>
    <div id="clock"><span class="ic">🕕</span><b>6:00 AM</b></div>
    <div id="weather"><span class="ic">☀️</span></div>
    <div id="gold"><span class="ic">🪙</span><b id="goldv">500</b></div>
  </div>

  <div id="mini" class="card">
    <div class="t" id="minit">地图 MAP</div>
    <canvas id="mmc" width="308" height="264"></canvas>
  </div>

  <div id="energy" class="card">
    <div class="lab"><span id="enlab">体力 Energy</span><span id="env">270/270</span></div>
    <div id="ebar"><i></i></div>
  </div>

  <div id="hot"></div>
  <div id="cross"></div>
  <div id="toasts"></div>
  <div id="help" class="card">
    <b id="h0">操作</b><br>
    <kbd>WASD</kbd> <span id="h1">移动</span> · <kbd>Shift</kbd> <span id="h2">奔跑</span><br>
    <span id="h3">鼠标</span> <span id="h4">视角</span> · <kbd>1-5</kbd> <span id="h5">工具</span><br>
    <kbd>←click</kbd> <span id="h6">使用工具</span> · <kbd>E</kbd> <span id="h7">交互/睡觉</span><br>
    <kbd>B</kbd> <span id="h8">商店</span> · <kbd>Tab</kbd> <span id="h9">背包</span><br>
    <kbd>C</kbd> <span id="h10">制作</span> · <kbd>F</kbd> <span id="h11">钓鱼</span> · <kbd>E</kbd> <span id="h12">鸡舍/矿洞/交谈</span>
  </div>
</div>

<div id="fade"><div class="ft" id="fadet"></div></div>

<!-- shop -->
<div id="shop" class="panel card hidden">
  <span class="xbtn" data-close="shop">✕</span>
  <h2 id="shopt">🏪 种子商店</h2>
  <div class="hint" id="shoph">点击购买当季种子。回到农场，犁地后右击种下。</div>
  <div class="grid" id="shopg"></div>
</div>

<!-- inventory -->
<div id="inv" class="panel card hidden">
  <span class="xbtn" data-close="inv">✕</span>
  <h2 id="invt">🎒 背包</h2>
  <div class="hint" id="invh">点击种子以手持，之后左击已犁松的土地种植。</div>
  <div class="grid" id="invg"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/",

  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

} from 'postprocessing';

/* ======================================================================
   StarVale · 星星人露谷 — a Stardew-Valley-style farming life sim.
   Clean modern three.js scene (HDRI-lit PBR, smooth non-blocky props).
   The classic voxel game lives on at /mc.html (switchable, not removed).
   ====================================================================== */

const $ = s => document.querySelector(s);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;

/* ---------- i18n ---------- */
let LANG = localStorage.getItem('sv_lang') || 'zh';
const T = {

};
const t = k => (T[LANG][k] ?? T.en[k] ?? k);

/* ---------- crops ---------- */
// season: index 0..3 it grows in (or 'all'); days: days to mature; price: sell; seed: buy cost
const CROPS = {
  parsnip:   {em:'🥕', nm:{zh:'防风草',en:'Parsnip'},   season:[0], days:4, price:35,  seed:20, col:0xe8c35a, fruit:0xd9a12e },
  potato:    {em:'🥔', nm:{zh:'土豆',en:'Potato'},     season:[0], days:6, price:80,  seed:50, col:0x7fae5b, fruit:0xb98a4e },
  cauliflower:{em:'🥦',nm:{zh:'花椰菜',en:'Cauliflower'},season:[0],days:12,price:175, seed:80, col:0x9ec96a, fruit:0xe7edc9 },

  blueberry: {em:'🫐', nm:{zh:'蓝莓',en:'Blueberry'},  season:[1], days:7, price:80,  seed:80, col:0x5fa85a, fruit:0x4a6fd1 },
  tomato:    {em:'🍅', nm:{zh:'番茄',en:'Tomato'},     season:[1], days:8, price:60,  seed:50, col:0x62a24d, fruit:0xe5503a },
  corn:      {em:'🌽', nm:{zh:'玉米',en:'Corn'},       season:[1,2],days:10,price:50, seed:70, col:0x8fc35a, fruit:0xf2d04b },
  pepper:    {em:'🌶️', nm:{zh:'辣椒',en:'Pepper'},     season:[1], days:5, price:55,  seed:40, col:0x6fb04d, fruit:0xd63a2f },
  pumpkin:   {em:'🎃', nm:{zh:'南瓜',en:'Pumpkin'},    season:[2], days:13,price:320, seed:100,col:0x8aad55, fruit:0xe08a2a },
  eggplant:  {em:'🍆', nm:{zh:'茄子',en:'Eggplant'},   season:[2], days:5, price:60,  seed:20, col:0x6f9b4d, fruit:0x7a4ba0 },
  cranberry: {em:'🔴', nm:{zh:'蔓越莓',en:'Cranberry'},season:[2], days:7, price:75,  seed:240,col:0x5fa05a, fruit:0xc0392b },

  kale:      {em:'🥬', nm:{zh:'羽衣甘蓝',en:'Kale'},   season:[0], days:6, price:110, seed:70, col:0x6fae5b, fruit:0x4f8f3a },
  radish:    {em:'🔴', nm:{zh:'萝卜',en:'Radish'},     season:[1], days:6, price:90,  seed:40, col:0x8fc35a, fruit:0xe0506a },
  melon:     {em:'🍈', nm:{zh:'甜瓜',en:'Melon'},      season:[1], days:12,price:250, seed:80, col:0x8fc35a, fruit:0xa8d26a },
  wheat:     {em:'🌾', nm:{zh:'小麦',en:'Wheat'},      season:[1,2],days:4,price:25,  seed:10, col:0xd8c25a, fruit:0xe8d06a },
  grape:     {em:'🍇', nm:{zh:'葡萄',en:'Grape'},      season:[2], days:10,price:80,  seed:60, col:0x7fae5b, fruit:0x7a4ba0 }
};
const cropName = id => CROPS[id].nm[LANG] || CROPS[id].nm.en;

/* ---------- fish / ore / products / materials / craftables ---------- */
const FISH={
  carp:{em:'🐟',nm:{zh:'鲤鱼',en:'Carp'},price:30,season:[0,1,2,3]},
  sardine:{em:'🐠',nm:{zh:'沙丁鱼',en:'Sardine'},price:45,season:[0,2,3]},
  bass:{em:'🎣',nm:{zh:'鲈鱼',en:'Bass'},price:60,season:[0,1,2,3]},
  salmon:{em:'🐡',nm:{zh:'鲑鱼',en:'Salmon'},price:80,season:[2]},
  tuna:{em:'🐟',nm:{zh:'金枪鱼',en:'Tuna'},price:110,season:[1,3]},
  catfish:{em:'🐠',nm:{zh:'鲶鱼',en:'Catfish'},price:130,season:[0,2]}
};
const ORES={
  coal:{em:'⚫',nm:{zh:'煤',en:'Coal'},price:15},
  copper:{em:'🟠',nm:{zh:'铜矿',en:'Copper'},price:20},
  iron:{em:'⚙️',nm:{zh:'铁矿',en:'Iron'},price:40},
  gold_ore:{em:'🟡',nm:{zh:'金矿',en:'Gold'},price:80},
  gem:{em:'💎',nm:{zh:'宝石',en:'Gem'},price:160}
};
const PRODUCTS={ egg:{em:'🥚',nm:{zh:'鸡蛋',en:'Egg'},price:50}, milk:{em:'🥛',nm:{zh:'牛奶',en:'Milk'},price:125} };
const MATS={ wood:{em:'🪵',nm:{zh:'木头',en:'Wood'},price:2}, stone:{em:'🪨',nm:{zh:'石头',en:'Stone'},price:2}, fiber:{em:'🌿',nm:{zh:'纤维',en:'Fiber'},price:1} };
const CRAFTABLES={
  sprinkler:{em:'💧',nm:{zh:'洒水器',en:'Sprinkler'},cost:{'mat:stone':2,'ore:copper':1}},
  scarecrow:{em:'🥷',nm:{zh:'稻草人',en:'Scarecrow'},cost:{'mat:wood':12,'mat:fiber':4}},
  fence:{em:'🪵',nm:{zh:'栅栏',en:'Fence'},cost:{'mat:wood':2}},
  torch:{em:'🔥',nm:{zh:'火把',en:'Torch'},cost:{'mat:wood':1,'ore:coal':1}}
};
const FOOD={
  fried_egg:{em:'🍳',nm:{zh:'煎蛋',en:'Fried Egg'},price:55,energy:50},
  omelet:{em:'🍲',nm:{zh:'蛋卷',en:'Omelet'},price:125,energy:100},
  baked_potato:{em:'🥔',nm:{zh:'烤土豆',en:'Baked Potato'},price:90,energy:55},
  salad:{em:'🥗',nm:{zh:'田园沙拉',en:'Salad'},price:110,energy:70},
  pumpkin_pie:{em:'🥧',nm:{zh:'南瓜派',en:'Pumpkin Pie'},price:385,energy:180},
  sashimi:{em:'🍣',nm:{zh:'生鱼片',en:'Sashimi'},price:95,energy:75},
  bread:{em:'🍞',nm:{zh:'面包',en:'Bread'},price:60,energy:50}
};
const COOK={
  fried_egg:{cost:{'product:egg':1}}, omelet:{cost:{'product:egg':1,'product:milk':1}},
  baked_potato:{cost:{'crop:potato':1}}, salad:{cost:{'crop:kale':1,'crop:radish':1}},
  pumpkin_pie:{cost:{'crop:pumpkin':1,'product:milk':1,'product:egg':1}},
  sashimi:{cost:{'fish:salmon':1}}, bread:{cost:{'crop:wheat':2}}
};
const DB={seed:CROPS,crop:CROPS,fish:FISH,ore:ORES,product:PRODUCTS,mat:MATS,craft:CRAFTABLES,food:FOOD};
function metaOf(kind,id){
  const d=(DB[kind]||{})[id];
  if(kind==='seed') return {em:CROPS[id].em, name:cropName(id)+' '+t('seedsuf'), price:0};
  if(!d) return {em:'❔',name:id,price:0};
  return { em:d.em, name:(d.nm&&(d.nm[LANG]||d.nm.en))||id, price:d.price||0 };
}
const SELLABLE=['crop','fish','ore','product','food'];
function payCost(cost){ for(const k in cost){ const [kind,id]=k.split(':'); if(invCount(kind,id)<cost[k]) return false; } for(const k in cost){ const [kind,id]=k.split(':'); invTake(kind,id,cost[k]); } return true; }
function costStr(cost){ return Object.keys(cost).map(k=>{ const [kind,id]=k.split(':'); return metaOf(kind,id).em+cost[k]; }).join(' '); }
function hasCost(cost){ for(const k in cost){ const [kind,id]=k.split(':'); if(invCount(kind,id)<cost[k]) return false; } return true; }

/* ============================ NOISE ============================ */
function hash2(x,z){ let n=Math.sin(x*127.1+z*311.7)*43758.5453; return n-Math.floor(n); }
function vnoise(x,z){
  const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi;
  const u=xf*xf*(3-2*xf), v=zf*zf*(3-2*zf);
  const a=hash2(xi,zi),b=hash2(xi+1,zi),c=hash2(xi,zi+1),d=hash2(xi+1,zi+1);
  return lerp(lerp(a,b,u),lerp(c,d,u),v);
}
const FARM_HALF = 13;                       // flat farmland |x|,|z| <= 13
function terrainH(x,z){
  const edge = Math.max(0, (Math.max(Math.abs(x),Math.abs(z))-FARM_HALF)/18);
  const roll = (vnoise(x*0.06,z*0.06)-0.5)*5 + (vnoise(x*0.14,z*0.14)-0.5)*1.4;
  return roll * clamp(edge,0,1)*clamp(edge,0,1);
}

const MODELS={};
async function loadModels(){
  const list=['tree_01','tree_02','rock_01','boulder_01','bush_01','bush_02','flower_01','flower_02','stump_01','grass_clump'];
  await Promise.all(list.map(n=>gltfLoader.loadAsync('assets/models/'+n+'.glb')

    .catch(()=>{})));

function modelFit(name,targetH){ const g=MODELS[name]; if(!g) return null;
  const b=new THREE.Box3().setFromObject(g.scene); const s=new THREE.Vector3(); b.getSize(s);
  return { g, base:targetH/(s.y||1), minY:b.min.y }; }
function placeModel(name,targetH,spots,varyLight){
  const fit=modelFit(name,targetH); if(!fit) return false;
  const meshes=[]; fit.g.scene.updateMatrixWorld(true); fit.g.scene.traverse(o=>{ if(o.isMesh) meshes.push(o); });
  const grp=new THREE.Group(); world.add(grp); const d=new THREE.Object3D();
  if(meshes.length===1){
    const src=meshes[0]; const im=new THREE.InstancedMesh(src.geometry, src.material, spots.length);
    im.castShadow=true; im.receiveShadow=true; const col=new THREE.Color();
    spots.forEach((p,i)=>{ const sc=fit.base*(p.s||1); d.position.set(p.x, terrainH(p.x,p.z)-fit.minY*sc, p.z); d.rotation.y=p.ry||0; d.scale.setScalar(sc); d.updateMatrix(); im.setMatrixAt(i,d.matrix);
      if(varyLight){ col.setScalar(0.78+Math.random()*0.36); im.setColorAt(i,col); } });
    im.instanceMatrix.needsUpdate=true; if(varyLight&&im.instanceColor) im.instanceColor.needsUpdate=true; grp.add(im);
  } else {
    spots.forEach(p=>{ const c=fit.g.scene.clone(true); const sc=fit.base*(p.s||1);
      c.position.set(p.x, terrainH(p.x,p.z)-fit.minY*sc, p.z); c.rotation.y=p.ry||0; c.scale.setScalar(sc);
      c.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} }); grp.add(c); });
  }
  return true;
}
function ringSpots(n,rMin,rMax,sMin,sMax,clearFarm){
  const a=[]; for(let i=0;i<n*4 && a.length<n;i++){
    const ang=Math.random()*Math.PI*2, rad=rMin+Math.random()*(rMax-rMin);
    const x=Math.cos(ang)*rad, z=Math.sin(ang)*rad; if(Math.abs(x)>95||Math.abs(z)>95) continue;
    if(clearFarm && Math.abs(x)<FARM_HALF+2 && Math.abs(z)<FARM_HALF+2) continue;
    a.push({x,z,ry:Math.random()*6.28,s:sMin+Math.random()*(sMax-sMin)});
  } return a;
}

// ground mesh — real grass PBR, tinted per season
let ground;
function buildGround(){
  const N=140, SZ=200;
  const geo=new THREE.PlaneGeometry(SZ,SZ,N,N); geo.rotateX(-Math.PI/2);
  const pos=geo.attributes.position;
  for(let i=0;i<pos.count;i++){ const x=pos.getX(i), z=pos.getZ(i); pos.setY(i, terrainH(x,z)); }
  geo.computeVertexNormals();
  const mat=new THREE.MeshStandardMaterial({ map:TEX.grass.map, normalMap:TEX.grass.normalMap,
    roughnessMap:TEX.grass.arm, metalnessMap:TEX.grass.arm, roughness:1, metalness:1 });
  mat.normalScale.set(0.6,0.6);
  ground=new THREE.Mesh(geo,mat); ground.receiveShadow=true; world.add(ground);
}

// lush instanced grass field (wind-animated), meadow ring around the farm plot
function buildGrassField(){
  // tapered triangle blade (base width ~7cm, tip ~32cm) — reads as fine grass, not flags
  const blade=new THREE.BufferGeometry();
  blade.setAttribute('position', new THREE.Float32BufferAttribute([-0.035,0,0, 0.035,0,0, 0,0.36,0],3));
  blade.setAttribute('normal', new THREE.Float32BufferAttribute([0,0,1, 0,0,1, 0,0,1],3));
  blade.setAttribute('color', new THREE.Float32BufferAttribute([0.15,0.33,0.10, 0.15,0.33,0.10, 0.5,0.80,0.36],3)); // dark base → bright tip
  const mat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:0.92,metalness:0,side:THREE.DoubleSide});
  mat.onBeforeCompile=sh=>{ sh.uniforms.uTime={value:0}; grassUniform=sh.uniforms.uTime;
    sh.vertexShader='uniform float uTime;\n'+sh.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n float w=sin(uTime*1.7 + instanceMatrix[3][0]*0.5 + instanceMatrix[3][2]*0.5)*0.16*transformed.y;\n transformed.x+=w; transformed.z+=w*0.5;'); };
  const COUNT=4200; const im=new THREE.InstancedMesh(blade,mat,COUNT); const d=new THREE.Object3D(); let n=0;
  for(let i=0;i<COUNT*3 && n<COUNT;i++){
    // clump: pick a clump center, scatter blades tightly around it → denser carpet
    const cx=(Math.random()-.5)*(FARM_HALF*2+18), cz=(Math.random()-.5)*(FARM_HALF*2+18);
    const x=cx+(Math.random()-.5)*1.2, z=cz+(Math.random()-.5)*1.2;
    if(Math.abs(x)<7.5 && Math.abs(z)<7.5) continue;            // keep the central farming plot clear
    d.position.set(x,terrainH(x,z),z); d.rotation.y=Math.random()*6; d.scale.set(1,0.75+Math.random()*0.7,1);
    d.updateMatrix(); im.setMatrixAt(n++,d.matrix);
  }
  im.count=n; im.instanceMatrix.needsUpdate=true; im.castShadow=false; world.add(im); grassIM=im;
}

let critters=[];
function buildCritters(){
  const G=new THREE.Group(); world.add(G);
  const bcols=[0xff7eb0,0xffd45e,0x8ecdff,0xff9a4a,0xc58bff];
  for(let i=0;i<9;i++){
    const b=new THREE.Group();
    const wm=new THREE.MeshStandardMaterial({color:bcols[i%5],side:THREE.DoubleSide,roughness:0.55,emissive:bcols[i%5],emissiveIntensity:0.18});
    const wl=new THREE.Mesh(new THREE.CircleGeometry(0.13,10,Math.PI*0.5,Math.PI),wm);
    const wr=new THREE.Mesh(new THREE.CircleGeometry(0.13,10,Math.PI*1.5,Math.PI),wm);
    b.add(wl,wr); G.add(b);
    critters.push({o:b,wl,wr,bf:true,x:(Math.random()-.5)*26,z:(Math.random()-.5)*26,ph:Math.random()*6.28,sp:0.5+Math.random()*0.5});
  }
  for(let i=0;i<5;i++){
    const bird=new THREE.Group(); const bm=new THREE.MeshBasicMaterial({color:0x2c2a28});
    const wl=new THREE.Mesh(new THREE.PlaneGeometry(1.0,0.16),bm); wl.position.x=-0.5;
    const wr=new THREE.Mesh(new THREE.PlaneGeometry(1.0,0.16),bm); wr.position.x=0.5;
    bird.add(wl,wr); G.add(bird);
    critters.push({o:bird,wl,wr,bf:false,r:28+i*7,ph:i*1.5,sp:0.1+Math.random()*0.05,h:15+i*3});
  }
}
function updateCritters(t){
  for(const c of critters){
    if(c.bf){ const tt=t*c.sp+c.ph;
      c.o.position.set(c.x+Math.sin(tt)*3.4, 0.7+Math.abs(Math.sin(tt*2.2))*0.7, c.z+Math.cos(tt*0.8)*3.4);
      c.o.rotation.y=Math.atan2(Math.cos(tt),-Math.sin(tt*0.8));
      const f=Math.sin(t*16+c.ph)*0.6+0.4; c.wl.rotation.y=f; c.wr.rotation.y=-f;
    } else { const a=t*c.sp+c.ph;
      c.o.position.set(Math.cos(a)*c.r, c.h, Math.sin(a)*c.r); c.o.rotation.y=-a;
      const f=Math.sin(t*5+c.ph)*0.5; c.wl.rotation.z=f; c.wr.rotation.z=-f; }
  }
}

/* smooth props ------------------------------------------------------ */
function noisedGeo(geo, amp){
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const n=(hash2(x*13+y*7, z*13+y*3)-0.5)*amp;
    const l=Math.hypot(x,y,z)||1;
    p.setXYZ(i,x+x/l*n,y+y/l*n,z+z/l*n);
  }
  geo.computeVertexNormals(); return geo;
}
// tree: tapered trunk + layered rounded canopy (no cubes)
function makeTree(){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.28,2.1,8), barkMat);
  trunk.position.y=1.05; trunk.castShadow=true; g.add(trunk);
  const leafMat=new THREE.MeshStandardMaterial({color:0x3f7d3a,roughness:0.8,flatShading:true});
  for(let i=0;i<3;i++){
    const r=1.3-i*0.28;
    const c=new THREE.Mesh(noisedGeo(new THREE.IcosahedronGeometry(r,1),0.18), leafMat);
    c.position.y=2.1+i*0.75; c.castShadow=true; c.rotation.y=i*1.3; g.add(c);
  }
  return g;
}
function makeRock(s){
  const m=new THREE.Mesh(noisedGeo(new THREE.IcosahedronGeometry(s,1),s*0.4),
    new THREE.MeshStandardMaterial({color:0x8d9299,roughness:0.95,flatShading:true}));
  m.position.y=s*0.55; m.castShadow=true; m.receiveShadow=true; return m;
}
function makeBush(){
  const g=new THREE.Group(); const mat=new THREE.MeshStandardMaterial({color:0x47893f,roughness:0.85,flatShading:true});
  for(let i=0;i<4;i++){ const r=0.4+Math.random()*0.25; const s=new THREE.Mesh(noisedGeo(new THREE.IcosahedronGeometry(r,1),0.12),mat);
    s.position.set((Math.random()-.5)*0.7,r*0.8,(Math.random()-.5)*0.7); s.castShadow=true; g.add(s);} return g;
}
function makeFlower(col){
  const g=new THREE.Group();
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,0.4,5),new THREE.MeshStandardMaterial({color:0x4a8b3a}));
  stem.position.y=0.2; g.add(stem);
  const head=new THREE.Mesh(new THREE.IcosahedronGeometry(0.12,0),new THREE.MeshStandardMaterial({color:col,roughness:0.7,flatShading:true}));
  head.position.y=0.44; g.add(head); return g;
}

function scatterProps(){
  const trees=new THREE.Group(), rocks=new THREE.Group(), bushes=new THREE.Group(), flowers=new THREE.Group();
  for(let i=0;i<120;i++){
    const a=Math.random()*Math.PI*2, rad=FARM_HALF+6+Math.random()*78;
    const x=Math.cos(a)*rad, z=Math.sin(a)*rad; if(Math.abs(x)>96||Math.abs(z)>96) continue;
    const r=Math.random();
    if(r<0.5){ const tr=makeTree(); tr.position.set(x,terrainH(x,z),z); tr.scale.setScalar(0.8+Math.random()*0.7); tr.rotation.y=Math.random()*6; trees.add(tr); }
    else if(r<0.75){ const rk=makeRock(0.5+Math.random()*1.2); rk.position.set(x,terrainH(x,z)+ (0.5+Math.random()*1.2)*0.0,z); rk.position.y=terrainH(x,z); bushes.add(rk); }
    else { const b=makeBush(); b.position.set(x,terrainH(x,z),z); b.scale.setScalar(0.7+Math.random()); bushes.add(b); }
  }
  // decorative rocks + flowers sprinkled near farm edge

  trees.children.forEach(o=>propMini.push({x:o.position.x,z:o.position.z,c:'#2f6d35',r:2}));

}

  // layered distant mountain ridges (silhouette depth, like Cast-n-Chill backdrops)

  // dark pine silhouettes on the nearer hills (Cast-n-Chill forest line)
  const pineMat=new THREE.MeshStandardMaterial({color:0x33442f,roughness:0.9});

/* ---- fireflies at dusk/night (cozy ambiance) ---- */
let fireflies=null, ffMat=null;
function buildFireflies(){
  const N=70, g=new THREE.BufferGeometry(), pos=new Float32Array(N*3), ph=new Float32Array(N);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*52; pos[i*3+1]=0.4+Math.random()*2.6; pos[i*3+2]=(Math.random()-.5)*52; ph[i]=Math.random()*6.28; }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.userData.base=pos.slice(0); g.userData.ph=ph;
  ffMat=new THREE.PointsMaterial({ color:0xffe08a, size:0.2, transparent:true, opacity:0, depthWrite:false, blending:THREE.AdditiveBlending });
  fireflies=new THREE.Points(g,ffMat); fireflies.frustumCulled=false; scene.add(fireflies);
}
function updateFireflies(t){
  if(!fireflies) return;
  if(S.inMine){ ffMat.opacity=0; return; }
  const night=skyU.night.value; ffMat.opacity=night*0.95; if(night<0.02) return;
  const p=fireflies.geometry.attributes.position, base=fireflies.geometry.userData.base, ph=fireflies.geometry.userData.ph;
  for(let i=0;i<p.count;i++){ p.setXYZ(i, base[i*3]+Math.sin(t*0.6+ph[i])*1.6, base[i*3+1]+Math.sin(t*0.9+ph[i]*2)*0.6, base[i*3+2]+Math.cos(t*0.5+ph[i])*1.6); }
  p.needsUpdate=true; fireflies.position.set(player.pos.x,0,player.pos.z);
}

/* ---- seasonal falling particles: spring petals / fall leaves / winter snow ---- */
let petals=null, petalMat=null;
function buildPetals(){
  const N=130, g=new THREE.BufferGeometry(), pos=new Float32Array(N*3), vel=new Float32Array(N);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*60; pos[i*3+1]=Math.random()*18; pos[i*3+2]=(Math.random()-.5)*60; vel[i]=0.5+Math.random()*0.9; }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.userData.vel=vel;
  petalMat=new THREE.PointsMaterial({ color:0xffc0d6, size:0.24, transparent:true, opacity:0, depthWrite:false });
  petals=new THREE.Points(g,petalMat); petals.frustumCulled=false; scene.add(petals);
}
function updatePetals(dt){
  if(!petals||S.inMine){ if(petalMat)petalMat.opacity=0; return; }
  const cfg=[[0xffc6dc,0.85,0.24],[0xbfe28a,0.12,0.18],[0xe39a44,0.85,0.26],[0xffffff,0.9,0.22]][S.season]; // spring petals / summer wisp / fall leaves / snow
  petalMat.color.setHex(cfg[0]); petalMat.opacity=cfg[1]; petalMat.size=cfg[2];
  if(cfg[1]<0.05) return;
  const p=petals.geometry.attributes.position, vel=petals.geometry.userData.vel;
  for(let i=0;i<p.count;i++){ let y=p.getY(i)-vel[i]*dt; let x=p.getX(i)+Math.sin(y*0.6+i)*dt*0.5; if(y<0){ y=18; x=(Math.random()-.5)*60; } p.setXYZ(i,x,y,p.getZ(i)); }
  p.needsUpdate=true; petals.position.set(player.pos.x,0,player.pos.z);
}

/* crop stage mesh */
const CROP_FORM={parsnip:'root',radish:'root',potato:'tuber',yam:'tuber',cauliflower:'head',kale:'head',
 tomato:'fruiting',pepper:'fruiting',eggplant:'fruiting',strawberry:'berry',blueberry:'berry',cranberry:'berry',
 pumpkin:'vine',melon:'vine',grape:'vine',corn:'grain',wheat:'grain'};
function _lmat(col){ return new THREE.MeshStandardMaterial({color:col,roughness:0.55,metalness:0,side:THREE.DoubleSide}); }
function _leaf(mat,len,wid){ const geo=new THREE.SphereGeometry(1,8,5); geo.scale(wid,len,0.04); geo.translate(0,len,0); return new THREE.Mesh(geo,mat); }
// detailed, distinct per-crop plant model (used in-field AND rendered to the shop/inventory icons)
function cropMesh(id,stage,days){
  const c=CROPS[id], form=CROP_FORM[id]||'fruiting', g=new THREE.Group();
  const frac=clamp(stage/days,0,1), ripe=stage>=days;
  const lm=_lmat(c.col), lm2=_lmat(new THREE.Color(c.col).multiplyScalar(0.78).getHex());
  const fm=new THREE.MeshStandardMaterial({color:c.fruit,roughness:0.4,metalness:0.03});
  if(stage<=1){ const st=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.03,0.1,5),lm); st.position.y=0.05; g.add(st);
    const a=_leaf(lm,0.1,0.05); a.position.y=0.08; a.rotation.z=0.6; g.add(a); const b=_leaf(lm,0.1,0.05); b.position.y=0.08; b.rotation.z=-0.6; g.add(b);
    g.scale.setScalar(0.6+frac*0.5); g.traverse(o=>{if(o.isMesh)o.castShadow=true;}); return g; }
  const sc=0.55+frac*0.6;
  if(form==='root'||form==='tuber'){
    const n=5+Math.floor(frac*4);
    for(let i=0;i<n;i++){ const a=i/n*6.28, l=_leaf(form==='root'?lm:lm2,0.3+frac*0.22,0.045+frac*0.03);
      l.position.set(Math.cos(a)*0.05,0.12,Math.sin(a)*0.05); l.rotation.y=a; l.rotation.z=0.95-frac*0.35; g.add(l); }
    if(ripe){ const root=new THREE.Mesh(new THREE.SphereGeometry(0.12,12,10),fm); root.scale.set(1,form==='root'?1.6:1.1,1); root.position.y=0.04; g.add(root);
      if(form==='tuber'){ for(let i=0;i<3;i++){ const tbr=new THREE.Mesh(new THREE.SphereGeometry(0.09,10,8),fm); tbr.position.set((Math.random()-.5)*0.22,0.04,(Math.random()-.5)*0.22); tbr.scale.y=0.85; g.add(tbr);} } }
  } else if(form==='head'){
    const n=8; for(let i=0;i<n;i++){ const a=i/n*6.28, l=_leaf(lm2,0.26+frac*0.18,0.14+frac*0.06); l.position.set(Math.cos(a)*0.12,0.06,Math.sin(a)*0.12); l.rotation.y=a; l.rotation.z=0.75; g.add(l);}
    const ball=new THREE.Mesh(new THREE.IcosahedronGeometry(0.1+frac*0.11,1), id==='kale'?lm:fm); ball.position.y=0.16+frac*0.08; if(id==='kale')ball.scale.y=0.7; g.add(ball);
  } else if(form==='fruiting'){
    const h=0.3+frac*0.7; const stem=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.04,h,6),lm2); stem.position.y=h/2; g.add(stem);
    const nl=3+Math.floor(frac*4); for(let i=0;i<nl;i++){ const l=_leaf(lm,0.15,0.09); l.position.y=0.14+i*(h/nl); l.rotation.y=i*1.35; l.rotation.z=0.35; g.add(l);}
    if(frac>0.6){ const nf=1+Math.floor(frac*3); for(let i=0;i<nf;i++){ let fr;
      if(id==='pepper'){ fr=new THREE.Mesh(new THREE.ConeGeometry(0.055,0.2,8),fm); fr.rotation.x=Math.PI; }
      else if(id==='eggplant'){ fr=new THREE.Mesh(new THREE.SphereGeometry(0.08,12,10),fm); fr.scale.set(0.8,1.6,0.8); }
      else { fr=new THREE.Mesh(new THREE.SphereGeometry(0.095,14,12),fm); }
      const a=i/nf*6.28; fr.position.set(Math.cos(a)*0.1,0.2+Math.random()*h*0.5,Math.sin(a)*0.1); g.add(fr);} }
  } else if(form==='berry'){
    const n=5+Math.floor(frac*3); for(let i=0;i<n;i++){ const a=i/n*6.28, l=_leaf(lm,0.14,0.08); l.position.set(Math.cos(a)*0.1,0.05,Math.sin(a)*0.1); l.rotation.y=a; l.rotation.z=1.0; g.add(l);}
    if(frac>0.55){ const nb=3+Math.floor(frac*4); for(let i=0;i<nb;i++){ const b=new THREE.Mesh(new THREE.SphereGeometry(0.045,10,8),fm); b.position.set((Math.random()-.5)*0.24,0.07+Math.random()*0.07,(Math.random()-.5)*0.24); g.add(b);} }
  } else if(form==='vine'){
    const n=6; for(let i=0;i<n;i++){ const a=i/n*6.28, l=_leaf(lm2,0.2,0.16); l.position.set(Math.cos(a)*0.18,0.03,Math.sin(a)*0.18); l.rotation.y=a; l.rotation.z=1.3; g.add(l);}
    if(ripe){ let fr; if(id==='grape'){ fr=new THREE.Group(); for(let i=0;i<12;i++){ const b=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6),fm); b.position.set((Math.random()-.5)*0.14,-Math.random()*0.14,(Math.random()-.5)*0.14); fr.add(b);} fr.position.y=0.2; }
      else { fr=new THREE.Mesh(new THREE.SphereGeometry(0.17,16,12),fm); if(id==='pumpkin'){ fr.scale.set(1,0.78,1);} fr.position.y=0.15; } g.add(fr); }
  } else if(form==='grain'){
    const stalks=3+Math.floor(frac*3), sm=_lmat(ripe?0xd8c25a:c.col);
    for(let i=0;i<stalks;i++){ const h=0.5+frac*0.8, a=i/stalks*6.28; const st=new THREE.Mesh(new THREE.CylinderGeometry(0.018,0.025,h,5),sm); st.position.set(Math.cos(a)*0.08,h/2,Math.sin(a)*0.08); st.rotation.z=(Math.random()-.5)*0.2; g.add(st);
      if(id==='corn'&&ripe){ const cob=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.045,0.2,8),fm); cob.position.set(st.position.x,h*0.65,st.position.z); g.add(cob); }
      if(id==='wheat'&&frac>0.6){ const hd=new THREE.Mesh(new THREE.ConeGeometry(0.04,0.18,6),fm); hd.position.set(st.position.x,h+0.04,st.position.z); g.add(hd); } }
  }
  g.scale.setScalar(sc); g.traverse(o=>{if(o.isMesh)o.castShadow=true;}); return g;
}
function rebuildCrop(x,z){
  const tl=getTile(x,z); const old=cropGroup.children.find(m=>m.userData.cell&&m.userData.cell.x===x&&m.userData.cell.z===z);
  if(old) cropGroup.remove(old);
  if(tl&&tl.crop){ const m=cropMesh(tl.crop.id,tl.crop.stage,CROPS[tl.crop.id].days); m.position.set(x,0.12,z); m.userData.cell={x,z}; cropGroup.add(m); }
}

/* ---- render each crop's 3D model to a transparent icon (shop/inventory/hotbar) ---- */
const ICONS={};
function renderIcons(){
  const SZ=160, rt=new THREE.WebGLRenderTarget(SZ,SZ);   // no MSAA: readRenderTargetPixels must resolve per-crop
  const isc=new THREE.Scene(); isc.environment=scene.environment;
  const icam=new THREE.PerspectiveCamera(32,1,0.05,30);
  const key=new THREE.DirectionalLight(0xffffff,2.6); key.position.set(2.5,4,3); isc.add(key);
  isc.add(new THREE.HemisphereLight(0xffffff,0x6b7a5a,0.7));
  const cv=document.createElement('canvas'); cv.width=cv.height=SZ; const ctx=cv.getContext('2d');
  const buf=new Uint8Array(SZ*SZ*4);
  const prevRT=renderer.getRenderTarget(), prevA=renderer.getClearAlpha(), prevCC=new THREE.Color(); renderer.getClearColor(prevCC);
  const prevTM=renderer.toneMapping, prevExp=renderer.toneMappingExposure;
  renderer.toneMapping=THREE.AgXToneMapping; renderer.toneMappingExposure=1.0;   // same filmic grade as the world
  renderer.setClearColor(0x000000,0); renderer.setRenderTarget(rt);
  for(const id in CROPS){
    const m=cropMesh(id,CROPS[id].days,CROPS[id].days);
    const box=new THREE.Box3().setFromObject(m), ctr=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3());
    m.position.sub(ctr); isc.add(m);
    const rad=Math.max(sz.x,sz.y,sz.z)||0.5, d=rad*2.3;
    icam.position.set(d*0.55,d*0.45,d); icam.lookAt(0,0,0);
    renderer.clear(); renderer.render(isc,icam);
    renderer.readRenderTargetPixels(rt,0,0,SZ,SZ,buf);
    const img=ctx.createImageData(SZ,SZ);
    for(let y=0;y<SZ;y++){ const sy=SZ-1-y; for(let x=0;x<SZ;x++){ const si=(sy*SZ+x)*4,di=(y*SZ+x)*4; img.data[di]=buf[si];img.data[di+1]=buf[si+1];img.data[di+2]=buf[si+2];img.data[di+3]=buf[si+3]; } }
    ctx.clearRect(0,0,SZ,SZ); ctx.putImageData(img,0,0); ICONS[id]=cv.toDataURL('image/png'); isc.remove(m);
  }
  renderer.setRenderTarget(prevRT); renderer.setClearColor(prevCC,prevA); renderer.toneMapping=prevTM; renderer.toneMappingExposure=prevExp; rt.dispose();
}

async function loadTwinkle(){

/* target cell under crosshair (ray to ground, then snap) */
const ray=new THREE.Raycaster();
let targetCell=null;
function updateTarget(){
  if(S.inMine){ selector.visible=false; targetCell=null; return; }
  ray.setFromCamera({x:0,y:0}, camera);
  const hit=ray.intersectObject(ground,false)[0];
  if(hit && hit.distance<6.5){
    const x=Math.round(hit.point.x), z=Math.round(hit.point.z);
    // only farmable on flat farmland
    if(Math.abs(x)<=FARM_HALF && Math.abs(z)<=FARM_HALF){
      targetCell={x,z}; selector.position.set(x,0.14,z); selector.visible=true; return;
    }
  }
  targetCell=null; selector.visible=false;
}

/* ============================ ACTIONS ============================ */
function spendEnergy(n){ S.energy=clamp(S.energy-n,0,S.maxEnergy); if(S.energy<=0) toast(t('noenergy')); renderEnergy(); }
function useTool(){
  if(S.inMine){ mineSwing(); return; }
  if(!targetCell){ return; }
  if(S.energy<=0){ toast(t('noenergy')); return; }
  const {x,z}=targetCell; let tl=getTile(x,z);
  // placing a crafted object
  if(S.heldPlace){ placeCraftable(x,z); return; }
  // holding a seed -> plant
  if(S.heldSeed){
    if(!tl||!tl.tilled){ toast(t('needsoil')); return; }
    if(tl.crop){ toast(t('occupied')); return; }
    const c=CROPS[S.heldSeed];
    if(c.season.indexOf(S.season)<0){ toast(t('wrongseason')); return; }
    if(!invTake('seed',S.heldSeed,1)){ return; }
    tl.crop={id:S.heldSeed,stage:0,watered:false};
    rebuildCrop(x,z); toast(c.em+' '+t('plant')+cropName(S.heldSeed));
    if(invCount('seed',S.heldSeed)<=0){ S.heldSeed=null; } renderHotbar(); return;
  }
  const tool=S.tool, lvl=S.toolLvl[tool], ec=Math.max(1,(tool===2||tool===3?3:2)-lvl);
  if(tool===0){ // hoe (upgrades widen the area tilled per swing)
    let did=0; for(const [dx,dz] of aoe(lvl)){ const cx=x+dx,cz=z+dz; if(Math.abs(cx)>FARM_HALF||Math.abs(cz)>FARM_HALF) continue;
      let t2=getTile(cx,cz); if(!t2){ t2={tilled:true,watered:false,crop:null}; S.tiles.set(tkey(cx,cz),t2); did++; } else if(!t2.tilled){ t2.tilled=true; did++; } refreshTileMesh(cx,cz); }
    if(did){ spendEnergy(ec); toast('⛏️ '+t('till')+(lvl?' ×'+aoe(lvl).length:'')); }
  } else if(tool===1){ // watering can (upgrades widen the area watered)
    let did=0; for(const [dx,dz] of aoe(lvl)){ const cx=x+dx,cz=z+dz; const t2=getTile(cx,cz); if(t2&&t2.tilled){ t2.watered=true; if(t2.crop) t2.crop.watered=true; refreshTileMesh(cx,cz); did++; } }
    if(did){ spendEnergy(ec); toast('💧 '+t('water')+(lvl?' ×'+did:'')); } else toast(t('needtill'));
  } else if(tool===4){ // scythe: harvest ripe crop, else cut grass for fiber
    if(tl&&tl.crop&&tl.crop.stage>=CROPS[tl.crop.id].days){ harvest(x,z); }
    else { spendEnergy(1); if(Math.random()<0.55){ invAdd('mat','fiber',1); toast('🌿 +'+metaOf('mat','fiber').name); } }
  } else if(tool===2){ spendEnergy(ec); invAdd('mat','wood',1+Math.floor(lvl/2)); toast('🪵 '+t('chop')); }
  else if(tool===3){ spendEnergy(ec); invAdd('mat','stone',1+Math.floor(lvl/2)); toast('⛏ '+t('mine')); }
}
function aoe(lvl){ const o=[[0,0]];
  if(lvl>=1){ o.push([-1,0],[1,0]); }
  if(lvl>=2){ o.push([-1,-1],[0,-1],[1,-1],[-1,1],[0,1],[1,1]); }
  if(lvl>=3){ o.push([-2,0],[2,0],[-2,-1],[2,-1],[-2,1],[2,1]); }
  if(lvl>=4){ o.push([-2,-2],[-1,-2],[0,-2],[1,-2],[2,-2],[-2,2],[-1,2],[0,2],[1,2],[2,2]); }
  return o; }
function harvest(x,z){
  const tl=getTile(x,z); const id=tl.crop.id; invAdd('crop',id,1);
  toast(CROPS[id].em+' '+t('harvest')+cropName(id)+' +1');
  tl.crop=null; tl.watered=false; rebuildCrop(x,z); refreshTileMesh(x,z);
}
function near(p,d){ return Math.hypot(player.pos.x-p.x,player.pos.z-p.z)<d; }
function interact(){
  if(S.inMine) return;
  if(S.festival && !S.festDone && near(PLAZA,11)){ openFestival(); return; }
  if(near(ANVIL,2.8)){ openBlacksmith(); return; }
  if(near(STOVE,2.8)){ openCook(); return; }
  for(const n of NPCS){ if(n.mesh && Math.hypot(player.pos.x-n.x,player.pos.z-n.z)<2.6){ openDialogue(n); return; } }
  if(near(COOP,4)){ openCoop(); return; }
  if(near(MINE_ENT,3.2)){ enterMine(); return; }

  if(near(SHOP,3.2)){ openShop(); return; }

/* ============================ WEATHER ============================ */
let rainPts=null, weatherDim=1.0;
function buildRain(){
  const N=1500; const g=new THREE.BufferGeometry(); const pos=new Float32Array(N*3);
  for(let i=0;i<N;i++){ pos[i*3]=(Math.random()-.5)*64; pos[i*3+1]=Math.random()*36; pos[i*3+2]=(Math.random()-.5)*64; }
  g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const m=new THREE.PointsMaterial({ color:0xaccbe4, size:0.13, transparent:true, opacity:0.5, depthWrite:false });
  rainPts=new THREE.Points(g,m); rainPts.visible=false; rainPts.frustumCulled=false; scene.add(rainPts);
}
function updateRain(dt){
  if(!rainPts||!rainPts.visible) return;
  const p=rainPts.geometry.attributes.position;
  for(let i=0;i<p.count;i++){ let y=p.getY(i)-dt*28; if(y<0) y=36; p.setY(i,y); }
  p.needsUpdate=true; rainPts.position.set(player.pos.x,0,player.pos.z);
}
function applyWeather(){
  if(rainPts) rainPts.visible=(S.weather==='rain');
  weatherDim = S.weather==='rain'?0.44 : (S.weather==='cloudy'?0.72 : 1.0);
  renderStatus();
}
function rollWeather(){
  const r=Math.random(); const rain=[0.3,0.15,0.32,0.12][S.season];
  S.weather = r<rain ? 'rain' : (r<rain+0.25 ? 'cloudy' : 'clear');
  applyWeather();
  if(S.weather==='rain'){ // rain waters every tilled tile — no watering needed that day
    for(const [k,tl] of S.tiles){ if(tl.tilled){ tl.watered=true; if(tl.crop) tl.crop.watered=true; const a=k.split(',').map(Number); refreshTileMesh(a[0],a[1]); } }
  }
}

/* ============================ TIME / DAY ============================ */
function advanceDay(){
  if(S.inMine) leaveMine();
  // grow watered crops, wilt out-of-season
  for(const [k,tl] of S.tiles){
    if(tl.crop){
      const c=CROPS[tl.crop.id];
      if(c.season.indexOf(S.season)<0){ tl.crop=null; const [x,z]=k.split(',').map(Number); rebuildCrop(x,z); continue; }
      if(tl.watered && tl.crop.stage<c.days){ tl.crop.stage++; }
    }
    tl.watered=false; if(tl.crop) tl.crop.watered=false;
  }
  // rebuild visuals
  for(const [k,tl] of S.tiles){ const [x,z]=k.split(',').map(Number); refreshTileMesh(x,z); rebuildCrop(x,z); }
  // sell shipped
  if(S.shipped>0){ S.gold+=S.shipped; }
  const earned=S.shipped; S.shipped=0;
  // roll calendar
  S.day++; if(S.day>28){ S.day=1; S.season=(S.season+1)%4; retintGround(); }
  S.time=360; S.energy=S.maxEnergy;
  rollWeather();                     // new day's weather (rain auto-waters)
  // sprinklers water their 4 neighbours for the new day
  for(const [k,tl] of S.tiles){ if(tl.sprinkler){ const [x,z]=k.split(',').map(Number); for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nt=getTile(x+dx,z+dz); if(nt&&nt.tilled){ nt.watered=true; if(nt.crop) nt.crop.watered=true; refreshTileMesh(x+dx,z+dz); } } } }
  animalsProduce(); NPCS.forEach(n=>n.gifted=false); S.festDone=false; checkFestival(); saveGame();
  renderStatus(); renderEnergy();
  return earned;
}
function sleep(){
  if(S.sleeping) return; S.sleeping=true;
  $('#fadet').textContent=t('sleep'); $('#fade').classList.add('on');
  setTimeout(()=>{
    const earned=advanceDay();
    $('#fadet').textContent=t('wake')+(earned>0?'  (+'+earned+'g)':'');
    setTimeout(()=>{ $('#fade').classList.remove('on'); S.sleeping=false; },1100);
  },700);
}
let seasonWarm=0.5, warmGradeFx=null;
function retintGround(){ // seasonal tint multiplies the grass texture
  const tint=[0xb9e39a,0xcfe79a,0xe3b878,0xe2edf3][S.season]; // spring, summer, fall golden, winter frost
  if(ground) ground.material.color.setHex(tint);
  if(grassIM) grassIM.material.color.setHex([0x5fae4e,0x5aa048,0xc08f3a,0xd4e2ea][S.season]);
  const hueB=[0.26,0.24,0.12,0.28][S.season];
  hemi.groundColor.setHSL(hueB,0.3,[0.3,0.28,0.26,0.5][S.season]);
  seasonWarm=[0.52,0.62,0.9,0.26][S.season];   // fall = warm autumn, winter = cool
  if(warmGradeFx) warmGradeFx.uniforms.get('warm').value=seasonWarm;
}

const mm=$('#mmc'), mx=mm.getContext('2d');
const MM_RANGE=48;                       // world units shown radius
function drawMini(){
  const W=mm.width,H=mm.height, cx=W/2, cy=H/2, sc=W/(MM_RANGE*2);
  mx.clearRect(0,0,W,H);
  // ground tint by season
  mx.fillStyle=['#2f5e38','#2c6a40','#5a4a2a','#7f93a0'][S.season]; mx.fillRect(0,0,W,H);
  const wx=player.pos.x, wz=player.pos.z;
  const toPx=(x,z)=>[cx+(x-wx)*sc, cy+(z-wz)*sc];
  // farm boundary
  mx.strokeStyle='rgba(255,255,255,.25)'; mx.lineWidth=1;
  let a=toPx(-FARM_HALF,-FARM_HALF), b=toPx(FARM_HALF,FARM_HALF); mx.strokeRect(a[0],a[1],b[0]-a[0],b[1]-a[1]);
  // pond
  if(pondMini){ const p=toPx(pondMini.x,pondMini.z); mx.fillStyle='#3f8fd0'; mx.beginPath(); mx.arc(p[0],p[1],pondMini.r*sc,0,7); mx.fill(); }
  // props
  for(const o of propMini){ const p=toPx(o.x,o.z); if(p[0]<-4||p[0]>W+4||p[1]<-4||p[1]>H+4) continue; mx.fillStyle=o.c; mx.beginPath(); mx.arc(p[0],p[1],o.r*sc*0.5+0.6,0,7); mx.fill(); }
  // tilled + crops
  for(const [k,tl] of S.tiles){ if(!tl.tilled) continue; const [x,z]=k.split(',').map(Number); const p=toPx(x,z);
    mx.fillStyle=tl.crop?(tl.crop.stage>=CROPS[tl.crop.id].days?'#ffd66b':'#8fe39a'):(tl.watered?'#4a3322':'#6a4a30');
    mx.fillRect(p[0]-sc*0.4,p[1]-sc*0.4,sc*0.8,sc*0.8); }
  // landmarks
  const mark=(pp,col,lab)=>{ const p=toPx(pp.x,pp.z); mx.fillStyle=col; mx.beginPath(); mx.arc(p[0],p[1],3,0,7); mx.fill(); mx.fillStyle='#fff'; mx.font='7px sans-serif'; mx.fillText(lab,p[0]+4,p[1]+2); };
  mark(BED,'#6a9bd8','🛏'); mark(SHOP,'#ffd66b','🏪'); mark(BIN,'#c89a5a','📦'); mark({x:0,z:-12},'#e9dcc5','🏠');
  // player arrow
  mx.save(); mx.translate(cx,cy); mx.rotate(-cam.yaw+Math.PI);
  mx.fillStyle='#5bd1ff'; mx.beginPath(); mx.moveTo(0,-6); mx.lineTo(4,5); mx.lineTo(0,2); mx.lineTo(-4,5); mx.closePath(); mx.fill();
  mx.strokeStyle='#06121f'; mx.lineWidth=1; mx.stroke(); mx.restore();
}

let composer, aoPass, dofEffect;
// CozyGrade — cinematic Cast-n-Chill grade: muted colours, olive greens, cool shadows +
// warm highlights (split-tone), soft lifted contrast, warm neutral wash, cozy vignette.
class WarmGrade extends Effect {
  constructor(){ super('CozyGrade',
    'uniform float warm;\n'+
    'void mainImage(const in vec4 c, const in vec2 uv, out vec4 o){\n'+
    '  vec3 col=max(c.rgb,0.0);\n'+
    '  col=clamp(((col-0.5)*1.08+0.5)*1.14,0.0,1.0);\n'+             // gentle contrast + brighten (airy, not crushed)
    '  float l=dot(col,vec3(0.2126,0.7152,0.0722));\n'+
    '  col=clamp(mix(vec3(l),col,1.38),0.0,1.0);\n'+                  // STRONG saturation (rich Cast-n-Chill tone)
    '  float sm=1.0-smoothstep(0.0,0.5,l), hm=smoothstep(0.5,1.0,l);\n'+
    '  col += vec3(-0.012,0.004,0.028)*sm;\n'+                        // subtle cool shadows
    '  col += vec3(0.045,0.022,-0.02)*(0.4+0.9*warm)*hm;\n'+          // warm highlights
    '  col*=vec3(1.0+warm*0.05,1.0,1.0-warm*0.04);\n'+              // seasonal warm wash
    '  float d=distance(uv,vec2(0.5)); col*=1.0-d*d*0.12;\n'+         // light vignette
    '  o=vec4(clamp(col,0.0,1.0),c.a);\n'+
    '}',
    { uniforms:new Map([['warm',new THREE.Uniform(0.5)]]) }); }
}
// depth-edge outline → hand-drawn / toon silhouettes
class ToonOutline extends Effect {
  constructor(){ super('ToonOutline',
    'uniform float thickness; uniform vec3 lineColor; uniform float strength;\n'+
    'void mainImage(const in vec4 c, const in vec2 uv, const in float depth, out vec4 o){\n'+
    '  vec2 tx=thickness/resolution; float z=getViewZ(depth); float e=0.0;\n'+
    '  e+=abs(z-getViewZ(readDepth(uv+vec2(tx.x,0.0))));\n'+
    '  e+=abs(z-getViewZ(readDepth(uv-vec2(tx.x,0.0))));\n'+
    '  e+=abs(z-getViewZ(readDepth(uv+vec2(0.0,tx.y))));\n'+
    '  e+=abs(z-getViewZ(readDepth(uv-vec2(0.0,tx.y))));\n'+
    '  float line=smoothstep(0.35,0.9,e/max(1.0,-z));\n'+   // high threshold → only big silhouettes, not grass
    '  o=vec4(mix(c.rgb, lineColor, line*strength), c.a);\n'+
    '}',
    { attributes:EffectAttribute.DEPTH, uniforms:new Map([['thickness',new THREE.Uniform(1.2)],['lineColor',new THREE.Uniform(new THREE.Color(0x2b2d2a))],['strength',new THREE.Uniform(0.5)]]) }); }
}
let QUAL = localStorage.getItem('sv_qual')||'med';
// low = fast path (no post, max fps). med = cinematic post (bloom+grade+vignette, no AO).
// high = + N8AO contact shadows + volumetric god rays.
const QSET={ low:{dpr:0.9,shadow:1024,post:false,ao:false,god:false},
            med:{dpr:1.35,shadow:1536,post:true,ao:false,god:false},
            high:{dpr:1.3,shadow:2048,post:true,ao:true,god:true} };
function setupPost(){
  const q=QSET[QUAL]||QSET.med;
  renderer.setPixelRatio(Math.min(devicePixelRatio,q.dpr));
  sun.shadow.mapSize.set(q.shadow,q.shadow); if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }
  renderer.shadowMap.needsUpdate=true;
  if(sunMesh) sunMesh.visible=!!q.god;
  if(composer){ composer.dispose(); composer=null; }
  if(!q.post){
    // FAST PATH: no composer — native AgX tonemap + MSAA.
    aoPass=null; dofEffect=null;
    renderer.toneMapping=THREE.AgXToneMapping; renderer.toneMappingExposure=1.0;
    return;
  }
  // CINEMATIC PATH
  renderer.toneMapping=THREE.NoToneMapping;
  composer=new EffectComposer(renderer,{ frameBufferType:THREE.HalfFloatType });
  composer.addPass(new RenderPass(scene,camera));
  if(q.ao){ aoPass=new N8AOPostPass(scene,camera,innerWidth,innerHeight);
    aoPass.configuration.aoRadius=1.3; aoPass.configuration.distanceFalloff=1.0; aoPass.configuration.intensity=2.4; aoPass.configuration.halfRes=true;
    try{ aoPass.setQualityMode('Medium'); }catch(e){} composer.addPass(aoPass); } else aoPass=null;
  const fx=[ new ToonOutline(), new BloomEffect({ intensity:0.36, luminanceThreshold:0.82, luminanceSmoothing:0.25, mipmapBlur:true, radius:0.4 }) ];
  if(q.god && sunMesh){ try{ fx.push(new GodRaysEffect(camera, sunMesh, { density:0.92, decay:0.93, weight:0.5, exposure:0.5, samples:40, blur:true, kernelSize:KernelSize.SMALL })); }catch(e){} }
  fx.push(new ToneMappingEffect({ mode:ToneMappingMode.AGX }));
  warmGradeFx=new WarmGrade(); warmGradeFx.uniforms.get('warm').value=seasonWarm; fx.push(warmGradeFx);  // grade AFTER tonemap (display-referred)
  fx.push(new VignetteEffect({ eskil:false, offset:0.3, darkness:0.42 }));
  fx.push(new SMAAEffect());
  dofEffect=null;
  composer.addPass(new EffectPass(camera, ...fx));
}
function setQuality(q){ QUAL=q; localStorage.setItem('sv_qual',q); setupPost(); updateQualBtn(); }
function updateQualBtn(){ const b=document.getElementById('qualbtn'); if(b) b.textContent='⚙ '+({low:'流畅',med:'均衡',high:'极致'}[QUAL]||QUAL); }

const cForward=new THREE.Vector3(), cRight=new THREE.Vector3(), moveV=new THREE.Vector3();
let last=performance.now(), miniT=0, fCnt=0, fAcc=0, sTick=0;
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(grassUniform) grassUniform.value=now*0.001;
  if(waterMat&&waterMat.normalMap){ waterMat.normalMap.offset.x+=dt*0.025; waterMat.normalMap.offset.y+=dt*0.012; }
  if(pondRefl) pondRefl.visible = !S.inMine && Math.hypot(player.pos.x+24,player.pos.z-20)<26;   // reflect only when at the pond
  updateRain(dt); updateCritters(now*0.001); updateNPCs(dt); updateAnimals(dt); updateFish(dt); updateClouds(dt); updateFireflies(now*0.001); updatePetals(dt);
  if(S.inMine && mineLight) mineLight.position.set(player.pos.x,4,player.pos.z);
  fCnt++; fAcc+=dt; if(fAcc>=0.5){ const fe=$('#fps'); if(fe) fe.textContent=Math.round(fCnt/fAcc)+' fps'; fCnt=0; fAcc=0; }

  // time of day
  if(!S.sleeping){ S.time += dt*0.7; // ~0.7 min/sec → a full 6:00→2:00 day ≈ ~20 min real
    if(S.time>=1560){ sleep(); }      // 26:00 = pass out at 2AM
  }
  // day/night sun
  dayNight();

  // movement (camera-relative)
  cForward.set(Math.sin(cam.yaw),0,Math.cos(cam.yaw));
  cRight.set(cForward.z,0,-cForward.x);
  moveV.set(0,0,0);
  if(keys['KeyW']) moveV.add(cForward); if(keys['KeyS']) moveV.sub(cForward);
  if(keys['KeyA']) moveV.sub(cRight);   if(keys['KeyD']) moveV.add(cRight);
  if(touchMove.lengthSq()>0.01){ moveV.add(cForward.clone().multiplyScalar(-touchMove.y)); moveV.add(cRight.clone().multiplyScalar(touchMove.x)); }
  player.moving=moveV.lengthSq()>0.001;
  if(player.moving){
    moveV.normalize(); const spd=(S.running&&S.energy>0?7.2:4.2)*(S.energy>0?1:0.45);
    player.pos.addScaledVector(moveV, spd*dt);
    player.pos.x=clamp(player.pos.x,-95,95); player.pos.z=clamp(player.pos.z,-95,95);
    player.yaw=Math.atan2(moveV.x,moveV.z);
    player.walkT+=dt*(S.running?15:10);
  }
  player.pos.y=terrainH(player.pos.x,player.pos.z);
  if(S.inMine){ player.pos.x=clamp(player.pos.x,-14.5,14.5); player.pos.z=clamp(player.pos.z,-14.5,14.5); player.pos.y=0; }
  avatar.position.copy(player.pos);
  avatar.rotation.y = lerpAngle(avatar.rotation.y, player.yaw, 0.2);
  animateWalk(dt);

  // third-person camera
  const cs=Math.cos(cam.pitch);
  const camPos=new THREE.Vector3(
    player.pos.x - Math.sin(cam.yaw)*cam.dist*cs,
    player.pos.y + cam.height + Math.sin(cam.pitch)*cam.dist,
    player.pos.z - Math.cos(cam.yaw)*cam.dist*cs);
  camera.position.lerp(camPos,0.18);
  camera.lookAt(player.pos.x, player.pos.y+1.5, player.pos.z);

  updateTarget();
  // selector pulse
  selector.material.opacity=0.5+Math.sin(now*0.006)*0.35;

  // proximity hints
  hintProximity();

  renderStatus();
  miniT+=dt; if(miniT>0.12){ drawMini(); miniT=0; }

  if((sTick++ % 3)===0) renderer.shadowMap.needsUpdate=true;   // throttle shadow pass to ~20Hz
  if(composer) composer.render(); else renderer.render(scene,camera);
}
function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2))-Math.PI; if(d<-Math.PI)d+=Math.PI*2; return a+d*t; }
function animateWalk(dt){
  if(!avatar) return;
  if(charIsGLB){ // real twinkle model — bob + gentle sway
    const s=Math.sin(player.walkT);
    const bob=player.moving?Math.abs(Math.cos(player.walkT))*0.1:Math.sin(performance.now()*0.002)*0.03;
    if(charHolder){ charHolder.position.y=bob; charHolder.rotation.z=player.moving?s*0.06:0; }
    return;
  }
  if(!legL) return;
  const amt=player.moving?1:0; const s=Math.sin(player.walkT), c=Math.cos(player.walkT);
  legL.rotation.x=lerp(legL.rotation.x, s*0.7*amt, 0.3); legR.rotation.x=lerp(legR.rotation.x,-s*0.7*amt,0.3);
  armL.rotation.x=lerp(armL.rotation.x,-s*0.6*amt,0.3); armR.rotation.x=lerp(armR.rotation.x, s*0.6*amt,0.3);
  const bob=player.moving?Math.abs(c)*0.08:Math.sin(performance.now()*0.002)*0.03;
  if(headG) headG.position.y=1.75+bob;
}
function dayNight(){
  if(S.inMine) return;                              // mine has its own dark lighting
  // map 6:00(360)→20:00(1200) daylight arc; dim after
  const tt=clamp((S.time-240)/1080,0,1);           // 4:00..22:00 broad arc
  const ang=tt*Math.PI;                            // 0..PI across sky
  sun.position.set(player.pos.x+Math.cos(ang)*55, Math.max(14,Math.sin(ang)*82), player.pos.z+28);
  sun.target.position.copy(player.pos); sun.target.updateMatrixWorld();
  if(sunMesh.visible){ const dir=sun.position.clone().sub(player.pos).normalize(); sunMesh.position.copy(player.pos).addScaledVector(dir,360).setY(Math.max(30,player.pos.y+dir.y*360)); }
  const noon=Math.sin(ang);
  const dusk=clamp(1.0-Math.abs(tt-0.5)*2.3,0,1);   // 0 midday → 1 near dawn/dusk
  // Cast-n-Chill: soft MUTED painterly palette, strong atmospheric haze
  sun.intensity=clamp(noon*1.7+0.75,0.7,2.3)*weatherDim;   // brighter floor so dawn isn't dark
  sun.color.setHSL(lerp(0.045,0.1,noon),0.55*weatherDim+0.06,0.62);
  // gradient sky dome: pale warm hazy horizon, soft muted blue-grey zenith (warmer+lower at dawn/dusk)
  const horizon=new THREE.Color().setHSL(lerp(0.1,0.07,seasonWarm), lerp(0.14,0.4,dusk)*(0.6+seasonWarm*0.6), clamp((lerp(0.86,0.64,dusk))*(0.5+0.5*noon)+0.18,0.2,0.9));
  const zenith =new THREE.Color().setHSL(0.58, lerp(0.2,0.3,dusk), clamp(lerp(0.58,0.26,1-noon),0.18,0.6));
  skyU.bot.value.copy(horizon); skyU.top.value.copy(zenith); skyU.night.value=clamp(0.8-noon*2.2,0,1); skyDome.position.copy(camera.position);
  hemi.color.copy(horizon);
  hemi.intensity=clamp(noon*0.35+0.85,0.85,1.35)*(0.65+0.35*weatherDim);   // bright ambient fill (airy)
  scene.fog.color.copy(horizon);                    // ridges melt into the sky
  scene.fog.density = 0.0016*(S.weather==='rain'?1.8:(S.weather==='cloudy'?1.4:1.0));   // crisp, only distant ridges haze
  if(scene.environmentIntensity!==undefined) scene.environmentIntensity=lerp(0.35,0.82,clamp(noon,0.1,1));
}
function hintProximity(){
  // show a one-shot toast when first approaching a landmark
  const checks=[[BED,2.6,'nearbed'],[SHOP,3.2,'nearshop'],[BIN,2.6,'nearbin']];
  for(const [p,d,key] of checks){ const inRange=near(p,d);
    if(inRange && !p._hinted){ p._hinted=true; toast(t(key)); } else if(!inRange){ p._hinted=false; } }
}

let mineGroup=null, mineNodes=[], mineLight=null, mineBtns=null, mineSavedBg=null;
function buildMine(){
  const ent=new THREE.Group();
  const frame=new THREE.Mesh(new THREE.TorusGeometry(1.6,0.4,8,16,Math.PI), new THREE.MeshStandardMaterial({color:0x6b6f74,roughness:0.9})); frame.position.y=1.6;

  mineGroup=new THREE.Group(); mineGroup.visible=false; scene.add(mineGroup);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(16,40), new THREE.MeshStandardMaterial({color:0x3a3330,roughness:1})); floor.rotateX(-Math.PI/2); floor.receiveShadow=true; mineGroup.add(floor);
  const wall=new THREE.Mesh(new THREE.CylinderGeometry(16,16,8,40,1,true), new THREE.MeshStandardMaterial({color:0x2a2420,roughness:1,side:THREE.BackSide})); wall.position.y=4; mineGroup.add(wall);
  const ceil=new THREE.Mesh(new THREE.CircleGeometry(16,40), new THREE.MeshStandardMaterial({color:0x201c18,roughness:1})); ceil.rotateX(Math.PI/2); ceil.position.y=8; mineGroup.add(ceil);
  mineLight=new THREE.PointLight(0xffe0b0,14,30); mineLight.position.y=4; mineGroup.add(mineLight);
  mineGroup.add(new THREE.AmbientLight(0x404854,0.7));
}
function spawnMineNodes(){ for(const n of mineNodes){ mineGroup.remove(n.mesh); } mineNodes=[];
  const cnt=10+Math.floor(Math.random()*4);
  for(let i=0;i<cnt;i++){ const a=Math.random()*6.28, r=3+Math.random()*11, x=Math.cos(a)*r, z=Math.sin(a)*r, s=0.6+Math.random()*0.5;
    const mesh=MODELS.rock_01? MODELS.rock_01.scene.clone(true) : new THREE.Mesh(new THREE.IcosahedronGeometry(s,0), new THREE.MeshStandardMaterial({color:0x7a7f85,flatShading:true}));
    mesh.position.set(x,0,z); mesh.scale.setScalar(s*1.6); mesh.traverse(o=>{if(o.isMesh)o.castShadow=true;}); mineGroup.add(mesh);
    mineNodes.push({mesh,x,z,hp:2+Math.floor(S.mineLevel/3)}); }
}
function enterMine(){ S.inMine=true; S.mineLevel=1; mineSavedBg=scene.background; world.visible=false; mineGroup.visible=true;
  scene.fog.density=0.022; scene.fog.color.setHex(0x05070a); scene.background=new THREE.Color(0x05070a); if(scene.environmentIntensity!==undefined) scene.environmentIntensity=0.15;
  sun.intensity=0; hemi.intensity=0; if(rainPts) rainPts.visible=false; skyDome.visible=false;
  player.pos.set(0,0,0); cam.yaw=0; spawnMineNodes(); showMineBtns(true); renderStatus(); toast(L('进入矿洞 · 第 1 层','Entered the mine · Lv 1')); }
function descendMine(){ S.mineLevel++; player.pos.set(0,0,0); spawnMineNodes(); renderStatus(); toast(L('下到第 '+S.mineLevel+' 层','Descended · Lv '+S.mineLevel)); }
function leaveMine(){ S.inMine=false; world.visible=true; mineGroup.visible=false; showMineBtns(false); skyDome.visible=true;
  scene.background=mineSavedBg; if(scene.environmentIntensity!==undefined) scene.environmentIntensity=1.0; player.pos.set(MINE_ENT.x,0,MINE_ENT.z+3); toast(L('离开矿洞','Left the mine')); }
function mineSwing(){ if(S.energy<=0){toast(t('noenergy'));return;}
  ray.setFromCamera({x:0,y:0},camera); let hit=null,hd=1e9;
  for(const nd of mineNodes){ const b=new THREE.Box3().setFromObject(nd.mesh); const p=ray.ray.intersectBox(b,new THREE.Vector3()); if(p){ const d=p.distanceTo(camera.position); if(d<hd&&d<7){hd=d;hit=nd;} } }
  if(!hit){ spendEnergy(1); return; }
  spendEnergy(2); hit.hp--;
  if(hit.hp<=0){ mineGroup.remove(hit.mesh); mineNodes=mineNodes.filter(x=>x!==hit);
    const lv=S.mineLevel, r=Math.random(); invAdd('mat','stone',1+Math.floor(Math.random()*2));
    if(r<0.03+lv*0.01) invAdd('ore','gem',1);
    else if(r<0.22) invAdd('ore', lv>=12?'gold_ore':(lv>=6?'iron':'copper'),1);
    else if(r<0.42) invAdd('ore','coal',1);
    toast('⛏ '+L('采到矿石','mined ore'));
    if(mineNodes.length===0) toast(L('矿层清空 · 按 ⬇ 下一层','Cleared · press ⬇'));
  }
}
function showMineBtns(on){ if(!mineBtns){ mineBtns=document.createElement('div'); mineBtns.style.cssText='position:absolute;bottom:92px;right:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto;z-index:55';
    const dn=document.createElement('span'); dn.className='pill'; dn.textContent='⬇ '+L('下一层','Descend'); dn.onclick=descendMine;
    const lv=document.createElement('span'); lv.className='pill'; lv.textContent='🚪 '+L('离开','Leave'); lv.onclick=leaveMine;
    mineBtns.appendChild(dn); mineBtns.appendChild(lv); $('#hud').appendChild(mineBtns); }
  mineBtns.style.display=on?'flex':'none';
}

let fishUI=null, fishState=null;
function nearWater(){ return pondMini && Math.hypot(player.pos.x-pondMini.x,player.pos.z-pondMini.z) < pondMini.r+5; }
function tryFish(){ if(S.inMine||fishUI) return;

    +'<div id="fmsg" style="font-size:15px;margin-bottom:12px">'+L('抛竿中…','Casting…')+'</div>'
    +'<div id="fbarwrap" style="display:none;position:relative;height:22px;border-radius:11px;background:rgba(255,255,255,.12);overflow:hidden">'

  $('#hud').appendChild(fishUI);

}
function updateFish(dt){ if(!fishState) return;
  if(fishState.phase==='cast'){ fishState.t+=dt; if(fishState.t>=fishState.biteAt){ fishState.phase='bite'; $('#fmsg').textContent='❗ '+L('上钩了！','Bite!'); const w=$('#fbarwrap'); w.style.display='block'; const z=$('#fzone'); z.style.left=fishState.zoneL+'%'; z.style.width=fishState.zoneW+'%'; fishState.t=0; } }
  else { fishState.cur+=fishState.dir*dt*70; if(fishState.cur>=100){fishState.cur=100;fishState.dir=-1;} if(fishState.cur<=0){fishState.cur=0;fishState.dir=1;} const c=$('#fcur'); if(c) c.style.left=fishState.cur+'%';

}
function fishPress(){ if(!fishState) return; if(fishState.phase==='cast'){ endFish(false); return; }
  endFish(fishState.cur>=fishState.zoneL && fishState.cur<=fishState.zoneL+fishState.zoneW); }
function endFish(success){ if(!fishUI) return; fishUI.remove(); fishUI=null; fishState=null; spendEnergy(4);
  if(success){ const pool=Object.keys(FISH).filter(id=>FISH[id].season.includes(S.season)); const id=pool[Math.floor(Math.random()*pool.length)]||'carp'; invAdd('fish',id,1); toast(FISH[id].em+' '+L('钓到 ','Caught ')+metaOf('fish',id).name+'!'); }

  body.innerHTML='<div class="hint">'+L('用矿石和金币升级工具：锄头/水壶范围变大，所有工具更省体力。','Upgrade tools with ore + gold: bigger hoe/can area, all tools cost less energy.')+'</div>';
  const g=document.createElement('div'); g.className='grid'; body.appendChild(g);
  const toolE=['⛏️','🪣','🪓','🔨','🌾'];
  for(let i=0;i<5;i++){ const lvl=S.toolLvl[i]; const b=document.createElement('div'); b.className='buy';
    if(lvl>=4){ b.classList.add('dim'); b.innerHTML='<div class="em">'+toolE[i]+'</div><div class="nm">'+t('tools')[i]+'</div><div class="pr">'+L('已满级','MAX')+'</div>'; }
    else { const tr=TOOL_TIERS[lvl]; const ok=S.gold>=tr.gold && invCount('ore',tr.ore)>=tr.n; if(!ok) b.classList.add('dim');
      b.innerHTML='<div class="em">'+toolE[i]+'</div><div class="nm">'+t('tools')[i]+' → '+(LANG==='zh'?tr.nm.zh:tr.nm.en)+'</div><div class="pr">'+ORES[tr.ore].em+tr.n+' · '+tr.gold+'g</div>';
      b.onclick=()=>{ if(S.gold<tr.gold||invCount('ore',tr.ore)<tr.n){ toast(L('材料或金币不足','Not enough ore/gold')); return;} S.gold-=tr.gold; invTake('ore',tr.ore,tr.n); S.toolLvl[i]++; renderStatus(); renderHotbar(); toast('🔧 '+t('tools')[i]+' → '+(LANG==='zh'?tr.nm.zh:tr.nm.en)+'!'); openBlacksmith(); };
    }
    g.appendChild(b); }
}); }

/* ---- cooking + eating ---- */
function openCook(){ modal(L('🍳 烹饪','🍳 Cooking'), body=>{
  body.innerHTML='<div class="hint">'+L('用食材烹饪料理，食用恢复体力，也可出售。','Cook ingredients into dishes — eat to restore energy, or sell them.')+'</div>';
  const g=document.createElement('div'); g.className='grid'; body.appendChild(g);
  for(const id in COOK){ const r=COOK[id]; const f=FOOD[id]; const ok=hasCost(r.cost); const b=document.createElement('div'); b.className='buy'+(ok?'':' dim');
    b.innerHTML='<div class="em">'+f.em+'</div><div class="nm">'+metaOf('food',id).name+'</div><div class="pr">'+costStr(r.cost)+' · ⚡'+f.energy+'</div>';
    b.onclick=()=>{ if(!payCost(r.cost)){ toast(L('食材不足','Missing ingredients')); return;} invAdd('food',id,1); toast('🍽 +'+metaOf('food',id).name); openCook(); };
    g.appendChild(b); }
}); }
function eat(id){ const f=FOOD[id]; if(!f||!invCount('food',id)) return; invTake('food',id,1); S.energy=clamp(S.energy+f.energy,0,S.maxEnergy); renderEnergy(); toast('🍽 '+metaOf('food',id).name+' +⚡'+f.energy); }

/* ---- festival mini-game: lucky pick ---- */
function openFestival(){ modal('🎉 '+(S.festival||L('节日','Festival')), body=>{
  body.innerHTML='<div class="hint">'+L('选一个礼盒，试试运气！','Pick a gift box — try your luck!')+'</div>';
  const g=document.createElement('div'); g.className='grid'; body.appendChild(g);
  for(let i=0;i<3;i++){ const b=document.createElement('div'); b.className='buy'; b.innerHTML='<div class="em">🎁</div><div class="nm">'+L('礼盒','Box')+' '+(i+1)+'</div>';
    b.onclick=()=>{ if(S.festDone) return; S.festDone=true; const r=Math.random(); let msg;
      if(r<0.3){ const amt=400+Math.floor(Math.random()*4)*200; S.gold+=amt; msg='🪙 +'+amt+'g'; }
      else if(r<0.55){ invAdd('ore','gem',1); msg='💎 '+metaOf('ore','gem').name; }
      else if(r<0.8){ const ids=Object.keys(CROPS); const cid=ids[Math.floor(Math.random()*ids.length)]; invAdd('seed',cid,3); msg='🌱 '+cropName(cid)+' ×3'; }
      else { invAdd('food','pumpkin_pie',1); msg='🥧 '+metaOf('food','pumpkin_pie').name; }
      renderStatus(); toast('🎉 '+msg); body.innerHTML='<div style="text-align:center;font-size:17px;padding:14px">🎉 '+msg+'</div>'; };
    g.appendChild(b); }
}); }

/* ---- save / load (localStorage) ---- */
function saveGame(){
  try{
    const tiles=[]; for(const [k,tl] of S.tiles){ tiles.push([k,{t:tl.tilled?1:0,w:tl.watered?1:0,s:tl.sprinkler?1:0,c:tl.crop?[tl.crop.id,tl.crop.stage]:0}]); }
    const data={ v:2, gold:S.gold, day:S.day, season:S.season, time:S.time, energy:S.energy,
      toolLvl:S.toolLvl, inv:S.inv, weather:S.weather, shipped:S.shipped, mineLevel:S.mineLevel,
      tiles, placements, coopStash, animals:animals.map(a=>a.type), npc:NPCS.map(n=>n.hearts) };
    localStorage.setItem('sv_save', JSON.stringify(data));
  }catch(e){}
}
function loadGame(){
  let data; try{ data=JSON.parse(localStorage.getItem('sv_save')); }catch(e){} if(!data||data.v!==2) return false;
  try{
    S.gold=data.gold; S.day=data.day; S.season=data.season; S.time=data.time; S.energy=data.energy;
    S.toolLvl=data.toolLvl||[0,0,0,0,0]; S.inv=data.inv||{}; S.weather=data.weather||'clear'; S.shipped=data.shipped||0; S.mineLevel=data.mineLevel||0;
    S.tiles=new Map();
    for(const [k,tl] of (data.tiles||[])){ S.tiles.set(k,{tilled:!!tl.t,watered:!!tl.w,sprinkler:!!tl.s, crop: tl.c?{id:tl.c[0],stage:tl.c[1],watered:!!tl.w}:null}); }
    for(const [k] of S.tiles){ const a=k.split(',').map(Number); refreshTileMesh(a[0],a[1]); rebuildCrop(a[0],a[1]); }
    placements=[]; (data.placements||[]).forEach(p=>{ placements.push(p); spawnPlacement(p.id,p.x,p.z,p.ry); });
    (data.animals||[]).forEach(t=>spawnAnimal(t));
    (data.npc||[]).forEach((h,i)=>{ if(NPCS[i]) NPCS[i].hearts=h; });
    coopStash=data.coopStash||{egg:0,milk:0};
    retintGround(); return true;
  }catch(e){ return false; }
}
function resetSave(){ try{ localStorage.removeItem('sv_save'); }catch(e){} location.reload(); }

/* ============================ BOOT ============================ */
function setProgress(p,msg){ $('#bar>i').style.width=p+'%'; if(msg)$('#loadsub').textContent=msg; }
async function boot(){
  $('#loadsub').textContent=t('gen');
  buildGround(); setProgress(18);
  $('#loadsub').textContent='加载 3D 资源 · loading assets…';
  await loadModels(); setProgress(42);
  scatterRealProps(); buildPond(); buildScenery(); buildGrassField(); buildRain(); buildCritters(); buildFireflies(); buildPetals(); setProgress(55);
  makeCottage(); makeBed(); makeStall(); makeBin(); buildAnvil(); buildStove(); buildTown(); buildCoop(); buildMine(); buildNPCs(); setProgress(62);
  buildAvatar(); await loadTwinkle(); setupPost(); setProgress(72);

  // HDRI environment (CC0 Poly Haven) — image-based lighting + sky
  try{
    const hdr=await new RGBELoader().loadAsync('assets/sky.hdr');
    hdr.mapping=THREE.EquirectangularReflectionMapping;
    const pmrem=new THREE.PMREMGenerator(renderer);
    const env=pmrem.fromEquirectangular(hdr).texture;
    scene.environment=env; scene.background=null; scene.environmentIntensity=1.0;   // gradient dome is the visible sky; HDRI only lights reflections
    hdr.dispose(); pmrem.dispose();
  }catch(e){ scene.background=new THREE.Color(0x9fc9e8); }
  try{ renderIcons(); }catch(e){}   // bake crop models → shop/inventory icons
  setProgress(90);

  // starter kit
  invAdd('seed','parsnip',5); invAdd('seed','potato',2);
  invAdd('mat','wood',8); invAdd('mat','stone',6); invAdd('ore','copper',2);
  if(loadGame()) toast(L('存档已读取','Save loaded'));   // restore progress if present
  addEventListener('beforeunload', saveGame);
  renderStatus(); renderEnergy(); renderHotbar(); applyLang();
  retintGround(); applyWeather(); updateQualBtn();
  setProgress(100);
  setTimeout(()=>{ $('#load').classList.add('hidden'); $('#hud').classList.remove('hidden'); },250);
  requestAnimationFrame(frame);
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer&&composer.setSize(innerWidth,innerHeight); aoPass&&aoPass.setSize(innerWidth,innerHeight); });
boot();
</script>
