/* a flat scrolling deck of cloud, the way a block game has always done it */
let cloudPlane=null, cloudMat=null;
(function(){
  // A flat deck lit like volume: fbm shapes the puffs, and the sun side is
  // found by stepping the density toward the sun — a cheap self-shadow that
  // makes the clouds read as fluffy and three-dimensional, not a painted plane.
  const g=new T.PlaneGeometry(2400,2400); g.rotateX(-Math.PI/2);
  cloudMat=new T.ShaderMaterial({
    uniforms:{uTime:{value:0},uSunDir:{value:new T.Vector3(0,1,0)},
      uSunCol:{value:new T.Color(0xffe6c0)},uShade:{value:new T.Color(0x9fb0cc)},
      uCov:{value:0.5},uOpacity:{value:0.9},uCam:{value:new T.Vector3()}},
    vertexShader:['varying vec3 vW;void main(){',
      'vW=(modelMatrix*vec4(position,1.0)).xyz;',
      'gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}'].join('\n'),
    fragmentShader:['precision highp float;',
      'uniform float uTime,uCov,uOpacity; uniform vec3 uSunDir,uSunCol,uShade,uCam;',
      'varying vec3 vW;',
      'float h(vec2 p){ p=fract(p*vec2(123.34,345.45)); p+=dot(p,p+34.345); return fract(p.x*p.y); }',
      'float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.0-2.0*f);',
      '  return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }',
      'float fbm(vec2 p){ float a=0.5,v=0.0; for(int i=0;i<5;i++){ v+=a*vn(p); p*=2.03; a*=0.5; } return v; }',
      'float clouds(vec2 p){ float d=fbm(p*0.012+vec2(uTime*0.004,uTime*0.0026));',
      '  d=smoothstep(1.0-uCov,1.0-uCov+0.42,d); return d; }',
      'void main(){',
      '  vec2 p=vW.xz;',
      '  float d=clouds(p);',
      '  if(d<=0.003) discard;',
      '  // step toward the sun: if there is cloud between here and the sun, shade it',
      '  vec2 sv=normalize(uSunDir.xz+vec2(0.001))*18.0;',
      '  float ahead=clouds(p+sv)*0.6+clouds(p+sv*2.2)*0.4;',
      '  float lit=clamp(1.0-ahead*1.1,0.0,1.0);',
      '  float rim=smoothstep(0.0,0.5,d)*(1.0-smoothstep(0.5,0.95,d));',
      '  vec3 col=mix(uShade,uSunCol*1.05,lit);',
      '  col+=uSunCol*rim*0.25*max(uSunDir.y,0.0);',
      '  // fade at the edge of the deck so it never shows a hard border',
      '  float far=1.0-smoothstep(700.0,1150.0,length(vW.xz-uCam.xz));',
      '  gl_FragColor=vec4(col, d*uOpacity*far);',
      '}'].join('\n'),
    transparent:true,depthWrite:false,depthTest:false,fog:false,side:T.DoubleSide});
  cloudPlane=new T.Mesh(g,cloudMat);
  cloudPlane.position.y=118; cloudPlane.frustumCulled=false; skyScene.add(cloudPlane);
})();

/* ---- motes — the air is not empty -----------------------------------
   Pollen drifting in the sun, fireflies once it is dark. One Points
   cloud that follows the player and wraps inside a box around them, so
   it never runs out and never costs more than one draw call. */
let motes=null;
const MOTE_N=320, MOTE_BOX=34, MOTE_H=13;
(function(){
  const g=new T.BufferGeometry();
  const pos=new Float32Array(MOTE_N*3), ph=new Float32Array(MOTE_N),
        sz=new Float32Array(MOTE_N);
  for(let i=0;i<MOTE_N;i++){
    pos[i*3]=(Math.random()-0.5)*MOTE_BOX;
    pos[i*3+1]=Math.random()*MOTE_H;
    pos[i*3+2]=(Math.random()-0.5)*MOTE_BOX;
    ph[i]=Math.random()*62.8; sz[i]=0.6+Math.random()*1.5;
  }
  g.setAttribute('position',new T.BufferAttribute(pos,3));
  g.setAttribute('aPhase',new T.BufferAttribute(ph,1));
  g.setAttribute('aSize',new T.BufferAttribute(sz,1));
  const m=new T.ShaderMaterial({
    uniforms:{uMap:{value:GLOW_WARM},uTime:{value:0},uNight:{value:0},
              uPx:{value:600},uCol:{value:new T.Color(0xfff0cc)}},
    vertexShader:[
      'attribute float aPhase,aSize; uniform float uTime,uNight,uPx;',
      'varying float vTw;',
      'void main(){',
      '  vec3 p=position;',
      // a slow wander, so they never travel in a straight line
      '  p.x+=sin(uTime*0.42+aPhase)*1.5;',
      '  p.y+=sin(uTime*0.31+aPhase*1.7)*0.9+uTime*0.22;',
      '  p.z+=cos(uTime*0.37+aPhase*1.3)*1.5;',
      '  p.y=mod(p.y,'+MOTE_H.toFixed(1)+');',
      '  vTw=0.35+0.65*pow(max(sin(uTime*(1.1+fract(aPhase)*2.2)+aPhase),0.0),1.5);',
      '  vec4 mv=modelViewMatrix*vec4(p,1.0);',
      '  gl_PointSize=aSize*uPx*(0.6+uNight*0.8)/max(-mv.z,1.0);',
      '  gl_Position=projectionMatrix*mv;',
      '}'].join('\n'),
    fragmentShader:[
      'uniform sampler2D uMap; uniform float uNight; uniform vec3 uCol;',
      'varying float vTw;',
      'void main(){ vec4 t=texture2D(uMap,gl_PointCoord);',
      // by day it is dust catching the light; at night it blinks
      '  float a=t.a*mix(0.22,vTw*0.95,uNight);',
      '  gl_FragColor=vec4(uCol*t.rgb,a); }'].join('\n'),
    transparent:true,depthWrite:false,blending:T.AdditiveBlending,fog:false});
  motes=new T.Points(g,m);
  motes.frustumCulled=false; scene.add(motes);
})();

/* ---- weather --------------------------------------------------------
   One Points cloud does both rain and snow: the difference is the fall
   speed, the drift and the shape drawn in the fragment, all driven by
   one uniform, so switching costs nothing and can cross-fade.
   ------------------------------------------------------------------- */
const WEATHER={kind:0, wet:0, want:0, t:40+Math.random()*90, snow:0};
let rainPts=null;
const RAIN_N=1200, RAIN_BOX=40, RAIN_H=26;
(function(){
  const g=new T.BufferGeometry();
  const pos=new Float32Array(RAIN_N*3), ph=new Float32Array(RAIN_N);
  for(let i=0;i<RAIN_N;i++){
    pos[i*3]=(Math.random()-0.5)*RAIN_BOX;
    pos[i*3+1]=Math.random()*RAIN_H;
    pos[i*3+2]=(Math.random()-0.5)*RAIN_BOX;
    ph[i]=Math.random()*62.8;
  }
  g.setAttribute('position',new T.BufferAttribute(pos,3));
  g.setAttribute('aPhase',new T.BufferAttribute(ph,1));
  const m=new T.ShaderMaterial({
    uniforms:{uTime:{value:0},uSnow:{value:0},uAmt:{value:0},uPx:{value:600},
              uCol:{value:new T.Color(0xcfe2f5)}},
    vertexShader:[
      'attribute float aPhase; uniform float uTime,uSnow,uPx,uAmt;',
      'varying float vF;',
      'void main(){',
      '  vec3 p=position;',
      '  float sp=mix(27.0,3.0,uSnow);',
      '  p.y=mod(p.y-uTime*sp+aPhase*3.0,'+RAIN_H.toFixed(1)+');',
      '  float dr=mix(0.25,1.7,uSnow);',
      '  p.x+=sin(uTime*0.8+aPhase)*dr+uTime*mix(1.6,0.3,uSnow);',
      '  p.z+=cos(uTime*0.63+aPhase*1.4)*dr;',
      '  p.x=mod(p.x+'+(RAIN_BOX*0.5).toFixed(1)+','+RAIN_BOX.toFixed(1)+')-'+(RAIN_BOX*0.5).toFixed(1)+';',
      '  vF=uAmt;',
      '  vec4 mv=modelViewMatrix*vec4(p,1.0);',
      '  gl_PointSize=mix(5.0,3.4,uSnow)*uPx/max(-mv.z,1.0);',
      '  gl_Position=projectionMatrix*mv;',
      '}'].join('\n'),
    fragmentShader:[
      'uniform float uSnow; uniform vec3 uCol; varying float vF;',
      'void main(){',
      '  vec2 c=gl_PointCoord-0.5;',
      // a streak when it rains, a soft flake when it snows
      '  float streak=smoothstep(0.26,0.04,abs(c.x)*6.0)*smoothstep(0.5,0.12,abs(c.y));',
      '  float flake=smoothstep(0.5,0.08,length(c));',
      '  float a=mix(streak,flake,uSnow)*vF;',
      '  if(a<0.01) discard;',
      '  gl_FragColor=vec4(uCol,a*mix(0.55,0.9,uSnow));',
      '}'].join('\n'),
    transparent:true,depthWrite:false,fog:false});
  rainPts=new T.Points(g,m);
  rainPts.frustumCulled=false; rainPts.visible=false; scene.add(rainPts);
})();
function updateWeather(dt){
  WEATHER.t-=dt;
  if(WEATHER.t<=0){
    // most of the time it is simply clear; weather should be an event
    const r=Math.random();
    WEATHER.want=(r<0.58)?0:1;
    WEATHER.t=WEATHER.want? (50+Math.random()*80) : (120+Math.random()*220);
  }
  WEATHER.wet+=((WEATHER.want?1:0)-WEATHER.wet)*Math.min(1,dt*0.12);
  if(WEATHER.wet<0.004) WEATHER.wet=0;
  // snow or rain is decided by where you are standing, not by the sky
  let cold=0;
  try{
    const b=column(Math.floor(camera.position.x),Math.floor(camera.position.z)).biome;
    cold=(b===B_SNOW||b===B_PEAK)?1:0;
  }catch(e){}
  WEATHER.snow+=(cold-WEATHER.snow)*Math.min(1,dt*0.5);
  if(rainPts){
    const u=rainPts.material.uniforms;
    u.uTime.value=performance.now()/1000;
    u.uSnow.value=WEATHER.snow;
    u.uAmt.value=WEATHER.wet;
    u.uPx.value=(window.innerHeight*renderer.getPixelRatio())/
                (2*Math.tan(T.MathUtils.degToRad(camera.fov/2)))*0.0055;
    u.uCol.value.setRGB(lerp(0.74,0.95,WEATHER.snow),
                        lerp(0.84,0.97,WEATHER.snow),
                        lerp(0.98,1.0,WEATHER.snow));
    rainPts.visible=WEATHER.wet>0.01;
    rainPts.position.set(Math.round(camera.position.x),
                         Math.floor(camera.position.y)-8,
                         Math.round(camera.position.z));
  }
}

/* ---- lights, for the CHARACTERS only ------------------------------
   The terrain carries its own light in the mesh (sky level, lamp level
   and AO are vertex data), so it costs nothing per light. The figures
   are ordinary three.js materials and do need real lamps. */
const hemi=new T.HemisphereLight(0xbcd4f2,0x5a5248,1.0); scene.add(hemi);
const sunLight=new T.DirectionalLight(0xffeccf,1.4); scene.add(sunLight);
sunLight.castShadow=true;
const SHADOW_RES=1024, SHADOW_HALF=30;
sunLight.shadow.mapSize.set(SHADOW_RES,SHADOW_RES);
sunLight.shadow.camera.near=1; sunLight.shadow.camera.far=240;
sunLight.shadow.camera.left=-SHADOW_HALF; sunLight.shadow.camera.right=SHADOW_HALF;
sunLight.shadow.camera.top=SHADOW_HALF;   sunLight.shadow.camera.bottom=-SHADOW_HALF;
sunLight.shadow.bias=-0.0012; sunLight.shadow.normalBias=0.04;
// three.js never recomputes this for you: set the bounds and the camera keeps
// the ±5 box it was constructed with, so the shadow covers almost nothing
sunLight.shadow.camera.updateProjectionMatrix();
const sunTarget=new T.Object3D(); scene.add(sunTarget); sunLight.target=sunTarget;
const playerLamp=new T.PointLight(0xffd9a4,0,13,2); scene.add(playerLamp);

/* ---- chunk material ------------------------------------------------
   One material draws the terrain AND the ground cover. Everything that
   makes a cube stop looking like a cube happens here, per fragment:

   · block seams, drawn from the world position so a greedy-merged quad
     sixteen blocks wide still shows every block in it. Divided by fwidth
     so the line stays one pixel at any distance instead of crawling.
   · a per-block colour jitter, hashed off the block's own coordinate, so
     no two blocks in a field are the same green.
   · a grass lip down the top of every side face.
   · real directional sun, per face. A voxel face is flat and that is the
     point: at dusk the west faces take the light and the east faces do not.
   ------------------------------------------------------------------- */
const CHUNK_U={
  uAmb:{value:new T.Color(0x2a3350)},
  uSky:{value:new T.Color(0xffffff)},
  uLamp:{value:new T.Color(0xffc477)},
  uSunCol:{value:new T.Color(0xffe6c0)},
  uSunDir:{value:new T.Vector3(0,1,0)},
  uSunAmt:{value:1},
  uGrass:{value:new T.Color(0x7cb75a)},
  uFogCol:{value:new T.Color(0x9fc4e8)},
  uFogD:{value:0.0055},
  uTime:{value:0},
  uWind:{value:1},
  uShadowMap:{value:null},
  uShadowMat:{value:new T.Matrix4()},
  uShadowTexel:{value:new T.Vector2(1/1024,1/1024)},
  uShadowOn:{value:0},
  uDbg:{value:0},
  uCloudAmt:{value:0.55},
  uWet:{value:0},
  uReal:{value:1.0},
  uSkyZen:{value:new T.Color(0x3f86e0)},
  uSkyHor:{value:new T.Color(0xbfe0fb)}
};
const GLSL_HASH=[
  'float h31(vec3 p){',
  '  p=fract(p*0.3183099+vec3(0.71,0.113,0.419));',
  '  p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z));',
  '}',
  'float h21(vec2 p){ p=fract(p*vec2(443.8975,441.4237));',
  '  p+=dot(p,p.yx+19.19); return fract((p.x+p.y)*p.x); }',
  'float vnoise(vec2 p){',
  '  vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);',
  '  return mix(mix(h21(i),h21(i+vec2(1.0,0.0)),f.x),',
  '             mix(h21(i+vec2(0.0,1.0)),h21(i+vec2(1.0,1.0)),f.x),f.y);',
  '}',
  'float cloudShade(vec2 w,float t,float amt){',
  '  vec2 p=w*0.013+vec2(t*0.0075,t*0.0049);',
  '  float n=vnoise(p)*0.62+vnoise(p*2.7+11.3)*0.38;',
  '  return mix(1.0,smoothstep(0.34,0.68,n)*0.55+0.45,amt);',
  '}',
  // Surface height per family, read in the block face's own coords. The
  // normal is perturbed from its gradient, which is what turns a flat painted
  // face into relief that actually catches the light — the single biggest
  // step from "cartoon" to "shader pack" on a block world.
  'float surfH(vec2 p,float fam){',
  '  if(fam>2.5&&fam<3.5) return sin((p.x+p.y*0.4)*21.0)*0.5;',           // sand ripples
  '  if(fam>3.5&&fam<4.5) return sin(p.x*33.0)*0.5;',                     // wood grain
  '  if(fam>5.5&&fam<6.5) return abs(fract(p.y*4.0)-0.5)*1.4;',           // plank grooves
  '  if(fam>6.5&&fam<7.5){ float row=floor(p.y*3.0);',
  '    float uu=fract(p.x*2.0+mod(row,2.0)*0.5), vv=fract(p.y*3.0);',
  '    return -min(min(uu,1.0-uu),min(vv,1.0-vv))*2.0; }',               // mortar valleys
  '  return vnoise(p*9.0)*0.52+vnoise(p*23.0)*0.30+vnoise(p*55.0)*0.18;', // rock/soil/grass/leaf
  '}'].join('\n');

const CHUNK_VS=[
  'attribute vec3 aLt; attribute vec2 aFx;',
  'uniform float uTime, uWind; uniform mat4 uShadowMat;',
  'varying vec3 vCol, vW, vN, vLt;',
  'varying float vFlag, vFog, vFam;',
  'varying vec4 vSC;',
  'void main(){',
  '  vCol=color; vLt=aLt; vFlag=aFx.x; vFam=aFx.y; vN=normal;',
  '  vec4 wp=modelMatrix*vec4(position,1.0);',
  // Wind reads the SAME slot the terrain uses for its surface family, so it
  // must be gated on the plant flag. Without this gate every block in the
  // world inherits a wind weight equal to its material id and the whole
  // landscape blows around.
  '  float w=(aFx.x>7.5)?aFx.y:0.0;',
  '  if(w>0.0){',
  '    float s=sin(uTime*1.7+wp.x*0.55+wp.z*0.73)+0.5*sin(uTime*2.9+wp.z*0.41);',
  '    wp.x+=s*0.085*w*w*uWind;',
  '    wp.z+=cos(uTime*1.31+wp.z*0.61+wp.x*0.3)*0.062*w*w*uWind;',
  '    wp.y-=abs(s)*0.014*w;',
  '  }',
  '  vW=wp.xyz;',
  '  vSC=uShadowMat*wp;',
  '  vec4 mv=viewMatrix*wp; vFog=-mv.z;',
  '  gl_Position=projectionMatrix*mv;',
  '}'].join('\n');

/* Sampling three.js's own shadow map by hand. The matrix it hands us already
   carries the 0..1 bias, and the depth is RGBA-packed, which is what the
   <packing> chunk is included for. Five taps is enough for an edge this soft;
   outside the box there is simply no shadow, faded so the border never shows. */
const GLSL_SHADOW=[
  '#include <packing>',
  'uniform sampler2D uShadowMap; uniform vec2 uShadowTexel; uniform float uShadowOn;',
  'varying vec4 vSC;',
  'float tapS(vec2 uv,float cmp){',
  '  return step(cmp,unpackRGBAToDepth(texture2D(uShadowMap,uv)));',
  '}',
  'float sunShadow(){',
  '  if(uShadowOn<0.5) return 1.0;',
  '  vec3 sc=vSC.xyz/vSC.w;',
  '  if(sc.z>1.0) return 1.0;',
  '  vec2 ed=min(sc.xy,1.0-sc.xy);',
  '  float inside=smoothstep(0.0,0.05,min(ed.x,ed.y));',
  '  if(inside<=0.0) return 1.0;',
  '  float cmp=sc.z-0.0018;',
  '  float s=tapS(sc.xy,cmp);',
  '  s+=tapS(sc.xy+vec2(-1.3,-1.3)*uShadowTexel,cmp);',
  '  s+=tapS(sc.xy+vec2( 1.3,-1.3)*uShadowTexel,cmp);',
  '  s+=tapS(sc.xy+vec2(-1.3, 1.3)*uShadowTexel,cmp);',
  '  s+=tapS(sc.xy+vec2( 1.3, 1.3)*uShadowTexel,cmp);',
  '  return mix(1.0,s*0.2,inside);',
  '}'].join('\n');

const CHUNK_FS=[
  'uniform vec3 uAmb,uSky,uLamp,uFogCol,uSunDir,uSunCol,uGrass;',
  'uniform float uFogD,uTime,uSunAmt,uDbg,uCloudAmt,uWet,uReal;',
  'varying vec3 vCol,vW,vN,vLt;',
  'varying float vFlag,vFog,vFam;',
  GLSL_HASH, GLSL_SHADOW,
  'void main(){',
  '  vec3 n=normalize(vN);',
  '  vec3 col=vCol;',
  '  float plant=step(7.5,vFlag);',
  '  vec3 cell=floor(vW-n*0.5+0.0005);',
  '  vec3 fp=fract(vW-n*0.002);',
  '  vec3 dd=min(fp,1.0-fp);',
  '  vec3 fw=fwidth(vW)+1e-6;',
  // A groove of a fixed width IN BLOCKS, not in pixels: a one-pixel line is
  // invisible two steps away and crawls when you move. fwidth only sets how
  // far the edge is smoothed, so it stays clean at every distance.
  '  const float LW=0.052, BW=0.11;',
  '  vec3 ga=smoothstep(vec3(LW)-fw*1.3,vec3(LW)+fw*1.3,dd);',
  '  vec3 ba=smoothstep(vec3(BW)-fw*1.3,vec3(BW)+fw*1.3,dd);',
  '  float seam=1.0, bev=1.0;',
  '  if(abs(n.x)<0.5){ seam=min(seam,ga.x); bev=min(bev,ba.x); }',
  '  if(abs(n.y)<0.5){ seam=min(seam,ga.y); bev=min(bev,ba.y); }',
  '  if(abs(n.z)<0.5){ seam=min(seam,ga.z); bev=min(bev,ba.z); }',
  '  if(plant<0.5){',
  '    col*=0.92+h31(cell)*0.16;',                 // no two blocks alike
  // grain in the plane of the face, so it never swims when you move
  '    vec2 gp=vW.xz*abs(n.y)+vW.xy*abs(n.z)+vW.zy*abs(n.x);',
  '    float gr=vnoise(gp*6.0)*0.55+vnoise(gp*17.0)*0.45;',
  '    col*=0.90+gr*0.20;',
  '    col*=mix(0.70,1.0,seam);',                  // the groove between blocks
  '    col*=mix(1.06,1.0,bev);',                   // and the bevel inside it
  // --- the surface. Each family is drawn in the face's own 0..1 coords,
  // which is exactly where a texture would have sat, so every block type
  // reads as its own material without a single image being loaded.
  '    vec2 fuv=(abs(n.y)>0.5)?fp.xz:((abs(n.x)>0.5)?fp.zy:fp.xy);',
  '    float fam=vFam;',
  '    if(fam>0.5&&fam<1.5){',                     // rock
  '      col*=0.90+vnoise(fuv*9.0+cell.xz*0.37)*0.20;',
  '      col*=1.0-step(0.87,vnoise(fuv*23.0+cell.yz*0.11))*0.20;',
  '      float cr=abs(vnoise(fuv*4.0+cell.xy*0.21)-0.5);',
  '      col*=mix(0.78,1.0,smoothstep(0.0,0.05,cr));',
  '    } else if(fam<2.5){',                       // soil
  '      col*=0.84+vnoise(fuv*7.0+cell.xz*0.5)*0.24+vnoise(fuv*19.0)*0.12;',
  '    } else if(fam<3.5){',                       // sand
  '      float rip=sin((fuv.x+fuv.y*0.4)*21.0+vnoise(fuv*3.0)*4.0)*0.5+0.5;',
  '      col*=0.92+vnoise(fuv*27.0+cell.xz)*0.10+rip*0.06;',
  '    } else if(fam<4.5){',                       // wood: rings end-on, grain along
  '      if(abs(n.y)>0.5){',
  '        float rr=length(fuv-0.5);',
  '        col*=0.86+(sin(rr*44.0+vnoise(fuv*4.0)*3.0)*0.5+0.5)*0.20;',
  '      } else {',
  '        col*=0.84+(sin(fuv.x*33.0+vnoise(vec2(fuv.x*3.0,fuv.y*0.6))*7.0)*0.5+0.5)*0.24;',
  '      }',
  '    } else if(fam<5.5){',                       // leaves
  '      col*=0.80+h31(cell*1.31)*0.40;',           // each leaf cube its own green
  '      float d2=vnoise(fuv*15.0+cell.yz*0.3);',
  '      col*=0.70+vnoise(fuv*5.0+cell.xz*0.7)*0.40+d2*0.16;',
  '      col+=vec3(0.06,0.10,0.04)*step(0.86,d2);',    // brighter leaf specks
  '      float vein=abs(sin(fuv.x*34.0+vnoise(fuv*4.0)*5.0));',
  '      col*=0.90+smoothstep(0.90,1.0,vein)*0.14;',   // leaf veins
  '      col+=vec3(0.10,0.14,0.03)*pow(max(dot(normalize(vN),uSunDir),0.0),2.0)*0.4;',  // backlight glow
  '    } else if(fam<6.5){',                       // planks
  '      float bq=fract(fuv.y*4.0);',
  '      col*=mix(0.76,1.0,smoothstep(0.0,0.055,min(bq,1.0-bq)));',
  '      col*=0.92+(sin(fuv.x*38.0+floor(fuv.y*4.0)*3.1)*0.5+0.5)*0.13;',
  '    } else if(fam<7.5){',                       // masonry courses
  '      float row=floor(fuv.y*3.0);',
  '      float uu=fract(fuv.x*2.0+mod(row,2.0)*0.5), vv=fract(fuv.y*3.0);',
  '      float mm=min(smoothstep(0.0,0.06,min(uu,1.0-uu)),',
  '                   smoothstep(0.0,0.08,min(vv,1.0-vv)));',
  '      col*=mix(0.72,1.0,mm)*(0.95+vnoise(fuv*12.0+row)*0.10);',
  '    } else if(fam<8.5){',                       // ice / glass facets
  '      float e2=abs(fract(fuv.x*4.0)-0.5)+abs(fract(fuv.y*4.0)-0.5);',
  '      col*=0.92+h31(vec3(floor(fuv*4.0),cell.y))*0.16;',
  '      col+=vec3(0.05,0.07,0.10)*smoothstep(0.72,0.96,e2);',
  '    } else if(fam<9.5){',                       // cloth weave
  '      col*=0.90+((sin(fuv.x*50.0)*0.5+0.5)*0.5+(sin(fuv.y*50.0)*0.5+0.5)*0.5)*0.17;',
  '    } else if(fam<10.5){',                      // grass top
  '      col*=0.87+vnoise(fuv*14.0+cell.xz*0.9)*0.21+vnoise(fuv*35.0)*0.11;',
  '    } else if(fam<11.5){',                      // ribbed stems
  '      col*=0.83+abs(fract(fuv.x*5.0)-0.5)*2.0*0.24;',
  '    } else if(fam<12.5){',                      // snow, barely there
  '      col*=0.96+vnoise(fuv*20.0)*0.09;',
  '    } else if(fam<13.5){',                      // soft organic blotches
  '      col*=0.87+vnoise(fuv*8.0+cell.yz*0.4)*0.24;',
  '    }',
  // a fine micro-grain on EVERYTHING: the high frequency a real texture has,
  // that a single mid-frequency pattern misses
  '    col*=0.93+vnoise(fuv*58.0+cell.xy*0.9)*0.08+vnoise(fuv*140.0)*0.05;',
  '    if(vFlag>0.5&&vFlag<1.5){',                 // grass over the side
  '      float wob=(h31(cell*1.7+floor(fp.xzy*6.0))-0.5)*0.07;',
  '      col=mix(col,uGrass*0.80,smoothstep(0.80,0.93,fp.y+wob));',
  '    }',
  '    if(vFlag>1.5&&vFlag<2.5){',                 // ore catches the light
  '      float g=h31(cell*3.1+floor(fp*7.0));',
  '      col+=vec3(0.55,0.68,0.95)*step(0.93,g)*0.6;',
  '    }',
  '    if(vFlag>2.5&&vFlag<3.5){',                 // snow glitters
  '      float g=h31(cell*5.3+floor(fp*11.0)+floor(uTime*1.5));',
  '      col+=vec3(0.9,0.95,1.0)*step(0.985,g)*0.9;',
  '    }',
  // --- NORMAL MAPPING: the flat face gains relief ---',
  '    float bst=0.55;',
  '    if(fam>7.5&&fam<8.5) bst=0.10;',             // ice/glass: nearly flat
  '    else if(fam>11.5&&fam<12.5) bst=0.22;',      // snow
  '    else if(fam>2.5&&fam<3.5) bst=0.30;',        // sand
  '    if(bst>0.001 && vFog<46.0){',          // relief is sub-pixel far away
  '      float e3=0.007;',
  '      float h0=surfH(fuv,fam);',
  '      float hx=surfH(fuv+vec2(e3,0.0),fam);',
  '      float hy=surfH(fuv+vec2(0.0,e3),fam);',
  '      vec3 tg,bt;',
  '      if(abs(n.y)>0.5){ tg=vec3(1.0,0.0,0.0); bt=vec3(0.0,0.0,1.0); }',
  '      else if(abs(n.x)>0.5){ tg=vec3(0.0,0.0,1.0); bt=vec3(0.0,1.0,0.0); }',
  '      else { tg=vec3(1.0,0.0,0.0); bt=vec3(0.0,1.0,0.0); }',
  '      vec3 grad=(tg*(hx-h0)+bt*(hy-h0))/e3;',
  '      n=normalize(n - grad*bst*0.14*uReal);',
  '    }',
  '  }',
  // --- light ---
  '  vec3 vd=normalize(cameraPosition-vW);',
  '  float ndlRaw=max(dot(n,uSunDir),0.0);',
  '  float shRaw=sunShadow()*cloudShade(vW.xz,uTime,uCloudAmt);',
  // Two renderings of the same light. The TOON branch quantises it into flat
  // steps; the REAL branch leaves it smooth and lets material response carry
  // the look, which is the whole difference between a cartoon and SEUS.
  '  float sw=fwidth(shRaw)*1.6+0.02;',
  '  float shToon=(smoothstep(0.40-sw,0.52+sw,shRaw)*0.58',
  '               +smoothstep(0.76-sw,0.90+sw,shRaw)*0.42);',
  '  float shReal=smoothstep(0.28,0.58,shRaw);',
  '  float sh=mix(shToon,shReal,uReal);',
  '  float nw=fwidth(ndlRaw)*1.2+0.02;',
  '  float ndlToon=smoothstep(0.08-nw,0.08+nw,ndlRaw)*0.34+smoothstep(0.46-nw,0.46+nw,ndlRaw)*0.66;',
  '  float ndl=mix(ndlToon,ndlRaw,uReal);',
  // Indirect (GI) approximation: the sky lights what faces up, and a warm
  // bounce off the lit ground fills what faces sideways and down. One term,
  // but it is most of what "global illumination" reads as to the eye.
  '  float up=max(n.y,0.0), dn=max(-n.y,0.0);',
  '  vec3 giSky=uSky*(0.35+0.65*up);',
  '  vec3 giBounce=uSunCol*uSunAmt*(0.10+0.22*dn)*vLt.x;',
  '  vec3 amb=mix(uAmb+uSky*vLt.x*(0.58+0.42*up)*mix(0.62,1.0,sh),',
  '              uAmb*0.9+giSky*vLt.x*mix(0.5,1.0,sh)+giBounce, uReal);',
  '  vec3 lit=amb + uSunCol*uSunAmt*vLt.x*ndl*sh + uLamp*vLt.y*vLt.y;',
  // PBR-ish specular: smoother families (ice, glass, planks, masonry) catch a
  // sun glint; rough earth and leaves do not. Only in the realistic branch.
  '  float rough=0.95;',
  '  if(vFam>7.5&&vFam<8.5) rough=0.30;',           // ice / glass
  '  else if(vFam>5.5&&vFam<7.5) rough=0.55;',      // planks / masonry
  '  else if(vFam>0.5&&vFam<1.5) rough=0.70;',      // rock
  '  float shin=exp2((1.0-rough)*10.0);',
  '  vec3 hv=normalize(vd+uSunDir);',
  '  float spec=pow(max(dot(n,hv),0.0),shin)*(1.0-rough)*1.4;',
  '  float fres=mix(0.03,1.0,pow(1.0-max(dot(n,vd),0.0),5.0));',
  '  col*=lit*vLt.z;',
  '  col=mix(col*vec3(0.62,0.74,1.05),col*vec3(1.10,1.04,0.92),sh);',
  '  col+=uSunCol*uSunAmt*spec*sh*vLt.x*uReal;',
  '  col+=uSky*fres*(1.0-rough)*vLt.x*0.25*uReal;',
  // Rain only wets what the sky can actually reach. vLt.x is the baked sky
  // exposure, so the undersides of trees and the insides of caves stay dry
  // — that one check is what separates "wet world" from "wet-looking filter".
  '  if(uWet>0.01&&plant<0.5){',
  '    float wet=uWet*smoothstep(0.40,0.95,vLt.x)*max(n.y,0.0);',
  '    col*=mix(1.0,0.70,wet);',                 // a wet surface is a dark one
  '    vec3 vdir=normalize(cameraPosition-vW);',
  '    vec3 hv=normalize(vdir+uSunDir);',
  '    col+=uSunCol*pow(max(dot(n,hv),0.0),58.0)*wet*1.7*max(uSunAmt,0.25);',
  '    col+=uSky*pow(1.0-max(dot(n,vdir),0.0),4.0)*wet*0.45;',
  // and the splash: rings expanding where drops land
  '    float rp=fract(vnoise(floor(vW.xz*2.0))*7.0+uTime*1.6);',
  '    float rr=length(fract(vW.xz*2.0)-0.5)*2.0;',
  '    col+=vec3(0.07,0.08,0.09)*wet*smoothstep(0.08,0.0,abs(rr-rp))*(1.0-rp);',
  '  }',
  // Air does not paint grey over things; it washes the colour out of them
  // first. Desaturating toward the sky before the fog is mixed in is what
  // keeps a distant hill looking like a distant hill instead of smoke.
  '  float aer=clamp(max(vFog,0.0)*0.0055,0.0,1.0);',
  '  float alum=dot(col,vec3(0.2126,0.7152,0.0722));',
  '  col=mix(col,mix(vec3(alum),uFogCol,0.45),aer*0.42);',
  '  float f=1.0-exp(-pow(max(vFog,0.0)*uFogD,2.0));',
  '  if(uDbg>0.5){ vec3 sc2=vSC.xyz/vSC.w;',
  '    if(uDbg<1.5) gl_FragColor=vec4(vec3(sh),1.0);',
  '    else if(uDbg<2.5) gl_FragColor=vec4(sc2.xy,0.0,1.0);',
  '    else gl_FragColor=vec4(vec3(unpackRGBAToDepth(texture2D(uShadowMap,sc2.xy))),1.0);',
  '    return; }',
  '  gl_FragColor=vec4(mix(col,uFogCol,clamp(f,0.0,1.0)),1.0);',
  '}'].join('\n');

const chunkMat=new T.ShaderMaterial({
  uniforms:CHUNK_U, vertexShader:CHUNK_VS, fragmentShader:CHUNK_FS, vertexColors:true});

/* water: its own depth, its own foam, and one glint off the sun */
const waterMat=new T.ShaderMaterial({
  uniforms:CHUNK_U,
  vertexShader:[
    'attribute vec3 aLt; attribute vec2 aFx;',
    'uniform float uTime;',
    'varying vec3 vW,vN,vLt; varying float vFlag,vFog;',
    'void main(){',
    '  vLt=aLt; vFlag=aFx.x; vN=normal;',
    '  vec4 wp=modelMatrix*vec4(position,1.0);',
    '  wp.y+=sin(wp.x*0.8+uTime*1.6)*0.045+sin(wp.z*1.1-uTime*1.2)*0.035-0.10;',
    '  vW=wp.xyz;',
    '  vec4 mv=viewMatrix*wp; vFog=-mv.z;',
    '  gl_Position=projectionMatrix*mv;',
    '}'].join('\n'),
  fragmentShader:[
    'uniform vec3 uAmb,uSky,uLamp,uFogCol,uSunDir,uSunCol,uSkyZen,uSkyHor;',
    'uniform float uFogD,uTime,uSunAmt,uCloudAmt,uWet;',
    'varying vec3 vW,vN,vLt; varying float vFlag,vFog;',
    GLSL_HASH,
    'void main(){',
    // the mesher counted how deep the water is here; shallow is almost air
    '  float dep=clamp(vFlag/7.0,0.0,1.0);',
    '  vec3 shallow=vec3(0.52,0.80,0.82), deep=vec3(0.07,0.24,0.47);',
    '  vec3 col=mix(shallow,deep,smoothstep(0.0,0.72,dep));',
    '  float nz=h31(floor(vW*2.3+vec3(uTime*0.7,0.0,uTime*0.45)));',
    '  float nz2=h31(floor(vW*4.1-vec3(uTime*0.4,0.0,uTime*0.8)));',
    '  float foam=(1.0-smoothstep(0.02,0.34,dep))*step(0.46,nz*0.6+nz2*0.6);',
    '  col=mix(col,vec3(0.94,0.99,1.0),foam*0.8);',
    // a ripple of light across the surface, and one hard glint off the sun
    '  vec3 n=normalize(vec3(sin(vW.x*1.7+uTime*1.4)*0.13,1.0,',
    '                        cos(vW.z*1.9-uTime*1.1)*0.13));',
    '  vec3 vd=normalize(cameraPosition-vW);',
    '  float sp=pow(max(dot(reflect(-uSunDir,n),vd),0.0),48.0);',
    '  float csh=cloudShade(vW.xz,uTime,uCloudAmt);',
    '  vec3 lit=uAmb+uSky*vLt.x*0.95',
    '          +uSunCol*uSunAmt*vLt.x*max(dot(n,uSunDir),0.0)*csh',
    '          +uLamp*vLt.y;',
    '  col*=lit;',
    // Fresnel sky reflection. It rides the SAME perturbed normal as the
    // specular, so when the surface is choppy the reflection breaks up with
    // it and settles again when it calms — which is the thing people notice.
    // reflect the physical sky: the colour of the sky in the direction the
    // water bounces the eye, graded zenith->horizon by that ray's elevation
    '  vec3 rfl=reflect(-vd,n);',
    '  float re=clamp(rfl.y,0.0,1.0);',
    '  vec3 skyRef=mix(uSkyHor,uSkyZen,pow(re,0.5));',
    '  float fres=0.04+0.96*pow(1.0-max(dot(n,vd),0.0),5.0);',
    '  col=mix(col,skyRef+uSunCol*uSunAmt*0.10,fres*0.85);',
    '  col+=uSunCol*sp*uSunAmt*1.6*vLt.x*csh;',
    '  if(uWet>0.01){',
    '    float rp=fract(h31(floor(vec3(vW.xz*2.2,0.0)))*9.0+uTime*1.9);',
    '    float rr=length(fract(vW.xz*2.2)-0.5)*2.0;',
    '    col+=vec3(0.10,0.11,0.12)*uWet*smoothstep(0.07,0.0,abs(rr-rp))*(1.0-rp);',
    '  }',
    '  float aer=clamp(max(vFog,0.0)*0.0055,0.0,1.0);',
    '  float alum=dot(col,vec3(0.2126,0.7152,0.0722));',
    '  col=mix(col,mix(vec3(alum),uFogCol,0.45),aer*0.38);',
    '  float f=1.0-exp(-pow(max(vFog,0.0)*uFogD,2.0));',
    '  col=mix(col,uFogCol,clamp(f,0.0,1.0));',
    '  gl_FragColor=vec4(col,mix(0.58,0.93,smoothstep(0.0,0.45,dep))+foam*0.2);',
    '}'].join('\n'),
  transparent:true,depthWrite:false});

/* Park the shadow box on the player and SNAP IT TO ITS OWN TEXELS.
   Sliding it by a fraction of a texel every step re-rasterises every edge
   each frame, and that is exactly what reads as a crawling, flickering
   shadow. Snapping in the light's own basis makes the map stand still while
   the world moves under it. The matrix handed to the shader is taken right
   here, from the same transform the map is about to be drawn with. */
const _lx=new T.Vector3(), _ly=new T.Vector3(), _lz=new T.Vector3(),
      _lc=new T.Vector3(), _lf=new T.Vector3();
function placeSunShadow(focusX,focusY,focusZ){
  _lz.copy(SUN); if(_lz.y<0) _lz.negate();
  if(_lz.lengthSq()<1e-6) _lz.set(0,1,0); else _lz.normalize();
  _lx.set(0,1,0).cross(_lz);
  if(_lx.lengthSq()<1e-6) _lx.set(1,0,0);
  _lx.normalize();
  _ly.crossVectors(_lz,_lx).normalize();
  _lf.set(focusX,focusY,focusZ);
  const texel=(SHADOW_HALF*2)/SHADOW_RES;
  const px=Math.round(_lf.dot(_lx)/texel)*texel;
  const py=Math.round(_lf.dot(_ly)/texel)*texel;
  const pz=_lf.dot(_lz);
  _lc.copy(_lx).multiplyScalar(px).addScaledVector(_ly,py).addScaledVector(_lz,pz);
  sunTarget.position.copy(_lc);
  sunLight.position.copy(_lc).addScaledVector(_lz,110);
  sunTarget.updateMatrixWorld(true);
  sunLight.updateMatrixWorld(true);
  sunLight.shadow.updateMatrices(sunLight);
  CHUNK_U.uShadowMat.value.copy(sunLight.shadow.matrix);
}

/* ---- the clock ----------------------------------------------------- */
const C_NIGHT_T=new T.Color(0x0a1030), C_NIGHT_B=new T.Color(0x16224a);
const C_DUSK_T =new T.Color(0x2f3f78), C_DUSK_B =new T.Color(0xeca26e);
const C_DAY_T  =new T.Color(0x3f86e0), C_DAY_B  =new T.Color(0xbfe0fb);
const _c1=new T.Color(), _c2=new T.Color();
const _rayV=new T.Vector3(), _rayF=new T.Vector3();
const _fogSwamp =new T.Color(0x6f7d5a), _fogDesert=new T.Color(0xd8c08a),
      _fogSnow  =new T.Color(0xd3e2f2), _fogJungle=new T.Color(0x7aa86e);
function updateDay(dt){
  dayT=(dayT+dt/DAY_LEN)%1;
  const a=dayT*Math.PI*2;
  SUN.set(Math.cos(a)*0.72,Math.sin(a),Math.sin(a*0.5)*0.3).normalize();
  daylight=clamp((SUN.y+0.14)/0.34,0,1);
  nightness=1-daylight;
  // dusk is strongest when the sun is ON the horizon, not before or after
  const dusk=clamp(1-Math.abs(SUN.y)/0.30,0,1);

  _c1.copy(C_NIGHT_T).lerp(C_DAY_T,daylight).lerp(C_DUSK_T,dusk*0.8);
  _c2.copy(C_NIGHT_B).lerp(C_DAY_B,daylight).lerp(C_DUSK_B,dusk*0.85);
  // feed the physical sky
  skyMat.uniforms.sunPosition.value.copy(SUN).multiplyScalar(450000);
  const wet=WEATHER.wet;
  skyMat.uniforms.turbidity.value=lerp(2.2,8.0,dusk)+wet*12.0;
  skyMat.uniforms.rayleigh.value=lerp(1.2,2.8,daylight)*(1.0-wet*0.55);
  skyMat.uniforms.mieCoefficient.value=0.005+dusk*0.012+wet*0.004;
  skyMat.uniforms.mieDirectionalG.value=0.80-dusk*0.06;
  skyMat.uniforms.uExpo.value=lerp(0.15,0.44,daylight);
  if(wet>0){
    const g0=new T.Color(0x8d9bb0).multiplyScalar(lerp(0.30,1.0,daylight));
    _c1.lerp(g0,wet*0.80); _c2.lerp(g0,wet*0.68);
  }
  HORIZ.copy(_c2).lerp(_c1,0.22);
  CHUNK_U.uFogCol.value.copy(HORIZ);
  // the water's sky reflection samples these; derive them from the physical
  // sky's own feel — a deep blue zenith and a pale warm horizon
  CHUNK_U.uSkyZen.value.setRGB(lerp(0.06,0.17,daylight),lerp(0.09,0.33,daylight),
                               lerp(0.18,0.62,daylight));
  CHUNK_U.uSkyHor.value.copy(HORIZ).multiplyScalar(lerp(0.6,1.15,daylight));
  CHUNK_U.uFogD.value=0.0038+WEATHER.wet*0.0070;
  CHUNK_U.uCloudAmt.value=0.5+WEATHER.wet*0.42;
  CHUNK_U.uWet.value=WEATHER.wet*(1-WEATHER.snow*0.75);
  // fog takes the colour of where you are standing, the way it should
  try{
    const bb=column(Math.floor(camera.position.x),Math.floor(camera.position.z)).biome;
    if(bb===B_SWAMP)        CHUNK_U.uFogCol.value.lerp(_fogSwamp,0.45);
    else if(bb===B_DESERT||bb===B_BADLANDS) CHUNK_U.uFogCol.value.lerp(_fogDesert,0.34);
    else if(bb===B_SNOW||bb===B_PEAK)       CHUNK_U.uFogCol.value.lerp(_fogSnow,0.38);
    else if(bb===B_JUNGLE)  CHUNK_U.uFogCol.value.lerp(_fogJungle,0.30);
  }catch(e){}
  CHUNK_U.uSky.value.setRGB(
    lerp(0.26,1.00,daylight)*lerp(1,1.06,dusk),
    lerp(0.31,0.98,daylight),
    lerp(0.46,0.94,daylight));
  CHUNK_U.uSky.value.multiplyScalar(0.34);
  CHUNK_U.uAmb.value.setRGB(lerp(0.07,0.13,daylight),
                            lerp(0.09,0.14,daylight),
                            lerp(0.15,0.19,daylight));
  CHUNK_U.uSunDir.value.copy(SUN.y>0?SUN:SUN.clone().negate());
  CHUNK_U.uSunAmt.value=SUN.y>0?daylight*1.20:nightness*0.09;
  CHUNK_U.uSunCol.value.setHSL(0.095-dusk*0.05,0.45+dusk*0.42,
                               SUN.y>0?0.66:0.70);
  CHUNK_U.uWind.value=0.75+Math.sin(performance.now()/9000)*0.45;
  if(sunLight.shadow.map) CHUNK_U.uShadowMap.value=sunLight.shadow.map.texture;
  CHUNK_U.uShadowOn.value=(sunLight.shadow.map&&SUN.y>0.06&&daylight>0.05)?1:0;
  starPts.material.uniforms.uOp.value=nightness*0.95;
  sunSprite.material.opacity=clamp(SUN.y*2.2+0.2,0,1)*0.95;
  moonSprite.material.opacity=clamp(-SUN.y*2.2+0.2,0,1)*0.9;
  sunSprite.position.copy(SUN).multiplyScalar(430).add(camera.position);
  moonSprite.position.copy(SUN).multiplyScalar(-430).add(camera.position);
  skyDome.position.copy(camera.position);
  starPts.position.copy(camera.position);

  sunLight.intensity=lerp(0.22,1.45,daylight);
  sunLight.color.setHSL(0.09,lerp(0.08,0.30,dusk),lerp(0.62,0.74,daylight));
  // the light is placed in placeSunShadow(), immediately before the shadow
  // map is drawn, so the two can never disagree
  hemi.intensity=lerp(0.42,1.05,daylight);
  hemi.color.copy(_c2); hemi.groundColor.setRGB(0.22,0.20,0.18);
  // Light shafts only exist when the sun is in front of you and above the
  // horizon; smearing them in from off-screen is what makes cheap god rays
  // look like a dirty lens instead of sunlight.
  _rayV.copy(SUN).multiplyScalar(400).add(camera.position).project(camera);
  matRays.uniforms.uSunUV.value.set(_rayV.x*0.5+0.5,_rayV.y*0.5+0.5);
  camera.getWorldDirection(_rayF);
  const facing=_rayF.dot(SUN);
  const edge=Math.max(Math.abs(_rayV.x),Math.abs(_rayV.y));
  matRays.uniforms.uAmount.value=(facing>0.05&&SUN.y>0.03)
    ? daylight*facing*1.15*Math.max(0,1-Math.max(0,edge-0.5)/1.2)*(1-WEATHER.wet*0.55)
    : 0;
  matComp.uniforms.uNight.value=nightness;
  matComp.uniforms.uExposure.value=lerp(1.12,0.92,daylight);
  if(motes){
    const u=motes.material.uniforms;
    u.uTime.value=performance.now()/1000;
    u.uNight.value=nightness;
    u.uCol.value.setRGB(lerp(0.95,1.0,nightness),lerp(0.96,0.88,nightness),
                        lerp(1.0,0.55,nightness));
    u.uPx.value=(window.innerHeight*renderer.getPixelRatio())/
                (2*Math.tan(T.MathUtils.degToRad(camera.fov/2)))*0.012;
  }
  if(cloudPlane){
    cloudPlane.position.x=camera.position.x; cloudPlane.position.z=camera.position.z;
    const cu=cloudMat.uniforms;
    cu.uTime.value=performance.now()/1000;
    cu.uSunDir.value.copy(SUN);
    cu.uSunCol.value.copy(CHUNK_U.uSunCol.value).lerp(new T.Color(0xffffff),0.4);
    cu.uShade.value.copy(_c1).lerp(new T.Color(0x8ea2c4),0.5);
    cu.uCov.value=lerp(0.40,0.58,daylight)+WEATHER.wet*0.30;
    cu.uOpacity.value=lerp(0.5,0.92,daylight);
    cu.uCam.value.copy(camera.position);
  }
}
/* ======================================================================
   MAIN · 3 — chunk streaming
   A chunk is generated, lit and meshed on a worker and arrives as raw
   buffers. The main thread's only job is to hand them to the GPU, and
   it does that a couple per frame so walking never stutters.
   ====================================================================== */
let VIEW=7;                         // chunks of sight, trimmed if frames run long
// --- game mode + player-adjustable settings (Minecraft-style) ---
let creative=false, flying=false, VIEW_LOCK=false;
let LOOK_SENS=0.0026, INVERT_Y=false, _lastSpace=0, QUALITY=2, LANG='zh';
const CH=new Map();                 // live chunks
const EDITS=new Map();              // every block the player ever changed, forever
const UPLOAD_BUDGET=2;
const COVER_R=4;          // chunks that still grow grass
let pending=0;

function ckey(cx,cz){ return cx+','+cz; }
function editKey(lx,y,lz){ return (y<<8)|(lx<<4)|lz; }

/* ---- workers ------------------------------------------------------- */
const WORKER_SRC=document.getElementById('sharedSrc').textContent+'\n'+
                 document.getElementById('workerSrc').textContent;
let workers=[], widle=[], wReady=0, queue=[], WORKERS_OK=true;
let WORLD_SEED=(Math.random()*0x7fffffff)|0;
// bumped whenever the world is re-seeded, so meshes still in flight from
// the old world are thrown away instead of landing in the new one
let EPOCH=1;
initWorld(WORLD_SEED);              // the page needs the same generator for spawn

function bootWorkers(onReady){
  let n=3;
  try{ n=Math.max(2,Math.min(3,(navigator.hardwareConcurrency||4)-1)); }catch(e){}
  let url=null;
  try{ url=URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'})); }
  catch(e){ WORKERS_OK=false; onReady(); return; }
  let got=0;
  for(let i=0;i<n;i++){
    let w;
    try{ w=new Worker(url); }
    catch(e){ WORKERS_OK=false; onReady(); return; }
    w.onmessage=function(ev){
      const m=ev.data;
      if(m.cmd==='ready'){ wReady++; widle.push(w); if(++got===n) onReady(); pump(); return; }
      if(m.cmd==='mesh'){ widle.push(w); onMesh(m); pump(); }
    };
    w.onerror=function(){ WORKERS_OK=false; };
    w.postMessage({cmd:'init',seed:WORLD_SEED});
    workers.push(w);
  }
}
function pump(){
  if(!WORKERS_OK) return;             // the main thread drains the queue instead
  while(widle.length && queue.length){
    const job=queue.shift();
    const c=CH.get(ckey(job.cx,job.cz));
    if(!c||c.st==='dead') continue;
    const w=widle.pop();
    w.postMessage({cmd:'chunk',cx:job.cx,cz:job.cz,key:job.key,ep:job.ep,
                   cover:job.cover,edits:gatherEdits(job.cx,job.cz)});
  }
}
/* the skirt of a chunk is procedural, so a block the player placed just over
   the border has to be handed in explicitly or the seam re-grows the terrain */
function gatherEdits(cx,cz){
  const out=[];
  for(let dz=-1;dz<=1;dz++) for(let dx=-1;dx<=1;dx++){
    const e=EDITS.get(ckey(cx+dx,cz+dz));
    if(!e) continue;
    const ox=(cx+dx)*SX, oz=(cz+dz)*SZ;
    e.forEach(function(id,k){
      const y=(k>>8)&0xFF, lx=(k>>4)&0xF, lz=k&0xF;
      const px=ox+lx-(cx*SX-PAD), pz=oz+lz-(cz*SZ-PAD);
      if(px<0||pz<0||px>=PX||pz>=PZ||y<0||y>=SY) return;
      out.push(pidx(px,y,pz),id);
    });
  }
  return out.length?new Int32Array(out):null;
}

/* If no worker could be made — a strict policy, an old browser — the page
   meshes chunks itself, one per frame, using exactly the same code. It is
   slower and you can feel it, but the world still appears. */
function pumpLocal(){
  if(WORKERS_OK || !queue.length) return;
  const job=queue.shift();
  const c=CH.get(ckey(job.cx,job.cz));
  if(!c||c.st==='dead'){ pending--; return; }
  const r=makeChunk(job.cx,job.cz,gatherEdits(job.cx,job.cz),job.cover);
  const solid=new Uint8Array(PVOL); solid.set(blocks);
  onMesh({cmd:'mesh',cx:job.cx,cz:job.cz,key:job.key,ep:job.ep,
          o:copyOut(r.o),w:copyOut(r.w),blocks:solid});
}

/* ---- geometry upload ----------------------------------------------- */
const inbox=[];
function onMesh(m){ pending--; if(m.ep===EPOCH) inbox.push(m); }
function buildGeo(s){
  if(!s.i.length) return null;
  const g=new T.BufferGeometry();
  g.setAttribute('position',new T.BufferAttribute(s.p,3));
  g.setAttribute('normal',  new T.BufferAttribute(s.n,3));
  g.setAttribute('color',   new T.BufferAttribute(s.c,3));
  g.setAttribute('aLt',     new T.BufferAttribute(s.l,3));
  g.setAttribute('aFx',     new T.BufferAttribute(s.f,2));
  g.setIndex(new T.BufferAttribute(s.i,1));
  g.computeBoundingSphere();
  return g;
}
function drainInbox(){
  let n=0;
  while(inbox.length && n<UPLOAD_BUDGET){
    const m=inbox.shift(), k=ckey(m.cx,m.cz), c=CH.get(k);
    if(!c||c.st==='dead'){ n++; continue; }
    if(c.key!==m.key){ n++; continue; }        // a newer request has superseded it
    disposeMeshes(c);
    c.blocks=m.blocks;
    const go=buildGeo(m.o), gw=buildGeo(m.w);
    if(go){ c.mesh=new T.Mesh(go,chunkMat); c.mesh.position.set(m.cx*SX,0,m.cz*SZ);
            c.mesh.castShadow=true;      // the light's own frustum culls the rest
            scene.add(c.mesh); }
    if(gw){ c.water=new T.Mesh(gw,waterMat); c.water.position.set(m.cx*SX,0,m.cz*SZ);
            c.water.renderOrder=2; scene.add(c.water); }
    c.st='ready';
    n++;
  }
}
function disposeMeshes(c){
  if(c.mesh){ scene.remove(c.mesh); c.mesh.geometry.dispose(); c.mesh=null; }
  if(c.water){ scene.remove(c.water); c.water.geometry.dispose(); c.water=null; }
}

/* ---- the ring that follows the player ------------------------------ */
let lastCX=1e9, lastCZ=1e9;
function updateChunks(px,pz,force){
  const cx=Math.floor(px/SX), cz=Math.floor(pz/SZ);
  if(!force && cx===lastCX && cz===lastCZ) return;
  lastCX=cx; lastCZ=cz;
  const want=[];
  for(let dz=-VIEW;dz<=VIEW;dz++) for(let dx=-VIEW;dx<=VIEW;dx++){
    const d=dx*dx+dz*dz;
    if(d>VIEW*VIEW) continue;
    want.push({cx:cx+dx,cz:cz+dz,d:d});
  }
  want.sort(function(a,b){return a.d-b.d;});
  const live=new Set();
  for(let i=0;i<want.length;i++){
    const w=want[i], k=ckey(w.cx,w.cz);
    live.add(k);
    if(CH.has(k)) continue;
    const cov=w.d<=COVER_R*COVER_R;
    const c={cx:w.cx,cz:w.cz,st:'pending',mesh:null,water:null,blocks:null,
             key:1,cover:cov};
    CH.set(k,c);
    queue.push({cx:w.cx,cz:w.cz,key:1,ep:EPOCH,cover:cov}); pending++;
  }
  // anything well outside the ring goes; its edits are kept in EDITS
  CH.forEach(function(c,k){
    if(live.has(k)) return;
    const dx=c.cx-cx, dz=c.cz-cz;
    if(dx*dx+dz*dz<(VIEW+2)*(VIEW+2)) return;
    disposeMeshes(c); c.st='dead'; CH.delete(k);
  });
  // chunks that cross the cover line are re-meshed, with a band of slack so
  // walking back and forth over the boundary does not thrash the workers
  CH.forEach(function(c){
    if(c.st==='dead') return;
    const dx=c.cx-cx, dz=c.cz-cz, d2=dx*dx+dz*dz;
    const want=c.cover ? d2<=(COVER_R+2)*(COVER_R+2) : d2<=COVER_R*COVER_R;
    if(want!==c.cover){ c.cover=want; remesh(c.cx,c.cz); }
  });
  queue.sort(function(a,b){
    const da=(a.cx-cx)*(a.cx-cx)+(a.cz-cz)*(a.cz-cz);
    const db=(b.cx-cx)*(b.cx-cx)+(b.cz-cz)*(b.cz-cz);
    return da-db;
  });
  pump();
}
function remesh(cx,cz){
  const c=CH.get(ckey(cx,cz));
  if(!c) return;
  c.key++; c.st='pending';
  queue.unshift({cx:cx,cz:cz,key:c.key,ep:EPOCH,cover:c.cover!==false}); pending++;
  pump();
}

/* Start the world over on a different seed. Everything in flight belongs
   to the old world, so the epoch moves and those results are dropped. */
function reseed(seed){
  WORLD_SEED=seed|0; EPOCH++;
  initWorld(WORLD_SEED);
  for(let i=0;i<workers.length;i++) workers[i].postMessage({cmd:'init',seed:WORLD_SEED});
  CH.forEach(function(c){ disposeMeshes(c); c.st='dead'; });
  CH.clear(); EDITS.clear();
  queue.length=0; inbox.length=0; pending=0;
  lastCX=1e9; lastCZ=1e9;
}

/* ---- reading and writing blocks ------------------------------------ */
function blockAt(x,y,z){
  if(y<0||y>=SY) return 0;
  x=Math.floor(x); y=Math.floor(y); z=Math.floor(z);
  const cx=Math.floor(x/SX), cz=Math.floor(z/SZ);
  const c=CH.get(ckey(cx,cz));
  if(!c||!c.blocks) return -1;                 // not loaded: callers treat as solid
  return c.blocks[pidx(x-cx*SX+PAD,y,z-cz*SZ+PAD)];
}
function solidAt(x,y,z){
  const b=blockAt(x,y,z);
  if(b===-1) return true;
  return b!==0 && BLOCKS[b].solid===1;
}
function setBlock(x,y,z,id){
  x=Math.floor(x); y=Math.floor(y); z=Math.floor(z);
  if(y<1||y>=SY) return false;
  const cx=Math.floor(x/SX), cz=Math.floor(z/SZ), k=ckey(cx,cz);
  const c=CH.get(k);
  if(!c||!c.blocks) return false;
  const lx=x-cx*SX, lz=z-cz*SZ;
  c.blocks[pidx(lx+PAD,y,lz+PAD)]=id;
  let e=EDITS.get(k); if(!e){ e=new Map(); EDITS.set(k,e); }
  e.set(editKey(lx,y,lz),id);
  remesh(cx,cz);
  // a block on the seam changes what the neighbour's skirt looks like
  if(lx===0)    remesh(cx-1,cz);
  if(lx===SX-1) remesh(cx+1,cz);
  if(lz===0)    remesh(cx,cz-1);
  if(lz===SZ-1) remesh(cx,cz+1);
  return true;
}

/* ---- DDA through the grid ------------------------------------------
   Amanatides & Woo: step to whichever axis boundary is nearest, so every
   cell the ray touches is visited once and in order. */
const _hit={x:0,y:0,z:0,nx:0,ny:0,nz:0,id:0};
function rayVoxel(ox,oy,oz,dx,dy,dz,maxD){
  let x=Math.floor(ox), y=Math.floor(oy), z=Math.floor(oz);
  const sx=dx>0?1:-1, sy=dy>0?1:-1, sz=dz>0?1:-1;
  const tdx=Math.abs(1/dx), tdy=Math.abs(1/dy), tdz=Math.abs(1/dz);
  let tmx=(dx>0?(x+1-ox):(ox-x))*tdx;
  let tmy=(dy>0?(y+1-oy):(oy-y))*tdy;
  let tmz=(dz>0?(z+1-oz):(oz-z))*tdz;
  let nx=0,ny=0,nz=0, t=0;
  for(let i=0;i<256;i++){
    const b=blockAt(x,y,z);
    if(b>0 && b!==WATER){
      _hit.x=x;_hit.y=y;_hit.z=z;_hit.nx=nx;_hit.ny=ny;_hit.nz=nz;_hit.id=b;
      return _hit;
    }
    if(tmx<tmy && tmx<tmz){ x+=sx; t=tmx; tmx+=tdx; nx=-sx;ny=0;nz=0; }
    else if(tmy<tmz){       y+=sy; t=tmy; tmy+=tdy; nx=0;ny=-sy;nz=0; }
    else {                  z+=sz; t=tmz; tmz+=tdz; nx=0;ny=0;nz=-sz; }
    if(t>maxD) break;
    if(y<0||y>=SY) break;
  }
  return null;
}
/* where the ground is, used for spawning before any chunk exists */
function surfaceY(x,z){
  return Math.max(topSolidY(Math.floor(x),Math.floor(z)),SEA)+1;
}
/* ======================================================================
   MAIN · 4 — the player: a 泡泡小镇 figure with an AABB around it
   ====================================================================== */
const PW=0.62, PH=1.78, EYE=1.58, STEP=0.56;
const player={
  p:new T.Vector3(), v:new T.Vector3(),
  onGround:false, inWater:false, yaw:0, pitch:0,
  hp:20, maxHp:20, air:10, hurtT:0, dead:false, swing:0, bob:0, walk:0, calm:0
};
let avatar=null, avatarParts=null, charId='twinkle';
let thirdPerson=true, camDist=6.0, camTight=false;
/* The camera stops at anything solid, canopy included — let it through and
   it simply ends up inside the canopy instead, staring at the inside of a
   leaf. When it has to come in this close the body is hidden instead. */
function camBlocked(x,y,z){
  const b=blockAt(x,y,z);
  if(b===-1) return false;
  return b!==0 && BLOCKS[b].solid===1;
}

function spawnAvatar(id){
  if(avatar){ scene.remove(avatar); }
  charId=id;
  const g=buildChar(id);
  const s=1.78/CHAR_H;                   // the figures are authored ~2.75 tall
  g.scale.setScalar(s);
  avatar=new T.Group(); avatar.add(g);
  avatarParts=g.userData.parts||{};
  scene.add(avatar);
}

/* ---- collision ------------------------------------------------------
   Three separate sweeps, one per axis. Doing them together makes a body
   that catches on the seam between two flush blocks; doing them apart
   means the one axis that is blocked is the only one that stops. */
function boxBlocked(x,y,z){
  const x0=Math.floor(x-PW/2), x1=Math.floor(x+PW/2);
  const z0=Math.floor(z-PW/2), z1=Math.floor(z+PW/2);
  const y0=Math.floor(y), y1=Math.floor(y+PH-0.001);
  for(let yy=y0;yy<=y1;yy++)
    for(let zz=z0;zz<=z1;zz++)
      for(let xx=x0;xx<=x1;xx++)
        if(solidAt(xx,yy,zz)) return true;
  return false;
}
function inWaterAt(x,y,z){
  return blockAt(Math.floor(x),Math.floor(y+0.6),Math.floor(z))===WATER;
}
function movePlayer(dt){
  const p=player.p, v=player.v;
  player.inWater=inWaterAt(p.x,p.y,p.z);
  if(flying){
    // creative flight: no gravity — Space rises, Shift descends
    const up=(keys[' ']?1:0)-(sneak?1:0);
    v.y += (up*22 - v.y)*Math.min(1,dt*10);
    if(!up) v.y*=0.80;
  } else {
    const g=player.inWater?-7.0:-26.0;
    v.y+=g*dt;
    if(player.inWater){ v.y=Math.max(v.y,-3.2); v.x*=0.86; v.z*=0.86; }
  }
  let ny;
  // sneaking refuses any step that would leave you standing on nothing,
  // which is the whole reason the key exists
  const edge=sneak&&player.onGround&&!player.inWater;
  function supported(x,z){
    const r=PW/2-0.02;
    return solidAt(x-r,p.y-0.08,z-r)||solidAt(x+r,p.y-0.08,z-r)||
           solidAt(x-r,p.y-0.08,z+r)||solidAt(x+r,p.y-0.08,z+r);
  }
  // X
  let nx=p.x+v.x*dt;
  if(boxBlocked(nx,p.y,p.z)){
    if(player.onGround && !boxBlocked(nx,p.y+STEP,p.z)){ p.y+=STEP; p.x=nx; }
    else v.x=0;
  } else if(edge && !supported(nx,p.z)){ v.x=0; }
  else p.x=nx;
  // Z
  let nz=p.z+v.z*dt;
  if(boxBlocked(p.x,p.y,nz)){
    if(player.onGround && !boxBlocked(p.x,p.y+STEP,nz)){ p.y+=STEP; p.z=nz; }
    else v.z=0;
  } else if(edge && !supported(p.x,nz)){ v.z=0; }
  else p.z=nz;
  // Y
  ny=p.y+v.y*dt;
  player.onGround=false;
  if(boxBlocked(p.x,ny,p.z)){
    if(v.y<0){ p.y=Math.floor(ny)+1; player.onGround=true; }
    else p.y=Math.ceil(ny)-PH-0.001;
    v.y=0;
  } else p.y=ny;
  if(p.y<-8){ hurt(4); respawn(); }
  // lava is not solid, so you fall in; it should cost you for that
  if(blockAt(Math.floor(p.x),Math.floor(p.y+0.3),Math.floor(p.z))===LAVA){
    player.lavaT=(player.lavaT||0)-dt;
    if(player.lavaT<=0){ player.lavaT=0.55; hurt(4); }
    v.y=Math.max(v.y,-1.6); v.x*=0.7; v.z*=0.7;
  }
  // breath
  if(blockAt(Math.floor(p.x),Math.floor(p.y+EYE),Math.floor(p.z))===WATER){
    player.air-=dt;
    if(player.air<0){ player.air=1.2; hurt(2); }
  } else player.air=Math.min(10,player.air+dt*4);
  player.calm+=dt;
  if(player.calm>7 && player.hp<player.maxHp){
    player.calm=0; player.hp=Math.min(player.maxHp,player.hp+1);
  }
}

/* ---- input ----------------------------------------------------------
   Laid out to match what a Minecraft player's hands already know:
   Shift is SNEAK (slow, and it will not let you walk off a ledge), sprint
   is Ctrl or a double tap of W, Q drops one, F5 cycles the view, holding
   the right button keeps placing. The fiddly parts are the ones that bite:
   a held key repeats its keydown forever, so every toggle is guarded; and
   any key still "down" when focus leaves would walk you off a cliff while
   you are reading something else, so focus loss clears everything.
   -------------------------------------------------------------------- */
const keys={};
let mouseDown=0, locked=false, lockTried=false;
let mx0=0, my0=0, mMoved=0, mBtn=0;
let sneak=false, sprint=false, lastW=0, placeHeldT=0;
let camMode=1;                       // 0 first, 1 third behind, 2 third front
function wantLock(){
  // Try every time. Some hosts DO allow a framed page to lock, and the ones
  // that do not simply reject the promise, which costs nothing.
  if(!canvas.requestPointerLock) return;
  lockTried=true;
  try{ const r=canvas.requestPointerLock(); if(r&&r.catch) r.catch(function(){}); }
  catch(e){}
}
function clearInput(){
  for(const k in keys) keys[k]=false;
  mouseDown=0; mBtn=0; sneak=false; sprint=false;
  mineT=0; mineKey='';
}
function normKey(e){ return e.key.length===1?e.key.toLowerCase():e.key; }

addEventListener('keydown',function(e){
  const k=normKey(e);
  if(k==='Escape'){
    if(craftOpen) toggleCraft();
    clearInput();
    return;
  }
  if(state!=='play') return;
  if(k===' '||k.indexOf('Arrow')===0||k==='Tab') e.preventDefault();
  if(k===' ' && !e.repeat && creative){
    const now=performance.now();
    if(now-_lastSpace<300){ flying=!flying; player.v.y=0; }   // double-tap space to fly
    _lastSpace=now;
  }
  if((k==='o'||k==='O') && !e.repeat){ toggleSettings(); return; }
  // E has to be reachable WITH the panel open, or it can open it and never
  // close it again — the bag key must work both ways
  if(k==='e'){ if(!e.repeat) toggleCraft(); return; }
  if(craftOpen){ keys[k]=false; return; }   // the panel owns the rest
  keys[k]=true;
  if(k==='Shift') sneak=true;
  if(k==='Control') sprint=true;
  if(e.repeat) return;                       // everything below is a one-shot
  if(k>='1'&&k<='9'){ hotbarSel=Math.min(8,+k-1); refreshHotbar(); }
  if(k==='w'){
    const now=performance.now();
    if(now-lastW<280) sprint=true;           // double tap to run, as it should
    lastW=now;
  }
  if(k==='v'||k==='F5'){ camMode=(camMode+1)%3; thirdPerson=(camMode!==0); }
  if(k==='q') dropHeld(e.ctrlKey||e.metaKey);
  if(k==='r') tryPlace();
});
addEventListener('keyup',function(e){
  const k=normKey(e);
  keys[k]=false;
  if(k==='Shift') sneak=false;
  if(k==='Control') sprint=false;
  if(k==='w') sprint=false;                  // let go of forward, stop running
});
/* Focus loss must drop the KEYS (or you keep walking while reading something
   else) but it must NOT drop the mouse. An artifact runs inside an iframe,
   and that inner window is blurred constantly — clearing the mouse here is
   what killed dragging and clicking outright. */
function clearKeys(){ for(const k in keys) keys[k]=false; sneak=false; sprint=false; }
addEventListener('blur',clearKeys);
document.addEventListener('visibilitychange',function(){ if(document.hidden) clearInput(); });

/* ---- mouse ----------------------------------------------------------
   Two modes, because the page cannot count on pointer lock:

   LOCKED (the real thing): exactly Minecraft. Move to look, hold left to
   mine, hold right to place, no dragging anywhere.

   UNLOCKED (an iframe, which is where this normally lives): the same two
   buttons do double duty. Move with a button down and you look; press and
   release without moving and you act. Holding still with the left button
   down keeps mining, so you can chew through a block exactly as you would.
   -------------------------------------------------------------------- */
const DRAG_SLOP=6;                  // px before a press counts as a look
function lookBy(dx,dy,k){
  player.yaw-=dx*k;
  const dp=(INVERT_Y?-dy:dy)*k;
  player.pitch=clamp(player.pitch-dp,-1.55,1.55);
}
canvas.addEventListener('mousedown',function(e){
  if(state!=='play'||craftOpen) return;
  e.preventDefault();
  if(!locked) wantLock();            // keep asking; some hosts do allow it
  mBtn|=(1<<e.button);
  mx0=e.clientX; my0=e.clientY; mMoved=0;
  if(e.button===0){
    if(!playerAttack()) mouseDown|=1;   // start digging right away
  } else if(e.button===2){
    mouseDown|=2; placeHeldT=0.0;
  }
});
addEventListener('mousemove',function(e){
  if(state!=='play'||craftOpen) return;
  if(locked){
    lookBy(e.movementX||0,e.movementY||0,LOOK_SENS);
    return;
  }
  if(!mBtn) return;                  // unlocked: only a held button looks
  const dx=e.clientX-mx0, dy=e.clientY-my0;
  mx0=e.clientX; my0=e.clientY;
  mMoved+=Math.abs(dx)+Math.abs(dy);
  lookBy(dx,dy,0.0042);
  if(mMoved>DRAG_SLOP && (mouseDown&1)){
    mouseDown&=~1; mineT=0; mineKey='';   // that was a look, not a dig
  }
});
function endButton(btn){
  mBtn&=~(1<<btn);
  if(btn===0){ mouseDown&=~1; mineT=0; mineKey=''; }
  if(btn===2){
    if(mMoved<=DRAG_SLOP) tryPlace();    // a right CLICK still places
    mouseDown&=~2; placeHeldT=0;
  }
  if(!mBtn) mMoved=0;
}
addEventListener('mouseup',function(e){
  if(state!=='play') { mBtn=0; mouseDown=0; return; }
  endButton(e.button);
});
addEventListener('contextmenu',function(e){ e.preventDefault(); });
addEventListener('mouseleave',function(){ mBtn=0; mouseDown=0; mineT=0; mineKey=''; });
document.addEventListener('pointerlockchange',function(){
  const was=locked;
  locked=(document.pointerLockElement===canvas);
  document.body.classList.toggle('locked',locked);
  if(was&&!locked){ mBtn=0; mouseDown=0; mineT=0; mineKey=''; }
  const h=$('#lockHint'); if(h) h.style.display=locked?'none':'';
});
addEventListener('wheel',function(e){
  if(state!=='play'||craftOpen) return;
  hotbarSel=(hotbarSel+(e.deltaY>0?1:8))%9; refreshHotbar();
},{passive:true});

/* holding the right button keeps placing, at a rate you can control */
function updateHeldActions(dt){
  if(craftOpen||state!=='play'){ placeHeldT=0; return; }
  if((mouseDown&2) && mMoved<=DRAG_SLOP){
    placeHeldT-=dt;
    if(placeHeldT<=0){ placeHeldT=0.26; tryPlace(); }
  } else placeHeldT=0;
}

/* ---- dropping ------------------------------------------------------- */
function dropHeld(wholeStack){
  const s=inv[hotbarSel];
  if(!s) return;
  const n=wholeStack?s.n:1;
  const id=s.id;
  s.n-=n; if(s.n<=0) inv[hotbarSel]=null;
  refreshHotbar(); refreshBag();
  spawnDrop(id,n,player.p.x,player.p.y+1.1,player.p.z,
    -Math.sin(player.yaw)*4.2,2.6,-Math.cos(player.yaw)*4.2);
  sfxPlace();
}

/* ---- touch ----------------------------------------------------------
   A phone has no pointer lock and no keyboard, so the same game needs a
   second set of hands: a stick that appears wherever the left thumb lands,
   a drag anywhere on the right to look, and four buttons. Every handler
   calls preventDefault, or the browser scrolls the page instead. */
const TOUCH=(function(){
  try{ return (navigator.maxTouchPoints||0)>0 || ('ontouchstart' in window); }
  catch(e){ return false; }
})();
let tMove={x:0,z:0}, tStickId=null, tStickX=0, tStickY=0,
    tLookId=null, tLookX=0, tLookY=0, tJump=false;
function setupTouch(){
  if(!TOUCH) return;
  document.body.classList.add('touch');
  $('#touch').style.display='block';
  const stick=$('#stick'), knob=$('#knob');
  function place(t){
    stick.style.left=(t.clientX-66)+'px';
    stick.style.top =(t.clientY-66)+'px';
    stick.style.opacity=1;
  }
  function onStart(e){
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.clientX<window.innerWidth*0.46 && tStickId===null){
        tStickId=t.identifier; tStickX=t.clientX; tStickY=t.clientY; place(t);
      } else if(tLookId===null){
        tLookId=t.identifier; tLookX=t.clientX; tLookY=t.clientY;
      }
    }
    e.preventDefault();
  }
  function onMove(e){
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.identifier===tStickId){
        let dx=t.clientX-tStickX, dy=t.clientY-tStickY;
        const len=Math.hypot(dx,dy), max=52;
        if(len>max){ dx*=max/len; dy*=max/len; }
        knob.style.left=(41+dx)+'px'; knob.style.top=(41+dy)+'px';
        tMove.x=dx/max; tMove.z=-dy/max;
      } else if(t.identifier===tLookId){
        player.yaw-=(t.clientX-tLookX)*0.0062;
        player.pitch=clamp(player.pitch-(t.clientY-tLookY)*0.0062,-1.45,1.45);
        tLookX=t.clientX; tLookY=t.clientY;
      }
    }
    e.preventDefault();
  }
  function onEnd(e){
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.identifier===tStickId){
        tStickId=null; tMove.x=0; tMove.z=0;
        knob.style.left='41px'; knob.style.top='41px'; stick.style.opacity=0;
      } else if(t.identifier===tLookId) tLookId=null;
    }
    e.preventDefault();
  }
  const app=$('#app');
  app.addEventListener('touchstart',onStart,{passive:false});
  app.addEventListener('touchmove',onMove,{passive:false});
  app.addEventListener('touchend',onEnd,{passive:false});
  app.addEventListener('touchcancel',onEnd,{passive:false});

  function hold(id,down,up){
    const el=$(id);
    el.addEventListener('touchstart',function(e){
      e.preventDefault(); e.stopPropagation(); el.classList.add('on'); down();
    },{passive:false});
    const off=function(e){
      e.preventDefault(); e.stopPropagation(); el.classList.remove('on'); if(up) up();
    };
    el.addEventListener('touchend',off,{passive:false});
    el.addEventListener('touchcancel',off,{passive:false});
  }
  hold('#tMine', function(){ if(!playerAttack()) mouseDown|=1; },
                 function(){ mouseDown&=~1; mineT=0; mineKey=''; });
  hold('#tPlace',function(){ tryPlace(); });
  hold('#tJump', function(){ tJump=true; }, function(){ tJump=false; });
  hold('#tBag',  function(){ toggleCraft(); });
}

const _fwd=new T.Vector3(), _rgt=new T.Vector3();
function playerInput(dt){
  if(player.dead) return;
  _fwd.set(-Math.sin(player.yaw),0,-Math.cos(player.yaw));
  _rgt.set(Math.cos(player.yaw),0,-Math.sin(player.yaw));
  let mx=0,mz=0;
  if(keys['w']) mz+=1;
  if(keys['s']) mz-=1;
  if(keys['a']) mx-=1;
  if(keys['d']) mx+=1;
  if(TOUCH){ mx+=tMove.x; mz+=tMove.z; }
  if(keys['ArrowLeft'])  player.yaw+=dt*3.0;
  if(keys['ArrowRight']) player.yaw-=dt*3.0;
  if(keys['ArrowUp'])    player.pitch=clamp(player.pitch+dt*1.7,-1.45,1.45);
  if(keys['ArrowDown'])  player.pitch=clamp(player.pitch-dt*1.7,-1.45,1.45);
  // sneak beats sprint, the way it does everywhere else
  // Minecraft-style gait ratios (sneak ~0.3×, sprint ~1.3×) on a brisk base.
  const gait=sneak?0.30:(sprint?1.33:1.0);
  const sp=(player.inWater?3.6:(player.onGround?6.0:5.4))*gait;   // brisker walk
  const len=Math.hypot(mx,mz)||1;
  const tx=(_fwd.x*mz+_rgt.x*mx)/len*sp, tz=(_fwd.z*mz+_rgt.z*mx)/len*sp;
  const acc=player.onGround?42:9;   // near-instant ground accel, Minecraft-snappy
  if(mx||mz){
    player.v.x+=(tx-player.v.x)*Math.min(1,acc*dt);
    player.v.z+=(tz-player.v.z)*Math.min(1,acc*dt);
    player.walk=Math.min(1,player.walk+dt*5);
  } else {
    const fr=player.onGround?12:1.6;
    player.v.x-=player.v.x*Math.min(1,fr*dt);
    player.v.z-=player.v.z*Math.min(1,fr*dt);
    player.walk=Math.max(0,player.walk-dt*6);
  }
  if(keys[' ']||tJump){
    if(player.inWater) player.v.y=3.4;
    else if(player.onGround){ player.v.y=8.4; player.onGround=false; sfxJump(); }
  }
}

/* ---- camera --------------------------------------------------------- */
const _cd=new T.Vector3(), _ce=new T.Vector3();
let eyeDrop=0, fovBase=0;
function updateCamera(dt){
  eyeDrop+=((sneak&&player.onGround?0.22:0)-eyeDrop)*Math.min(1,(dt||0.016)*10);
  if(!fovBase) fovBase=camera.fov;
  const sp=Math.hypot(player.v.x,player.v.z);
  const want=fovBase+(sprint&&sp>2.5?6:0)+(player.inWater?-4:0);
  if(Math.abs(camera.fov-want)>0.05){
    camera.fov+=(want-camera.fov)*Math.min(1,(dt||0.016)*5);
    camera.updateProjectionMatrix();
  }
  const ex=player.p.x, ey=player.p.y+EYE-eyeDrop, ez=player.p.z;
  _cd.set(
    -Math.sin(player.yaw)*Math.cos(player.pitch),
     Math.sin(player.pitch),
    -Math.cos(player.yaw)*Math.cos(player.pitch));
  const back=(camMode===2)?-1:1;
  if(thirdPerson){
    _cd.multiplyScalar(back);
    // Pull the camera in until nothing is in the way. The lift has to shrink
    // with the distance: held constant, a camera that collapses onto the
    // player ends up hanging above their head looking at the ground.
    let d=camDist;
    for(let s=0.3;s<=camDist;s+=0.3){
      if(camBlocked(ex-_cd.x*s,ey-_cd.y*s+0.2,ez-_cd.z*s)){ d=Math.max(0.6,s-0.45); break; }
    }
    let k=d/camDist, qx=ex-_cd.x*d, qy=ey-_cd.y*d+0.55*k, qz=ez-_cd.z*d;
    while(d>0.25 && camBlocked(qx,qy,qz)){
      d-=0.25; k=d/camDist;
      qx=ex-_cd.x*d; qy=ey-_cd.y*d+0.55*k; qz=ez-_cd.z*d;
    }
    camera.position.set(qx,qy,qz);
    camTight=(d<1.5);          // too close to see yourself; drop the body
  } else {
    camera.position.set(ex,ey,ez);
    camTight=true;
  }
  _cd.multiplyScalar(back);                  // back to the true facing
  _ce.set(ex+_cd.x,ey+_cd.y,ez+_cd.z);
  camera.lookAt(_ce);
  if(avatar){
    avatar.position.set(player.p.x,player.p.y,player.p.z);
    // A generated figure turns to face the way it is actually walking, so
    // strafing (A/D) and backing up (S) visibly rotate it and the face points
    // the way it moves. Procedural residents keep facing the view as before.
    if(avatarParts&&avatarParts.glb){
      const sp=Math.hypot(player.v.x,player.v.z);
      if(player._face===undefined) player._face=player.yaw;
      const target=sp>0.4?Math.atan2(player.v.x,player.v.z):player._face;
      let d=target-player._face; while(d>Math.PI)d-=2*Math.PI; while(d<-Math.PI)d+=2*Math.PI;
      player._face+=d*Math.min(1,(dt||0.016)*9);
      avatar.rotation.y=player._face;
    } else {
      avatar.rotation.y=player.yaw;
    }
    avatar.visible=thirdPerson && !camTight;
  }
}
function animateAvatar(dt,t){
  if(!avatar||!avatarParts) return;
  const sp=Math.hypot(player.v.x,player.v.z);
  player.bob+=dt*sp*2.1;
  const sw=Math.sin(player.bob)*Math.min(0.85,sp*0.17);
  const A=avatarParts.arms, L=avatarParts.legs;
  if(L&&L[0]){ L[0].rotation.x=sw; L[1].rotation.x=-sw; }
  if(A&&A[0]){
    const sg=player.swing>0?(1-player.swing)*2.6:0;
    A[0].rotation.x=-sw*0.8-sg; A[1].rotation.x=sw*0.8;
  }
  if(avatarParts.head) avatarParts.head.rotation.x=clamp(-player.pitch*0.35,-0.4,0.4);
  // 星星人 was lit for a night game: in daylight its halo is a white blob
  // sitting over its own face
  if(avatarParts.halo){
    // it was drawn for a night game; in daylight the bloom turns it into a
    // white blob sitting on top of the face it is meant to light
    avatarParts.halo.visible=nightness>0.22;
    avatarParts.halo.material.opacity=0.30*nightness;
    const k=2.0+nightness*1.4; avatarParts.halo.scale.set(k,k,1);
  }
  // A generated (GLB) figure has no separate limbs — the arm/leg holders are
  // empty — so drive the whole body: a springy hop, side rock, waddle, forward
  // lean and squash-stretch while walking, and an always-on breathing bob +
  // slow sway + look-around while idle, so it is never frozen in place.
  const body=avatar.children[0];
  if(avatarParts.glb){
    const tt=t||performance.now()*0.001;
    const moving=Math.min(1,sp*0.55), idle=1-moving;
    const ph=player.bob;
    const hop    = Math.abs(Math.sin(ph))*0.22*moving;
    const breath = (Math.sin(tt*1.8)*0.5+0.5)*0.07*idle;
    body.position.y = hop + breath;
    body.rotation.z = Math.sin(ph)*0.16*moving + Math.sin(tt*0.9)*0.06*idle;
    body.rotation.y = Math.sin(ph)*0.13*moving + Math.sin(tt*0.6)*0.08*idle;
    const sg = player.swing>0?(1-player.swing)*0.6:0;
    body.rotation.x = clamp(sp*0.5,0,0.30)+sg + Math.sin(tt*1.8)*0.03*idle;
    const f=player._face===undefined?player.yaw:player._face;
    let dyaw=f-(player._pface===undefined?f:player._pface);
    player._pface=f;
    while(dyaw>Math.PI)dyaw-=2*Math.PI; while(dyaw<-Math.PI)dyaw+=2*Math.PI;
    body.rotation.z += clamp(-dyaw*1.7,-0.24,0.24);
    const sq = Math.sin(ph*2)*0.08*moving + Math.sin(tt*1.8)*0.035*idle;
    const s0 = avatarParts.glb.userData.s0;
    avatarParts.glb.scale.set(s0*(1-sq*0.6),s0*(1+sq),s0*(1-sq*0.6));
  } else {
    body.position.y=Math.sin(player.bob*2)*0.03*Math.min(1,sp*0.3);
  }
  if(player.swing>0) player.swing=Math.max(0,player.swing-dt*3.4);
}
function hurt(n){
  if(creative) return;                 // invincible in creative mode
  if(player.dead||player.hurtT>0) return;
  player.hp-=n; player.hurtT=0.85; player.calm=0;
  flash('#d04d4d',0.35); sfxHurt();
  if(player.hp<=0){ player.hp=0; player.dead=true; showDeath(); }
}
function respawn(){
  const y=surfaceY(player.p.x,player.p.z);
  player.p.set(Math.floor(player.p.x)+0.5,y+1,Math.floor(player.p.z)+0.5);
  player.v.set(0,0,0); player.hp=player.maxHp; player.dead=false; player.air=10;
  hideDeath();
}

function setMode(cr){
  creative=!!cr;
  if(!creative) flying=false;
  if(creative){
    // a creative palette: every placeable block, effectively unlimited
    for(let i=0;i<INV_N;i++) inv[i]=null;
    let slot=0;
    for(let id=1; id<100 && slot<INV_N; id++){
      if(BLOCKS[id] && isPlaceable(id)) inv[slot++]={id:id,n:99};
    }
    player.hp=player.maxHp; player.dead=false; player.air=10;
    if(typeof hideDeath==='function') hideDeath();
  }
  if(typeof refreshHotbar==='function') refreshHotbar();
  if(typeof refreshBag==='function') refreshBag();
  document.body.classList.toggle('creative',creative);
}
function setQuality(q){
  QUALITY=q;
  const dpr=window.devicePixelRatio||1;
  const cap = q<=1?0.7 : (q===2?1.0 : Math.min(dpr,1.5));
  pixelBudget=cap; renderer.setPixelRatio(cap);
  VIEW = q<=1?4 : (q===2?6 : 8);
  FX_RAYS = q>=2; FX_SSAO = q>=2; FX_WIDE = q>=3;
  try{
    matComp.uniforms.uRays.value = FX_RAYS ? (q>=3?1.5:1.0) : 0.0;
    matComp.uniforms.uAO.value   = FX_SSAO ? (q>=3?0.92:0.80) : 0.0;
  }catch(e){}
  if(typeof resize==='function') resize();
  if(typeof updateChunks==='function') updateChunks(player.p.x,player.p.z,true);
}

         id===DIORITE||id===ANDESITE||id===TUFF||id===BRICK||id===OBSID||

const INV_N=36;
const inv=new Array(INV_N);
for(let i=0;i<INV_N;i++) inv[i]=null;          // {id,n}
let hotbarSel=0;

function invAdd(id,n){
  if(!id) return true;
  n=n||1;
  for(let i=0;i<INV_N && n>0;i++){
    if(inv[i]&&inv[i].id===id&&inv[i].n<99){
      const k=Math.min(99-inv[i].n,n); inv[i].n+=k; n-=k;
    }
  }
  for(let i=0;i<INV_N && n>0;i++){
    if(!inv[i]){ const k=Math.min(99,n); inv[i]={id:id,n:k}; n-=k; }
  }
  refreshHotbar(); refreshBag();
  return n===0;
}
function invCount(id){
  let n=0;
  for(let i=0;i<INV_N;i++) if(inv[i]&&inv[i].id===id) n+=inv[i].n;
  return n;
}
function invTake(id,n){
  for(let i=0;i<INV_N && n>0;i++){
    if(inv[i]&&inv[i].id===id){
      const k=Math.min(inv[i].n,n); inv[i].n-=k; n-=k;
      if(inv[i].n<=0) inv[i]=null;
    }
  }
  refreshHotbar(); refreshBag();
}
function bestTool(){
  let best=1;
  for(let i=0;i<INV_N;i++){
    const s=inv[i];
    if(s&&s.id>=100&&ITEM[s.id].tool) best=Math.max(best,ITEM[s.id].tool);
  }
  return best;
}

const hiBox=new T.LineSegments(

hiBox.visible=false; scene.add(hiBox);
const crackMat=new T.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.22,
  blending:T.AdditiveBlending,depthWrite:false});

function updateTarget(){
  const ox=camera.position.x, oy=camera.position.y, oz=camera.position.z;
  const d=new T.Vector3(); camera.getWorldDirection(d);
  target=rayVoxel(ox,oy,oz,d.x,d.y,d.z,thirdPerson?10:7);
  if(target){
    hiBox.visible=true;
    hiBox.position.set(target.x+0.5,target.y+0.5,target.z+0.5);
  } else { hiBox.visible=false; crackBox.visible=false; mineT=0; mineKey=''; }
}
function updateMining(dt){
  if(player.dead||craftOpen){ mineT=0; crackBox.visible=false; return; }
  if(!(mouseDown&1)||!target){ crackBox.visible=false; mineT=0; mineKey=''; return; }
  const k=target.x+','+target.y+','+target.z;
  if(k!==mineKey){ mineKey=k; mineT=0;
    const B=BLOCKS[target.id];
    const sp=hardKind(target.id)?bestTool():1;
    mineNeed=creative?0.001:Math.max(0.12,B.hard/sp);   // instant break in creative
  }
  mineT+=dt;
  player.swing=1;
  if(Math.random()<dt*22) blockBits(target.x+0.5,target.y+0.5,target.z+0.5,target.id,1);
  const f=mineT/mineNeed;
  crackBox.visible=true;
  crackBox.position.set(target.x+0.5,target.y+0.5,target.z+0.5);
  const s=1.006+f*0.05;
  crackBox.scale.set(s,s,s);
  crackMat.opacity=0.10+f*0.42;
  if(mineT>=mineNeed){
    const id=target.id;
    if(id===OBSID){ mineT=0; return; }          // the floor of the world stays
    setBlock(target.x,target.y,target.z,0);
    blockBits(target.x+0.5,target.y+0.5,target.z+0.5,id,14);
    const dr=dropOf(id);
    if(!creative && dr) spawnDrop(dr,1,target.x+0.5,target.y+0.5,target.z+0.5,
      (Math.random()-0.5)*1.2,2.0,(Math.random()-0.5)*1.2);
    sfxBreak(id);
    mineT=0; mineKey=''; crackBox.visible=false;
  }
}
function tryPlace(){
  if(player.dead||craftOpen||!target) return;
  const s=inv[hotbarSel];
  if(!s||!isPlaceable(s.id)) return;
  const x=target.x+target.nx, y=target.y+target.ny, z=target.z+target.nz;
  if(blockAt(x,y,z)>0 && blockAt(x,y,z)!==WATER) return;
  // never brick yourself in
  const px=player.p.x, py=player.p.y, pz=player.p.z;
  if(x+1>px-PW/2 && x<px+PW/2 && z+1>pz-PW/2 && z<pz+PW/2 && y+1>py && y<py+PH) return;
  if(setBlock(x,y,z,s.id)){
    if(!creative){ s.n--; if(s.n<=0) inv[hotbarSel]=null; }   // infinite blocks in creative
    refreshHotbar(); refreshBag(); player.swing=1; sfxPlace();
  }
}

/* ---- dropped items --------------------------------------------------
   One instanced cube pool. A drop waits a moment before it can be picked
   up again, or throwing something away would hand it straight back. */
const DROP_N=48;
let drops=null; const dropState=[];
(function(){
  const g=new T.BoxGeometry(0.28,0.28,0.28);
  drops=new T.InstancedMesh(g,new T.MeshToonMaterial({gradientMap:toonRamp()}),DROP_N);
  drops.instanceColor=new T.InstancedBufferAttribute(new Float32Array(DROP_N*3),3);
  drops.frustumCulled=false; drops.castShadow=true; scene.add(drops);
  for(let i=0;i<DROP_N;i++)
    dropState.push({live:false,id:0,n:0,t:0,cool:0,
      p:new T.Vector3(),v:new T.Vector3(),spin:0});
})();
function spawnDrop(id,n,x,y,z,vx,vy,vz){
  for(let i=0;i<DROP_N;i++){
    const d=dropState[i];
    if(d.live) continue;
    d.live=true; d.id=id; d.n=n; d.t=240; d.cool=0.7; d.spin=Math.random()*6.28;
    d.p.set(x,y,z); d.v.set(vx||0,vy||0,vz||0);
    const c=new T.Color(itemColor(id));
    drops.instanceColor.setXYZ(i,c.r,c.g,c.b);
    drops.instanceColor.needsUpdate=true;
    return;
  }
}
const _dm=new T.Matrix4(), _dq=new T.Quaternion(), _ds=new T.Vector3(1,1,1),
      _dz=new T.Vector3(0,0,0), _dup=new T.Vector3(0,1,0);
function updateDrops(dt,t){
  if(!drops) return;
  for(let i=0;i<DROP_N;i++){
    const d=dropState[i];
    if(!d.live){ _dm.compose(_dz,_dq,_dz); drops.setMatrixAt(i,_dm); continue; }
    d.t-=dt; if(d.cool>0) d.cool-=dt;
    d.v.y-=24*dt;
    const nx=d.p.x+d.v.x*dt, nz=d.p.z+d.v.z*dt, ny=d.p.y+d.v.y*dt;
    if(!solidAt(nx,d.p.y,d.p.z)) d.p.x=nx; else d.v.x*=-0.3;
    if(!solidAt(d.p.x,d.p.y,nz)) d.p.z=nz; else d.v.z*=-0.3;
    if(!solidAt(d.p.x,ny,d.p.z)) d.p.y=ny;
    else { d.p.y=Math.floor(ny)+1.0; d.v.set(d.v.x*0.6,0,d.v.z*0.6); }
    if(d.cool<=0 && d.p.distanceTo(player.p)<1.5){
      if(invAdd(d.id,d.n)){ d.live=false; sfxPick(); continue; }
    }
    if(d.t<=0||d.p.y<-6){ d.live=false; continue; }
    d.spin+=dt*1.9;
    _dq.setFromAxisAngle(_dup,d.spin);
    _ds.setScalar(1);
    _dm.compose(_dz.set(d.p.x,d.p.y+0.22+Math.sin(t*2.2+d.spin)*0.06,d.p.z),_dq,_ds);
    drops.setMatrixAt(i,_dm);
    _dz.set(0,0,0);
  }
  drops.instanceMatrix.needsUpdate=true;
}

const BITS_N=220;
let bits=null, bitState=[];
(function(){
  const g=new T.BoxGeometry(0.13,0.13,0.13);
  const m=new T.MeshBasicMaterial({vertexColors:false,color:0xffffff});
  bits=new T.InstancedMesh(g,m,BITS_N);
  bits.instanceColor=new T.InstancedBufferAttribute(new Float32Array(BITS_N*3),3);
  bits.frustumCulled=false; bits.count=BITS_N; scene.add(bits);
  for(let i=0;i<BITS_N;i++) bitState.push({t:0,p:new T.Vector3(),v:new T.Vector3()});
})();
let bitCur=0;
const _bm=new T.Matrix4(), _bq=new T.Quaternion(), _bs=new T.Vector3(1,1,1),
      _bz=new T.Vector3(0,0,0);
function blockBits(x,y,z,id,n){
  const hex=BLOCKS[id]?BLOCKS[id].t:0xffffff;
  const r=((hex>>16)&255)/255, g=((hex>>8)&255)/255, b=(hex&255)/255;
  for(let i=0;i<n;i++){
    const s=bitState[bitCur];
    s.t=0.75+Math.random()*0.4;
    s.p.set(x+(Math.random()-0.5)*0.7,y+(Math.random()-0.5)*0.7,z+(Math.random()-0.5)*0.7);
    s.v.set((Math.random()-0.5)*3.2,Math.random()*3.4+0.6,(Math.random()-0.5)*3.2);
    bits.instanceColor.setXYZ(bitCur,r,g,b);
    bitCur=(bitCur+1)%BITS_N;
  }
  bits.instanceColor.needsUpdate=true;
}
function updateBits(dt){
  for(let i=0;i<BITS_N;i++){
    const s=bitState[i];
    if(s.t<=0){ _bm.compose(_bz,_bq,_bz); bits.setMatrixAt(i,_bm); continue; }
    s.t-=dt;
    s.v.y-=22*dt;
    s.p.addScaledVector(s.v,dt);
    if(solidAt(s.p.x,s.p.y,s.p.z)){ s.p.y+=0.02; s.v.set(s.v.x*0.3,Math.abs(s.v.y)*0.22,s.v.z*0.3); }
    const k=Math.min(1,s.t*2.4);
    _bs.set(k,k,k);
    _bm.compose(s.p,_bq,_bs);
    bits.setMatrixAt(i,_bm);
  }
  bits.instanceMatrix.needsUpdate=true;
}
