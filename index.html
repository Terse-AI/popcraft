<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>StarVale · 星星人露谷</title>
<style>
  :root{
    --neon:#e8a34a; --gold:#f4c95d; --leaf:#b9c46a; --ink:#2a1a12; --panel:rgba(48,32,24,.9); --cream:#f1e4c8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#231610;font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC",system-ui,sans-serif;color:var(--cream);-webkit-user-select:none;user-select:none;touch-action:none}
  canvas{display:block}
  #c{position:fixed;inset:0}
  .hidden{display:none!important}

  /* ---- loading ---- */
  #load{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    background:radial-gradient(130% 100% at 50% 0%,#5a3424 0%,#2e1c14 55%,#1a100c 100%)}
  #load h1{margin:0;font-size:34px;letter-spacing:.5px;font-weight:800;background:linear-gradient(90deg,#f6d9a0,#f2a95c 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
  #load .sub{color:#d8c4a0;font-size:13px}
  #bar{width:min(320px,70vw);height:6px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  #bar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#e8a34a,#f4c95d);transition:width .3s}

  /* ---- HUD ---- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:50}
  .card{background:var(--panel);border:2px solid #7a5a3c;border-radius:12px;box-shadow:inset 0 0 0 1px rgba(255,226,170,.12),0 6px 18px rgba(20,10,4,.4)}
  #status{position:absolute;top:12px;left:12px;padding:10px 14px;display:flex;gap:16px;align-items:center;font-size:13px}
  #status .ic{font-size:17px;margin-right:5px}
  #status b{font-weight:700}
  #clock b{font-variant-numeric:tabular-nums}
  #goldv{color:var(--gold)}
  #energy{position:absolute;bottom:92px;left:12px;width:180px;padding:8px 10px}
  #energy .lab{font-size:11px;color:#e6d6b4;display:flex;justify-content:space-between;margin-bottom:5px}
  #ebar{height:9px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
  #ebar>i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#b9c46a,#8ea04a);transition:width .25s}

  /* minimap */
  #mini{position:absolute;top:12px;right:12px;width:168px;height:168px;padding:7px}
  #mini .t{font-size:10px;color:#e6d6b4;letter-spacing:1px;text-transform:uppercase;margin:0 0 5px 3px}
  #mmc{width:154px;height:132px;border-radius:7px;display:block;background:#d6c59c;border:1px solid #5c4028}

  /* hotbar */
  #hot{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px}
  .slot{width:52px;height:52px;border-radius:9px;background:rgba(241,228,200,.1);border:1px solid rgba(241,228,200,.2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:.12s}
  .slot .em{font-size:23px;line-height:1}
  .slot .nm{font-size:8.5px;color:#e6d6b4;margin-top:2px;white-space:nowrap}
  .slot .cnt{position:absolute;right:4px;bottom:2px;font-size:10px;font-weight:700;color:var(--gold)}
  .slot .key{position:absolute;left:4px;top:2px;font-size:9px;color:#6d8598}
  .slot.on{background:rgba(232,163,74,.22);border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 6px 14px rgba(232,163,74,.25);transform:translateY(-3px)}

  /* crosshair */
  #cross{position:absolute;top:50%;left:50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 0 2px rgba(0,0,0,.25);pointer-events:none}

  /* toasts */
  #toasts{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center}
  .toast{padding:7px 14px;border-radius:99px;font-size:13px;animation:tp 2.6s forwards}
  @keyframes tp{0%{opacity:0;transform:translateY(8px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

  /* panels (shop / inventory / menu) */
  .panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(440px,90vw);max-height:80vh;overflow:auto;padding:20px;z-index:60;pointer-events:auto}
  .panel h2{margin:0 0 4px;font-size:20px}
  .panel .hint{color:#d8c4a0;font-size:12px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
  .buy{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:11px;padding:10px;cursor:pointer;transition:.12s;text-align:center}
  .buy:hover{border-color:var(--neon);background:rgba(232,163,74,.14)}
  .buy .em{font-size:26px}
  .buy .nm{font-size:12px;font-weight:600;margin-top:4px}
  .buy .pr{font-size:11px;color:var(--gold);margin-top:2px}
  .buy.dim{opacity:.4;pointer-events:none}
  .xbtn{position:absolute;top:12px;right:14px;cursor:pointer;color:#d8c4a0;font-size:20px;pointer-events:auto}

  /* top controls */
  #top{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:8px;pointer-events:auto}
  .pill{font:600 12px/1 system-ui;color:#f1e4c8;background:var(--panel);border:1px solid #7a5a3c;padding:8px 13px;border-radius:999px;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .pill:hover{border-color:var(--neon)}

  /* help */
  #help{position:absolute;bottom:14px;right:12px;max-width:230px;padding:11px 13px;font-size:11.5px;line-height:1.55;color:#e6d6b4}
  #help b{color:#f1e4c8}
  kbd{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:1px 5px;font:600 10px/1 ui-monospace,monospace;color:#f1e4c8}

  /* day transition */
  #fade{position:fixed;inset:0;z-index:150;background:#1a100c;opacity:0;pointer-events:none;transition:opacity .6s;display:flex;align-items:center;justify-content:center}
  #fade.on{opacity:1}
  #fade .ft{font-size:22px;font-weight:700;color:#f1e4c8}

  @media (max-width:560px){
    #mini{width:120px;height:122px} #mmc{width:106px;height:88px}
    #status{gap:9px;font-size:11px;padding:8px 10px}
    .slot{width:44px;height:44px} .slot .em{font-size:19px}
    #help{display:none}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="load">
  <h1>🌾 StarVale</h1>

</div>

<div id="hud" class="hidden">

  <div id="status" class="card">

  </div>

  <div id="energy" class="card">
    <div class="lab"><span id="enlab">体力 Energy</span><span id="env">270/270</span></div>
    <div id="ebar"><i></i></div>
  </div>

  <div id="hot"></div>
  <div id="cross"></div>
  <div id="toasts"></div>
  <div id="help" class="card">
    <b id="h0">操作</b><br>
    <kbd>WASD</kbd> <span id="h1">移动</span> · <kbd>Shift</kbd> <span id="h2">奔跑</span><br>
    <span id="h3">鼠标</span> <span id="h4">视角</span> · <kbd>1-5</kbd> <span id="h5">工具</span><br>

    <kbd>B</kbd> <span id="h8">商店</span> · <kbd>Tab</kbd> <span id="h9">背包</span><br>
    <kbd>C</kbd> <span id="h10">制作</span> · <kbd>F</kbd> <span id="h11">钓鱼</span> · <kbd>E</kbd> <span id="h12">鸡舍/矿洞/交谈</span>
  </div>
</div>

<div id="fade"><div class="ft" id="fadet"></div></div>

<!-- shop -->
<div id="shop" class="panel card hidden">
  <span class="xbtn" data-close="shop">✕</span>
  <h2 id="shopt">🏪 种子商店</h2>
  <div class="hint" id="shoph">点击购买当季种子。回到农场，犁地后右击种下。</div>
  <div class="grid" id="shopg"></div>
</div>

<!-- inventory -->
<div id="inv" class="panel card hidden">
  <span class="xbtn" data-close="inv">✕</span>
  <h2 id="invt">🎒 背包</h2>
  <div class="hint" id="invh">点击种子以手持，之后左击已犁松的土地种植。</div>
  <div class="grid" id="invg"></div>
</div>

<script type="module">
import * as THREE from 'three';

  EffectComposer, RenderPass, EffectPass, BloomEffect, SMAAEffect, Effect

import {

} from './scenery.js';

/* ======================================================================
   StarVale · 星星人露谷 — a Stardew-Valley-style farming life sim.
   A painted lake valley: see scenery.js and tools/paint.
   The classic voxel game lives on at /mc.html (switchable, not removed).

const $ = s => document.querySelector(s);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp = (a,b,t)=>a+(b-a)*t;

/* ---------- i18n ---------- */
let LANG = localStorage.getItem('sv_lang') || 'zh';
const T = {

/* ---------- crops ---------- */
// season: index 0..3 it grows in (or 'all'); days: days to mature; price: sell; seed: buy cost
const CROPS = {
  parsnip:   {em:'🥕', nm:{zh:'防风草',en:'Parsnip'},   season:[0], days:4, price:35,  seed:20, col:0xe8c35a, fruit:0xd9a12e },

  radish:    {em:'🔴', nm:{zh:'萝卜',en:'Radish'},     season:[1], days:6, price:90,  seed:40, col:0x8fc35a, fruit:0xe0506a },
  melon:     {em:'🍈', nm:{zh:'甜瓜',en:'Melon'},      season:[1], days:12,price:250, seed:80, col:0x8fc35a, fruit:0xa8d26a },
  wheat:     {em:'🌾', nm:{zh:'小麦',en:'Wheat'},      season:[1,2],days:4,price:25,  seed:10, col:0xd8c25a, fruit:0xe8d06a },
  grape:     {em:'🍇', nm:{zh:'葡萄',en:'Grape'},      season:[2], days:10,price:80,  seed:60, col:0x7fae5b, fruit:0x7a4ba0 }
};
const cropName = id => CROPS[id].nm[LANG] || CROPS[id].nm.en;

/* ---------- fish / ore / products / materials / craftables ---------- */
const FISH={
  carp:{em:'🐟',nm:{zh:'鲤鱼',en:'Carp'},price:30,season:[0,1,2,3]},
  sardine:{em:'🐠',nm:{zh:'沙丁鱼',en:'Sardine'},price:45,season:[0,2,3]},
  bass:{em:'🎣',nm:{zh:'鲈鱼',en:'Bass'},price:60,season:[0,1,2,3]},
  salmon:{em:'🐡',nm:{zh:'鲑鱼',en:'Salmon'},price:80,season:[2]},
  tuna:{em:'🐟',nm:{zh:'金枪鱼',en:'Tuna'},price:110,season:[1,3]},
  catfish:{em:'🐠',nm:{zh:'鲶鱼',en:'Catfish'},price:130,season:[0,2]}
};
const ORES={
  coal:{em:'⚫',nm:{zh:'煤',en:'Coal'},price:15},
  copper:{em:'🟠',nm:{zh:'铜矿',en:'Copper'},price:20},
  iron:{em:'⚙️',nm:{zh:'铁矿',en:'Iron'},price:40},
  gold_ore:{em:'🟡',nm:{zh:'金矿',en:'Gold'},price:80},
  gem:{em:'💎',nm:{zh:'宝石',en:'Gem'},price:160}
};
const PRODUCTS={ egg:{em:'🥚',nm:{zh:'鸡蛋',en:'Egg'},price:50}, milk:{em:'🥛',nm:{zh:'牛奶',en:'Milk'},price:125} };
const MATS={ wood:{em:'🪵',nm:{zh:'木头',en:'Wood'},price:2}, stone:{em:'🪨',nm:{zh:'石头',en:'Stone'},price:2}, fiber:{em:'🌿',nm:{zh:'纤维',en:'Fiber'},price:1} };
const CRAFTABLES={
  sprinkler:{em:'💧',nm:{zh:'洒水器',en:'Sprinkler'},cost:{'mat:stone':2,'ore:copper':1}},
  scarecrow:{em:'🥷',nm:{zh:'稻草人',en:'Scarecrow'},cost:{'mat:wood':12,'mat:fiber':4}},
  fence:{em:'🪵',nm:{zh:'栅栏',en:'Fence'},cost:{'mat:wood':2}},
  torch:{em:'🔥',nm:{zh:'火把',en:'Torch'},cost:{'mat:wood':1,'ore:coal':1}}
};
const FOOD={
  fried_egg:{em:'🍳',nm:{zh:'煎蛋',en:'Fried Egg'},price:55,energy:50},
  omelet:{em:'🍲',nm:{zh:'蛋卷',en:'Omelet'},price:125,energy:100},
  baked_potato:{em:'🥔',nm:{zh:'烤土豆',en:'Baked Potato'},price:90,energy:55},
  salad:{em:'🥗',nm:{zh:'田园沙拉',en:'Salad'},price:110,energy:70},
  pumpkin_pie:{em:'🥧',nm:{zh:'南瓜派',en:'Pumpkin Pie'},price:385,energy:180},
  sashimi:{em:'🍣',nm:{zh:'生鱼片',en:'Sashimi'},price:95,energy:75},
  bread:{em:'🍞',nm:{zh:'面包',en:'Bread'},price:60,energy:50}
};
const COOK={
  fried_egg:{cost:{'product:egg':1}}, omelet:{cost:{'product:egg':1,'product:milk':1}},
  baked_potato:{cost:{'crop:potato':1}}, salad:{cost:{'crop:kale':1,'crop:radish':1}},
  pumpkin_pie:{cost:{'crop:pumpkin':1,'product:milk':1,'product:egg':1}},
  sashimi:{cost:{'fish:salmon':1}}, bread:{cost:{'crop:wheat':2}}
};
const DB={seed:CROPS,crop:CROPS,fish:FISH,ore:ORES,product:PRODUCTS,mat:MATS,craft:CRAFTABLES,food:FOOD};
function metaOf(kind,id){
  const d=(DB[kind]||{})[id];
  if(kind==='seed') return {em:CROPS[id].em, name:cropName(id)+' '+t('seedsuf'), price:0};
  if(!d) return {em:'❔',name:id,price:0};
  return { em:d.em, name:(d.nm&&(d.nm[LANG]||d.nm.en))||id, price:d.price||0 };

const ICONS={};
function renderIcons(){
  const SZ=160, rt=new THREE.WebGLRenderTarget(SZ,SZ);   // no MSAA: readRenderTargetPixels must resolve per-crop
  const isc=new THREE.Scene(); isc.environment=scene.environment;
  const icam=new THREE.PerspectiveCamera(32,1,0.05,30);
  const key=new THREE.DirectionalLight(0xfff2dc,3.4); key.position.set(2.5,4,3); isc.add(key);
  isc.add(new THREE.HemisphereLight(0xffffff,0x8a8a70,2.2));
  const cv=document.createElement('canvas'); cv.width=cv.height=SZ; const ctx=cv.getContext('2d');
  const buf=new Uint8Array(SZ*SZ*4);
  const prevRT=renderer.getRenderTarget(), prevA=renderer.getClearAlpha(), prevCC=new THREE.Color(); renderer.getClearColor(prevCC);
  const prevTM=renderer.toneMapping, prevExp=renderer.toneMappingExposure;
  renderer.toneMapping=THREE.NoToneMapping;
  const gam=new Uint8Array(256); for(let i=0;i<256;i++) gam[i]=Math.round(Math.pow(i/255,1/2.2)*255);   // the target holds linear light
  renderer.setClearColor(0x000000,0); renderer.setRenderTarget(rt);
  for(const id in CROPS){
    const m=cropMesh(id,CROPS[id].days,CROPS[id].days);
    const box=new THREE.Box3().setFromObject(m), ctr=box.getCenter(new THREE.Vector3()), sz=box.getSize(new THREE.Vector3());
    m.position.sub(ctr); isc.add(m);
    const rad=Math.max(sz.x,sz.y,sz.z)||0.5, d=rad*1.75;
    icam.position.set(d*0.55,d*0.45,d); icam.lookAt(0,0,0);
    renderer.clear(); renderer.render(isc,icam);
    renderer.readRenderTargetPixels(rt,0,0,SZ,SZ,buf);
    const img=ctx.createImageData(SZ,SZ);
    for(let y=0;y<SZ;y++){ const sy=SZ-1-y; for(let x=0;x<SZ;x++){ const si=(sy*SZ+x)*4,di=(y*SZ+x)*4; img.data[di]=gam[buf[si]];img.data[di+1]=gam[buf[si+1]];img.data[di+2]=gam[buf[si+2]];img.data[di+3]=buf[si+3]; } }
    ctx.clearRect(0,0,SZ,SZ); ctx.putImageData(img,0,0); ICONS[id]=cv.toDataURL('image/png'); isc.remove(m);
  }
  renderer.setRenderTarget(prevRT); renderer.setClearColor(prevCC,prevA); renderer.toneMapping=prevTM; renderer.toneMappingExposure=prevExp; rt.dispose();
}

    const lvl=S.toolLvl[S.tool], ec=Math.max(1,3-lvl), o=nearestOf(S.tool===2?'tree':'rock',player.pos.x,player.pos.z,3);

  }

    let did=0; for(const [dx,dz] of aoe(lvl)){ const cx=x+dx,cz=z+dz; if(Math.abs(cx)>FARM_HALF||cz>FARM_HALF||cz<-5.5) continue;

/* ============================ TIME / DAY ============================ */
function advanceDay(){
  if(S.inMine) leaveMine();
  // grow watered crops, wilt out-of-season
  for(const [k,tl] of S.tiles){
    if(tl.crop){
      const c=CROPS[tl.crop.id];
      if(c.season.indexOf(S.season)<0){ tl.crop=null; const [x,z]=k.split(',').map(Number); rebuildCrop(x,z); continue; }
      if(tl.watered && tl.crop.stage<c.days){ tl.crop.stage++; }
    }
    tl.watered=false; if(tl.crop) tl.crop.watered=false;
  }
  // rebuild visuals
  for(const [k,tl] of S.tiles){ const [x,z]=k.split(',').map(Number); refreshTileMesh(x,z); rebuildCrop(x,z); }
  // sell shipped
  if(S.shipped>0){ S.gold+=S.shipped; }
  const earned=S.shipped; S.shipped=0;
  // roll calendar
  S.day++; if(S.day>28){ S.day=1; S.season=(S.season+1)%4; retintGround(); }
  S.time=360; S.energy=S.maxEnergy;
  rollWeather();                     // new day's weather (rain auto-waters)
  // sprinklers water their 4 neighbours for the new day
  for(const [k,tl] of S.tiles){ if(tl.sprinkler){ const [x,z]=k.split(',').map(Number); for(const [dx,dz] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nt=getTile(x+dx,z+dz); if(nt&&nt.tilled){ nt.watered=true; if(nt.crop) nt.crop.watered=true; refreshTileMesh(x+dx,z+dz); } } } }
  animalsProduce(); NPCS.forEach(n=>n.gifted=false); S.festDone=false; checkFestival(); saveGame();
  renderStatus(); renderEnergy();
  return earned;
}

let composer=null, gradeFx=null, lastRig=null;
// the hour's three-colour key: every value in the frame is pulled toward it, so the picture stays in one harmony
class HourGrade extends Effect {
  constructor(){ super('HourGrade',
    `uniform vec3 gS,gM,gH; uniform float amt;
     void mainImage(const in vec4 c, const in vec2 uv, out vec4 o){
       vec3 col=pow(max(c.rgb,0.0),vec3(1.0/2.2));
       vec3 s=pow(gS,vec3(1.0/2.2)), m=pow(gM,vec3(1.0/2.2)), h=pow(gH,vec3(1.0/2.2));
       float l=dot(col,vec3(0.2126,0.7152,0.0722));
       vec3 g=l<0.5?mix(s,m,l*2.0):mix(m,h,(l-0.5)*2.0);
       col=mix(col,g+(col-vec3(l))*1.0,amt);
       col=clamp(col,0.0,1.0); col=mix(col,col*col*(3.0-2.0*col),0.14);
       float d=distance(uv,vec2(0.5)); col*=1.0-d*d*0.2;
       o=vec4(pow(col,vec3(2.2)),c.a);
     }`,
    { uniforms:new Map([['gS',new THREE.Uniform(new THREE.Color())],['gM',new THREE.Uniform(new THREE.Color())],['gH',new THREE.Uniform(new THREE.Color())],['amt',new THREE.Uniform(0.3)]]) }); }
}
let QUAL = localStorage.getItem('sv_qual')||'med';
const QSET={ low:{dpr:0.85,shadow:1024,bloom:false,msaa:0,smaa:false},
            med:{dpr:1.25,shadow:1536,bloom:true,msaa:0,smaa:true},
            high:{dpr:1.6,shadow:2048,bloom:true,msaa:4,smaa:false} };
function setupPost(){

  renderer.shadowMap.needsUpdate=true;
  if(composer){ composer.dispose(); composer=null; }
  renderer.toneMapping=THREE.NoToneMapping;
  composer=new EffectComposer(renderer,{ frameBufferType:THREE.HalfFloatType, multisampling:q.msaa });
  composer.addPass(new RenderPass(scene,camera));

// frame governor: if a machine cannot hold its tier, step resolution and mirror rate down, quietly and for this session
let govT=0, govN=0, govStep=0, govScale=1;
function governor(raw){ if(DBG&&!DBG.gov) return;
  govT+=raw; govN++; if(govT<2.5) return;
  const fps=govN/govT; govT=0; govN=0;
  if(fps<42&&govStep<3&&!document.hidden){ govStep++; govScale=[1,.82,.68,.56][govStep];
    setMirrorEvery(Math.min(3,1+govStep));
    renderer.setPixelRatio(Math.min(devicePixelRatio,(QSET[QUAL]||QSET.med).dpr)*govScale); composer.setSize(innerWidth,innerHeight); syncRes(); }
}

function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000, dt=Math.min(0.05,raw); last=now;
  updateRain(dt); updateCritters(now*0.001); updateNPCs(dt); updateAnimals(dt); updateFish(dt); updateFireflies(now*0.001); updatePetals(dt);
  if(S.inMine && mineLight) mineLight.position.set(player.pos.x,4,player.pos.z);
  fCnt++; fAcc+=raw; if(fAcc>=0.5){ const fe=$('#fps'), v=Math.round(fCnt/fAcc); if(fe) fe.textContent=v+' fps'; window.__fps=v; fCnt=0; fAcc=0; }

  // time of day
  if(!S.sleeping&&!DBG){ S.time += dt*0.7; // ~0.7 min/sec → a full 6:00→2:00 day ≈ ~20 min real
    if(S.time>=1560){ sleep(); }      // 26:00 = pass out at 2AM
  }
  dayNight(now*0.001,dt);

  // movement (camera-relative)
  cForward.set(Math.sin(cam.yaw),0,Math.cos(cam.yaw));
  cRight.set(cForward.z,0,-cForward.x);
  moveV.set(0,0,0);
  if(keys['KeyW']) moveV.add(cForward); if(keys['KeyS']) moveV.sub(cForward);
  if(keys['KeyA']) moveV.sub(cRight);   if(keys['KeyD']) moveV.add(cRight);
  if(touchMove.lengthSq()>0.01){ moveV.add(cForward.clone().multiplyScalar(-touchMove.y)); moveV.add(cRight.clone().multiplyScalar(touchMove.x)); }
  const wantMove=moveV.lengthSq()>0.001, wantSp=(S.running&&S.energy>0?7.2:4.2)*(S.energy>0?1:0.45)*(S.boating?.72:1);
  if(wantMove) moveV.normalize().multiplyScalar(wantSp);
  // weight: you ease into a run and take a step or two to stop
  const accel=1-Math.exp(-dt*(wantMove?(S.boating?2.6:10):(S.boating?1.3:13)));
  player.vel.x+=(moveV.x-player.vel.x)*accel; player.vel.z+=(moveV.z-player.vel.z)*accel;
  player.speed=Math.hypot(player.vel.x,player.vel.z); player.moving=player.speed>.12;
  if(player.moving){
    const ox=player.pos.x, oz=player.pos.z;
    player.pos.x+=player.vel.x*dt; player.pos.z+=player.vel.z*dt;
    if(S.boating){                                       // rowing: the lake is the floor and the land is the wall
      if(lakeField(player.pos.x,player.pos.z)<.012){ player.pos.x=ox; player.pos.z=oz; }
    } else if(!S.inMine){
      collide(player.pos,.45);
      if(inWater(player.pos.x,player.pos.z)){            // slide along the shore rather than stop dead
        if(!inWater(player.pos.x,oz)) player.pos.z=oz; else if(!inWater(ox,player.pos.z)) player.pos.x=ox; else { player.pos.x=ox; player.pos.z=oz; }
      }
      player.pos.x=clamp(player.pos.x,-210,210); player.pos.z=clamp(player.pos.z,-190,120);
    }
    player.yaw=Math.atan2(player.vel.x,player.vel.z);
    player.walkT+=player.speed*dt*2.7;
  }
  player.pos.y=S.inMine?0:S.boating?WATER_Y+.08+Math.sin(now*.0016)*.05:walkH(player.pos.x,player.pos.z);
  updateBoat(dt,now); updateBeasts(dt,now);
  if(S.inMine){ player.pos.x=clamp(player.pos.x,-14.5,14.5); player.pos.z=clamp(player.pos.z,-14.5,14.5); player.pos.y=0; }
  avatar.position.copy(player.pos);
  avatar.rotation.y=angDamp(avatar.rotation.y,player.yaw,S.boating?4:13,dt);
  animateWalk(dt);

  // third-person camera
  const cs=Math.cos(cam.pitch);
  const camPos=new THREE.Vector3(
    player.pos.x - Math.sin(cam.yaw)*cam.dist*cs,
    player.pos.y + cam.height + Math.sin(cam.pitch)*cam.dist,
    player.pos.z - Math.cos(cam.yaw)*cam.dist*cs);
  if(!S.inMine){ const gy=terrainH(camPos.x,camPos.z)+.7; if(camPos.y<gy) camPos.y=gy; }   // never dip under a slope
  camera.position.lerp(camPos,DBG?1:1-Math.pow(.0001,dt));
  camAim.x=DBG?player.pos.x:damp(camAim.x,player.pos.x,14,dt); camAim.y=DBG?player.pos.y:damp(camAim.y,player.pos.y,9,dt); camAim.z=DBG?player.pos.z:damp(camAim.z,player.pos.z,14,dt);
  camera.lookAt(camAim.x, camAim.y+(cam.look||1.5), camAim.z);

  if((sTick&1)===0) updateTarget();
  // selector pulse
  selector.material.opacity=0.5+Math.sin(now*0.006)*0.35;

  // proximity hints
  hintProximity();

function lerpAngle(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2))-Math.PI; if(d<-Math.PI)d+=Math.PI*2; return a+d*t; }
function animateWalk(dt){
  if(!avatar) return;
  const v=player.speed, g=Math.min(1,v/4.2), run=Math.max(0,(v-4.4)/2.8), P=player.walkT;
  walkU.uAmp.value=damp(walkU.uAmp.value,S.boating?0:g,12,dt); walkU.uPhase.value=P; walkU.uRow.value=damp(walkU.uRow.value,S.boating&&player.moving?1:0,6,dt);
  if(charIsGLB&&charHolder){ const breath=Math.sin(performance.now()*.0021), step=Math.abs(Math.sin(P));
    charHolder.position.y=S.boating?-.22:step*.075*g+breath*.006*(1-g);
    charHolder.rotation.x=g*.1+run*.1;                                         // lean into the walk, harder at a run
    charHolder.rotation.z=Math.sin(P)*.055*g;                                  // toddler's waddle
    charHolder.rotation.y=charYaw+Math.sin(P)*.09*g;
    const sq=Math.cos(P*2)*.022*g; charHolder.scale.set(1-sq,1+sq+breath*.004*(1-g),1-sq);
    return; }
  if(!legL) return;
  const amt=player.moving?1:0, s=Math.sin(P), c=Math.cos(P);
  legL.rotation.x=lerp(legL.rotation.x, s*0.7*amt, 0.3); legR.rotation.x=lerp(legR.rotation.x,-s*0.7*amt,0.3);
  armL.rotation.x=lerp(armL.rotation.x,-s*0.6*amt,0.3); armR.rotation.x=lerp(armR.rotation.x, s*0.6*amt,0.3);
  if(headG) headG.position.y=1.75+(player.moving?Math.abs(c)*0.08:Math.sin(performance.now()*0.002)*0.03);
}
const sunDirL=new THREE.Vector3();
function dayNight(t,dt){
  if(S.inMine) return;                              // the mine keeps its own dark lighting
  const R=updateScenery(t,dt,S.time,S.weather,camera,player,S.day%9===4); lastRig=R;
  sunDirL.copy(R.sunDir); sunDirL.y=Math.max(sunDirL.y,.42); sunDirL.normalize();
  sun.position.copy(player.pos).addScaledVector(sunDirL,120);
  sun.target.position.copy(player.pos); sun.target.updateMatrixWorld();
  sun.intensity=R.sunI; sun.color.copy(R.sunCol);
  hemi.color.copy(R.ambCol); hemi.intensity=R.ambI;
  scene.fog.color.copy(R.fogCol); scene.fog.density=R.fog;
  updateBuildings(t,dt,R.night,clamp((S.time-1100)/120,0,1));
  if(gradeFx){ const u=gradeFx.uniforms; u.get('gS').value.copy(R.gS); u.get('gM').value.copy(R.gM); u.get('gH').value.copy(R.gH); u.get('amt').value=R.gAmt; }
}

    +'<div id="fzone" style="position:absolute;top:0;bottom:0;background:rgba(232,163,74,.55)"></div>'

    +'<div class="hint" style="margin-top:10px">'+L('上钩后按 F / 点击，让光标停在蓝区','When it bites, press F / click with the cursor in the blue zone')+'</div></div>';
  $('#hud').appendChild(fishUI);
  fishState={phase:'cast',t:0,cur:0,dir:1,zoneL:25+Math.random()*45,zoneW:22,biteAt:0.8+Math.random()*2.2};
  fishUI.querySelector('.card').onclick=fishPress;
}
function updateFish(dt){ if(!fishState) return;
  if(fishState.phase==='cast'){ fishState.t+=dt; if(fishState.t>=fishState.biteAt){ fishState.phase='bite'; $('#fmsg').textContent='❗ '+L('上钩了！','Bite!'); const w=$('#fbarwrap'); w.style.display='block'; const z=$('#fzone'); z.style.left=fishState.zoneL+'%'; z.style.width=fishState.zoneW+'%'; fishState.t=0; } }
  else { fishState.cur+=fishState.dir*dt*70; if(fishState.cur>=100){fishState.cur=100;fishState.dir=-1;} if(fishState.cur<=0){fishState.cur=0;fishState.dir=1;} const c=$('#fcur'); if(c) c.style.left=fishState.cur+'%';
    fishState.t+=dt; if(fishState.t>6) endFish(false); }
}
function fishPress(){ if(!fishState) return; if(fishState.phase==='cast'){ endFish(false); return; }
  endFish(fishState.cur>=fishState.zoneL && fishState.cur<=fishState.zoneL+fishState.zoneW); }
function endFish(success){ if(!fishUI) return; fishUI.remove(); fishUI=null; fishState=null; spendEnergy(4);
  if(success){ const pool=Object.keys(FISH).filter(id=>FISH[id].season.includes(S.season)); const id=pool[Math.floor(Math.random()*pool.length)]||'carp'; invAdd('fish',id,1); toast(FISH[id].em+' '+L('钓到 ','Caught ')+metaOf('fish',id).name+'!'); }
  else toast(L('鱼跑了…','It got away…')); }

/* ---- festivals ---- */
const FESTIVALS={ '0,13':{zh:'🌸 春之花舞',en:'🌸 Flower Dance'}, '1,11':{zh:'🏖 夏日海滩节',en:'🏖 Summer Luau'}, '2,16':{zh:'🍂 秋之集市',en:'🍂 Fall Fair'}, '3,8':{zh:'❄️ 冬夜集市',en:'❄️ Winter Market'} };
function checkFestival(){ const f=FESTIVALS[S.season+','+S.day]; S.festival=f?(LANG==='zh'?f.zh:f.en):null;
  if(f){ NPCS.forEach(n=>{ n.tgt={x:34+(Math.random()-.5)*6,z:-24+(Math.random()-.5)*6}; }); const bonus=200+S.season*50; S.gold+=bonus; renderStatus(); toast('🎉 '+(LANG==='zh'?f.zh:f.en)+' · +'+bonus+'g · '+L('去广场参加活动','join the plaza event')); } }

/* ---- blacksmith: tool upgrades ---- */
const ANVIL={x:-7.2,z:-11.6}, STOVE={x:7.2,z:-11.8}, PLAZA={x:34,z:-24};
const TOOL_TIERS=[
  {ab:'Cu',nm:{zh:'铜',en:'Copper'},gold:500,ore:'copper',n:3},
  {ab:'Fe',nm:{zh:'铁',en:'Iron'},gold:1200,ore:'iron',n:3},
  {ab:'Au',nm:{zh:'金',en:'Gold'},gold:3000,ore:'gold_ore',n:3},
  {ab:'Ir',nm:{zh:'铱',en:'Iridium'},gold:6000,ore:'gem',n:2}
];
function openBlacksmith(){ modal(L('🔨 铁匠铺 · 工具升级','🔨 Blacksmith · Upgrades'), body=>{
  body.innerHTML='<div class="hint">'+L('用矿石和金币升级工具：锄头/水壶范围变大，所有工具更省体力。','Upgrade tools with ore + gold: bigger hoe/can area, all tools cost less energy.')+'</div>';
  const g=document.createElement('div'); g.className='grid'; body.appendChild(g);
  const toolE=['⛏️','🪣','🪓','🔨','🌾'];
  for(let i=0;i<5;i++){ const lvl=S.toolLvl[i]; const b=document.createElement('div'); b.className='buy';
    if(lvl>=4){ b.classList.add('dim'); b.innerHTML='<div class="em">'+toolE[i]+'</div><div class="nm">'+t('tools')[i]+'</div><div class="pr">'+L('已满级','MAX')+'</div>'; }
    else { const tr=TOOL_TIERS[lvl]; const ok=S.gold>=tr.gold && invCount('ore',tr.ore)>=tr.n; if(!ok) b.classList.add('dim');
      b.innerHTML='<div class="em">'+toolE[i]+'</div><div class="nm">'+t('tools')[i]+' → '+(LANG==='zh'?tr.nm.zh:tr.nm.en)+'</div><div class="pr">'+ORES[tr.ore].em+tr.n+' · '+tr.gold+'g</div>';
      b.onclick=()=>{ if(S.gold<tr.gold||invCount('ore',tr.ore)<tr.n){ toast(L('材料或金币不足','Not enough ore/gold')); return;} S.gold-=tr.gold; invTake('ore',tr.ore,tr.n); S.toolLvl[i]++; renderStatus(); renderHotbar(); toast('🔧 '+t('tools')[i]+' → '+(LANG==='zh'?tr.nm.zh:tr.nm.en)+'!'); openBlacksmith(); };
    }
    g.appendChild(b); }
}); }

/* ---- cooking + eating ---- */
function openCook(){ modal(L('🍳 烹饪','🍳 Cooking'), body=>{
  body.innerHTML='<div class="hint">'+L('用食材烹饪料理，食用恢复体力，也可出售。','Cook ingredients into dishes — eat to restore energy, or sell them.')+'</div>';
  const g=document.createElement('div'); g.className='grid'; body.appendChild(g);
  for(const id in COOK){ const r=COOK[id]; const f=FOOD[id]; const ok=hasCost(r.cost); const b=document.createElement('div'); b.className='buy'+(ok?'':' dim');
    b.innerHTML='<div class="em">'+f.em+'</div><div class="nm">'+metaOf('food',id).name+'</div><div class="pr">'+costStr(r.cost)+' · ⚡'+f.energy+'</div>';
    b.onclick=()=>{ if(!payCost(r.cost)){ toast(L('食材不足','Missing ingredients')); return;} invAdd('food',id,1); toast('🍽 +'+metaOf('food',id).name); openCook(); };
    g.appendChild(b); }
}); }
function eat(id){ const f=FOOD[id]; if(!f||!invCount('food',id)) return; invTake('food',id,1); S.energy=clamp(S.energy+f.energy,0,S.maxEnergy); renderEnergy(); toast('🍽 '+metaOf('food',id).name+' +⚡'+f.energy); }

/* ---- festival mini-game: lucky pick ---- */
function openFestival(){ modal('🎉 '+(S.festival||L('节日','Festival')), body=>{
  body.innerHTML='<div class="hint">'+L('选一个礼盒，试试运气！','Pick a gift box — try your luck!')+'</div>';
  const g=document.createElement('div'); g.className='grid'; body.appendChild(g);
  for(let i=0;i<3;i++){ const b=document.createElement('div'); b.className='buy'; b.innerHTML='<div class="em">🎁</div><div class="nm">'+L('礼盒','Box')+' '+(i+1)+'</div>';
    b.onclick=()=>{ if(S.festDone) return; S.festDone=true; const r=Math.random(); let msg;
      if(r<0.3){ const amt=400+Math.floor(Math.random()*4)*200; S.gold+=amt; msg='🪙 +'+amt+'g'; }
      else if(r<0.55){ invAdd('ore','gem',1); msg='💎 '+metaOf('ore','gem').name; }
      else if(r<0.8){ const ids=Object.keys(CROPS); const cid=ids[Math.floor(Math.random()*ids.length)]; invAdd('seed',cid,3); msg='🌱 '+cropName(cid)+' ×3'; }
      else { invAdd('food','pumpkin_pie',1); msg='🥧 '+metaOf('food','pumpkin_pie').name; }
      renderStatus(); toast('🎉 '+msg); body.innerHTML='<div style="text-align:center;font-size:17px;padding:14px">🎉 '+msg+'</div>'; };
    g.appendChild(b); }
}); }

/* ---- save / load (localStorage) ---- */
function saveGame(){
  try{
    const tiles=[]; for(const [k,tl] of S.tiles){ tiles.push([k,{t:tl.tilled?1:0,w:tl.watered?1:0,s:tl.sprinkler?1:0,c:tl.crop?[tl.crop.id,tl.crop.stage]:0}]); }
    const data={ v:2, gold:S.gold, day:S.day, season:S.season, time:S.time, energy:S.energy,
      toolLvl:S.toolLvl, inv:S.inv, weather:S.weather, shipped:S.shipped, mineLevel:S.mineLevel,
      tiles, placements, coopStash, animals:animals.map(a=>a.type), npc:NPCS.map(n=>n.hearts) };
    localStorage.setItem('sv_save', JSON.stringify(data));
  }catch(e){}
}
function loadGame(){
  let data; try{ data=JSON.parse(localStorage.getItem('sv_save')); }catch(e){} if(!data||data.v!==2) return false;
  try{
    S.gold=data.gold; S.day=data.day; S.season=data.season; S.time=data.time; S.energy=data.energy;
    S.toolLvl=data.toolLvl||[0,0,0,0,0]; S.inv=data.inv||{}; S.weather=data.weather||'clear'; S.shipped=data.shipped||0; S.mineLevel=data.mineLevel||0;
    S.tiles=new Map();
    for(const [k,tl] of (data.tiles||[])){ S.tiles.set(k,{tilled:!!tl.t,watered:!!tl.w,sprinkler:!!tl.s, crop: tl.c?{id:tl.c[0],stage:tl.c[1],watered:!!tl.w}:null}); }
    for(const [k] of S.tiles){ const a=k.split(',').map(Number); refreshTileMesh(a[0],a[1]); rebuildCrop(a[0],a[1]); }
    placements=[]; (data.placements||[]).forEach(p=>{ placements.push(p); spawnPlacement(p.id,p.x,p.z,p.ry); });
    (data.animals||[]).forEach(t=>spawnAnimal(t));
    (data.npc||[]).forEach((h,i)=>{ if(NPCS[i]) NPCS[i].hearts=h; });
    coopStash=data.coopStash||{egg:0,milk:0};
    retintGround(); return true;
  }catch(e){ return false; }
}
function resetSave(){ try{ localStorage.removeItem('sv_save'); }catch(e){} location.reload(); }

/* ============================ BOOT ============================ */
function setProgress(p,msg){ $('#bar>i').style.width=p+'%'; if(msg)$('#loadsub').textContent=msg; }
async function boot(){
  $('#loadsub').textContent=t('gen');
  $('#loadsub').textContent='正在铺开湖谷 · painting the valley…';
  await loadScenery(p=>setProgress(5+p*35)); setProgress(42);
  buildScenery(world,QUAL); setupFlora(world,plantedTrees,plantedPlants,QUAL); setSeason(S.season); bakeMap(); setProgress(58);
  buildRain(); buildCritters(); buildFireflies(); buildPetals();
  buildFarmstead(); buildTown(); buildCoop(); buildMine(); buildNPCs(); boat=buildDock(world); buildSmoke(world); setupBeasts(); setProgress(70);
  buildAvatar(); await loadTwinkle(); setupPost(); setProgress(84);
  try{ renderIcons(); }catch(e){}   // bake crop models → shop/inventory icons
  setProgress(90);

  // starter kit
  invAdd('seed','parsnip',5); invAdd('seed','potato',2);
  invAdd('mat','wood',8); invAdd('mat','stone',6); invAdd('ore','copper',2);
  if(!DBG&&loadGame()) toast(L('存档已读取','Save loaded'));   // restore progress if present
  if(!DBG) addEventListener('beforeunload', saveGame);
  if(DBG) applyDebugShot();
  renderStatus(); renderEnergy(); renderHotbar(); applyLang();
  retintGround(); applyWeather(); updateQualBtn();
  setProgress(100);
  setTimeout(()=>{ $('#load').classList.add('hidden'); if(!DBG||DBG.hud) $('#hud').classList.remove('hidden'); dispatchEvent(new Event('resize')); },250); // ensure render targets match the (now-visible) viewport
  requestAnimationFrame(frame);
}
// ?shot&t=1130&season=2&x=0&z=20&yaw=0&pitch=.1 freezes the clock on one composed view, for comparing frames
function applyDebugShot(){ const q=DBG;
  if(q.t) S.time=q.t; if(q.season!==undefined) S.season=q.season; if(q.w) S.weather=q.w;
  if(q.x!==undefined) player.pos.x=q.x; if(q.z!==undefined) player.pos.z=q.z;
  if(q.yaw!==undefined) cam.yaw=q.yaw; if(q.pitch!==undefined) cam.pitch=q.pitch; if(q.dist) cam.dist=q.dist; if(q.h) cam.height=q.h; if(q.look) cam.look=q.look;
  if(q.q) QUAL=q.q, setupPost();
  window.__sv={S,player,cam,camera,renderer,setSeason,keys,scene,NPCS,interact,useTool,toggleBoat,tryFish,fishPress,saveGame,loadGame,sleep,enterMine,leaveMine,mineSwing,descendMine,openShop,openCraft,openCoop,openCook,openBlacksmith,openDialogue,advanceDay,placeCraftable,harvest,invAdd,invCount,updateTarget,getTarget:()=>targetCell,setTarget:c=>{targetCell=c;},spawnAnimal,animals:()=>animals,dog,inWaterAt:inWater,walkH};
}
addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); composer&&composer.setSize(innerWidth,innerHeight); syncRes(); });
boot();
</script>
