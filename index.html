   MAIN · 6 — mobs
   A state machine with four states and a straight-line chase is what a
   browser mob actually needs; a full A* over a voxel grid costs far more
   than it buys when the thing chasing you is two blocks tall and can
   step up one. They climb what they can and give up on what they cannot.
   ====================================================================== */
const mobs=[];
const MOB_CAP=12;
let spawnT=0;

const MOBDEF={
  // Minecraft-like hostiles: ~20 HP, ~35-block follow range, brisk chase, real bite
  shade: {hp:20, speed:4.0, dmg:3, r:0.42, h:1.3, agro:35, atk:1.0, night:1, burn:1},
  slime: {hp:16, speed:3.0, dmg:2, r:0.52, h:1.0, agro:24, atk:1.2, dark:1},
  bunny: {hp:6,  speed:2.6, dmg:0, r:0.34, h:0.7, agro:0,  atk:0,   calm:1}
};

/* Every creature used to be eight or ten little meshes, which meant eight or
   ten draw calls each, twice over once the shadow pass is counted. They are
   baked down to ONE vertex-coloured geometry at birth and share a single
   toon material, so a dozen of them cost a dozen calls. The shapes are built
   the same way as before — the baking is the only new step. */
let MOB_RAMP=null;
function mobRamp(){
  if(MOB_RAMP) return MOB_RAMP;
  const c=cv(64,1), x=c.getContext('2d');
  // three flat steps: the banding is the whole point of the look
  x.fillStyle='#6a7390'; x.fillRect(0,0,22,1);
  x.fillStyle='#b9c0d2'; x.fillRect(22,0,20,1);
  x.fillStyle='#ffffff'; x.fillRect(42,0,22,1);
  MOB_RAMP=new T.CanvasTexture(c);
  MOB_RAMP.minFilter=MOB_RAMP.magFilter=T.NearestFilter;
  MOB_RAMP.generateMipmaps=false; MOB_RAMP.colorSpace=T.SRGBColorSpace;
  return MOB_RAMP;
}
let MOB_MAT=null;
function mobMat(){
  if(!MOB_MAT) MOB_MAT=new T.MeshToonMaterial({vertexColors:true,gradientMap:mobRamp()});
  return MOB_MAT;
}
const _bv=new T.Vector3(), _bn=new T.Vector3(), _bm3=new T.Matrix3(),
      _bc=new T.Color();
function bakeGroup(g){
  g.updateMatrixWorld(true);
  const pos=[], nrm=[], col=[];
  g.traverse(function(o){
    if(!o.isMesh) return;
    const src=o.geometry;
    const geo=src.index? src.toNonIndexed() : src;
    const p=geo.attributes.position, n=geo.attributes.normal;
    _bm3.getNormalMatrix(o.matrixWorld);
    if(o.material&&o.material.color) _bc.copy(o.material.color);
    else _bc.setRGB(1,1,1);
    for(let i=0;i<p.count;i++){
      _bv.fromBufferAttribute(p,i).applyMatrix4(o.matrixWorld);
      pos.push(_bv.x,_bv.y,_bv.z);
      if(n){ _bn.fromBufferAttribute(n,i).applyNormalMatrix(_bm3).normalize();
             nrm.push(_bn.x,_bn.y,_bn.z); }
      else nrm.push(0,1,0);
      col.push(_bc.r,_bc.g,_bc.b);
    }
    if(geo!==src) geo.dispose();
    src.dispose();
  });
  const out=new T.BufferGeometry();
  out.setAttribute('position',new T.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',  new T.Float32BufferAttribute(nrm,3));
  out.setAttribute('color',   new T.Float32BufferAttribute(col,3));
  out.computeBoundingSphere();
  return out;
}
const MOB_GEO={};
function mobGeo(kind){
  if(MOB_GEO[kind]) return MOB_GEO[kind];
  const g=new T.Group();
  const M=function(hex){ return new T.MeshBasicMaterial({color:hex}); };
  const add=function(geo,mat,x,y,z,rx,ry,rz,sx,sy,sz){
    const m=new T.Mesh(geo,mat);
    m.position.set(x,y,z);
    if(rx||ry||rz) m.rotation.set(rx||0,ry||0,rz||0);
    if(sx!==undefined) m.scale.set(sx,sy===undefined?sx:sy,sz===undefined?sx:sz);
    g.add(m); return m;
  };
  if(kind==='shade'){
    // a hooded wisp: a tapered body under a cowl, tendrils trailing off it
    const dark=M(0x26233f), mid=M(0x3a3558), glow=M(0xffe9b4);
    const body=new T.SphereGeometry(0.34,14,11);
    add(body,mid,0,0.66,0, 0,0,0, 1.0,1.35,0.95);
    add(new T.ConeGeometry(0.40,0.52,12),dark,0,1.02,-0.04, 0,0,0, 1,1,0.9);
    add(new T.SphereGeometry(0.30,14,10),dark,0,0.92,-0.06, 0,0,0, 1.05,0.9,1.0);
    // the face sits back inside the hood, which is what makes it read as one
    add(new T.SphereGeometry(0.24,12,9),M(0x171530),0,0.84,0.17, 0,0,0, 1,0.95,0.7);
    for(let i=0;i<2;i++)
      add(new T.SphereGeometry(0.058,8,6),glow,(i?0.11:-0.11),0.86,0.33);
    // tendrils, tapering and uneven
    for(let i=0;i<6;i++){
      const a2=i/6*6.283+0.3;
      add(new T.ConeGeometry(0.085,0.46+((i%3)*0.14),6),mid,
          Math.cos(a2)*0.22,0.26,Math.sin(a2)*0.22, Math.PI,0,Math.cos(a2)*0.3);
    }
    add(new T.TorusGeometry(0.30,0.028,6,16),glow,0,0.30,0, Math.PI/2,0,0);
  } else if(kind==='slime'){
    // a soft cube: bevelled with a second, smaller box set inside it
    const skin=M(0x7ee39a), deep=M(0x3f9a5d), eye=M(0x14321f);
    add(new T.BoxGeometry(0.86,0.70,0.86),skin,0,0.36,0);

    add(new T.BoxGeometry(0.74,0.52,0.94),skin,0,0.34,0);
    add(new T.BoxGeometry(0.34,0.30,0.34),deep,0,0.33,0);       // the core
    add(new T.SphereGeometry(0.1,9,7),skin,0,0.74,0, 0,0,0, 1,0.7,1);  // droplet
    for(let i=0;i<2;i++){
      add(new T.BoxGeometry(0.11,0.13,0.05),eye,(i?0.17:-0.17),0.45,0.44);
      add(new T.BoxGeometry(0.04,0.04,0.04),M(0xffffff),(i?0.20:-0.14),0.48,0.46);
    }
    add(new T.BoxGeometry(0.24,0.05,0.05),eye,0,0.27,0.44);
    for(let i=0;i<2;i++)
      add(new T.BoxGeometry(0.2,0.1,0.22),deep,(i?0.24:-0.24),0.05,0.1);
  } else {
    // a cloud rabbit: round, long-eared, with a puff of weather on its back
    const w=M(0xfbfdff), sh=M(0xdfe8f6), pink=M(0xf0b9c8), eye=M(0x3b4256);
    add(new T.SphereGeometry(0.29,14,10),w,0,0.30,-0.02, 0,0,0, 1.15,0.95,1.25);
    add(new T.SphereGeometry(0.215,14,10),w,0,0.54,0.20);
    add(new T.SphereGeometry(0.13,10,8),sh,0,0.44,-0.30, 0,0,0, 1.1,1.0,1.0);
    for(let i=0;i<2;i++){

      add(new T.SphereGeometry(0.034,7,6),eye,(i?0.085:-0.085),0.57,0.375);
      add(new T.SphereGeometry(0.012,5,4),M(0xffffff),(i?0.098:-0.072),0.59,0.395);
    }
    add(new T.SphereGeometry(0.022,6,5),pink,0,0.525,0.41, 0,0,0, 1.3,0.8,1);
    add(new T.SphereGeometry(0.085,8,6),w,0,0.28,-0.33);        // tail
    for(let i=0;i<4;i++)
      add(new T.SphereGeometry(0.075,7,6),w,
          (i<2?-0.14:0.14),0.07,(i%2?0.16:-0.12), 0,0,0, 1,0.7,1.2);

    for(let i=0;i<3;i++)

function spawnMob(kind,x,y,z){
  if(mobs.length>=MOB_CAP) return null;
  const d=MOBDEF[kind];
  const mesh=new T.Mesh(mobGeo(kind),mobMat());
  mesh.castShadow=true; mesh.receiveShadow=true;
  scene.add(mesh);
  const m={kind:kind,def:d,mesh:mesh,hp:d.hp,
    p:new T.Vector3(x,y,z), v:new T.Vector3(),
    state:'wander', st:0, yaw:Math.random()*6.28, hurtT:0, atkT:0,
    onGround:false, hop:0, scale:1};
  mobs.push(m);
  return m;
}
function mobBlocked(m,x,y,z){
  const r=m.def.r*m.scale, h=m.def.h*m.scale;
  const x0=Math.floor(x-r), x1=Math.floor(x+r);
  const z0=Math.floor(z-r), z1=Math.floor(z+r);
  const y0=Math.floor(y), y1=Math.floor(y+h-0.001);
  for(let yy=y0;yy<=y1;yy++) for(let zz=z0;zz<=z1;zz++) for(let xx=x0;xx<=x1;xx++)
    if(solidAt(xx,yy,zz)) return true;
  return false;
}
const _md=new T.Vector3();
function updateMobs(dt,t){
  spawnT-=dt;
  if(spawnT<=0){ spawnT=(daylight<0.26?1.1:3.2); trySpawn(); }   // night presses harder
  for(let i=mobs.length-1;i>=0;i--){
    const m=mobs[i], d=m.def;
    const dist=m.p.distanceTo(player.p);
    if(dist>64 || m.hp<=0){ killMob(i,m.hp<=0); continue; }
    if(m.hurtT>0) m.hurtT-=dt;
    if(m.atkT>0) m.atkT-=dt;

    // --- daylight undoes a shade, which is the whole reason to build a roof
    if(d.burn && daylight>0.55){
      m.roofT=(m.roofT||0)-dt;
      if(m.roofT<=0){ m.roofT=0.5; m.roofed=roofedOver(m.p); }
    } else m.roofed=true;
    if(d.burn && daylight>0.55 && !m.roofed){
      m.hp-=dt*7;
      if(Math.random()<dt*9) blockBits(m.p.x,m.p.y+0.8,m.p.z,OBSID,1);
    }

    // --- state ---
    m.st-=dt;
    const sees=d.agro>0 && dist<d.agro && !player.dead;
    if(sees && m.state!=='chase'){ m.state='chase'; m.st=0; }
    if(!sees && m.state==='chase'){ m.state='wander'; m.st=0; }
    if(m.st<=0){
      if(m.state==='wander'){ m.yaw=Math.random()*6.28; m.st=1.2+Math.random()*2.4;
        if(Math.random()<0.3) m.state='idle'; }
      else if(m.state==='idle'){ m.state='wander'; m.st=1.4+Math.random()*2; }
      else m.st=0.4;
    }

    let want=0;
    if(m.state==='chase'){
      _md.copy(player.p).sub(m.p); _md.y=0;
      m.yaw=Math.atan2(_md.x,_md.z);
      want=(dist>d.atk*0.9)?1:0;
      if(dist<1.25 && m.atkT<=0 && d.dmg){
        m.atkT=1.0; hurt(d.dmg);
        player.v.x+=_md.x/(dist||1)*4; player.v.z+=_md.z/(dist||1)*4;
      }
    } else if(m.state==='wander'){
      want=0.55;
      // something hunting you does not wander away: outside its own notice
      // range it still drifts the right way, so the night closes in slowly
      if(d.dmg && dist>d.agro && Math.random()<dt*1.6){
        _md.copy(player.p).sub(m.p); _md.y=0;
        m.yaw=Math.atan2(_md.x,_md.z)+(Math.random()-0.5)*1.1;
      }
    }

    const sp=d.speed*want;
    const tx=Math.sin(m.yaw)*sp, tz=Math.cos(m.yaw)*sp;
    // a slime only steers while it is in the air after a hop
    if(m.kind==='slime'){
      if(m.onGround){ m.v.x*=0.7; m.v.z*=0.7;
        m.hop-=dt;
        if(m.hop<=0 && want>0){ m.hop=0.75+Math.random()*0.5;
          m.v.y=6.6; m.v.x=tx*1.25; m.v.z=tz*1.25; } }
    } else {
      m.v.x+=(tx-m.v.x)*Math.min(1,9*dt);
      m.v.z+=(tz-m.v.z)*Math.min(1,9*dt);
    }
    m.v.y-=26*dt;

    let nx=m.p.x+m.v.x*dt;
    if(mobBlocked(m,nx,m.p.y,m.p.z)){
      if(m.onGround && !mobBlocked(m,nx,m.p.y+1.02,m.p.z)) { m.p.y+=1.02; m.p.x=nx; }
      else { m.v.x=0; if(m.state==='wander') m.yaw+=2.2; }
    } else m.p.x=nx;
    let nz=m.p.z+m.v.z*dt;
    if(mobBlocked(m,m.p.x,m.p.y,nz)){
      if(m.onGround && !mobBlocked(m,m.p.x,m.p.y+1.02,nz)) { m.p.y+=1.02; m.p.z=nz; }
      else { m.v.z=0; if(m.state==='wander') m.yaw+=2.2; }
    } else m.p.z=nz;
    const ny=m.p.y+m.v.y*dt;
    m.onGround=false;
    if(mobBlocked(m,m.p.x,ny,m.p.z)){
      if(m.v.y<0){ m.p.y=Math.floor(ny)+1; m.onGround=true; }
      m.v.y=0;
    } else m.p.y=ny;
    if(m.p.y<-4){ killMob(i,false); continue; }

    // --- look ---
    m.mesh.position.copy(m.p);
    m.mesh.rotation.y=m.yaw;
    const sc=m.scale;
    if(m.kind==='shade'){
      m.mesh.position.y+=Math.sin(t*2.4+m.p.x)*0.10;
      const br=1+Math.sin(t*3.1+m.p.z)*0.05;
      m.mesh.scale.set(sc/br,sc*br,sc/br);
    } else if(m.kind==='slime'){
      // squash on the way up, stretch on the way down: all the character a
      // cube needs, and it costs one scale
      const st=m.v.y>1?1.18:(m.onGround?0.92:1.0);
      m.mesh.scale.set(sc/st,sc*st,sc/st);
    } else {
      m.mesh.scale.setScalar(sc);
    }
    if(m.kind==='bunny' && m.onGround && Math.random()<dt*0.9) m.v.y=4.2;
    if(m.hurtT>0) m.mesh.position.x+=Math.sin(t*60)*0.04;
  }
}
function roofedOver(p){
  for(let y=Math.floor(p.y)+2;y<SY;y++) if(solidAt(p.x,y,p.z)) return true;
  return false;
}
function killMob(i,drops){
  const m=mobs[i];
  if(drops){
    blockBits(m.p.x,m.p.y+0.6,m.p.z,m.kind==='shade'?OBSID:(m.kind==='slime'?GRASS:CLOUD),16);
    if(m.kind==='shade') invAdd(I_CRYSTAL,1);
    if(m.kind==='slime') invAdd(I_COAL,1);
    if(m.kind==='bunny') invAdd(CLOUD,1);
    sfxMobDie();
    // a big slime is two small ones, the way it always has been
    if(m.kind==='slime' && m.scale>=1){
      for(let k=0;k<2;k++){
        const s=spawnMob('slime',m.p.x+(k?0.6:-0.6),m.p.y+0.2,m.p.z);
        if(s){ s.scale=0.55; s.hp=5; }
      }
    }
  }
  scene.remove(m.mesh);          // geometry is shared, so it is not disposed
  mobs.splice(i,1);
}
function trySpawn(){
  if(mobs.length>=MOB_CAP) return;
  const night=daylight<0.26;
  for(let tries=0;tries<10;tries++){
    const a=Math.random()*6.283, r=11+Math.random()*13;
    const x=Math.floor(player.p.x+Math.cos(a)*r)+0.5;
    const z=Math.floor(player.p.z+Math.sin(a)*r)+0.5;
    if(blockAt(x,40,z)===-1) continue;           // chunk not here yet
    // stand it on the first floor under an opening
    let y=-1;
    for(let yy=SY-2;yy>1;yy--){
      if(solidAt(x,yy,z) && !solidAt(x,yy+1,z) && !solidAt(x,yy+2,z)){ y=yy+1; break; }
    }
    if(y<0) continue;
    if(blockAt(x,y,z)===WATER) continue;
    const dark=!night ? roofedOver(new T.Vector3(x,y,z)) : true;
    let kind=null;
    if(dark && Math.random()<0.6) kind='shade';
    else if(dark) kind='slime';
    else if(Math.random()<0.5) kind='bunny';
    if(!kind) continue;
    if(creative && kind!=='bunny') continue;   // creative mode is peaceful
    if(kind==='bunny' && mobs.length>12) continue;
    spawnMob(kind,x,y,z);
    return;
  }
}
/* ---- the player hitting back ---------------------------------------- */
const _af=new T.Vector3();
function playerAttack(){
  if(player.dead) return false;
  camera.getWorldDirection(_af);
  let best=null, bd=3.0;
  for(let i=0;i<mobs.length;i++){
    const m=mobs[i];
    _md.copy(m.p).sub(player.p); _md.y*=0.5;
    const d=_md.length();
    if(d>bd) continue;
    _md.normalize();
    if(_md.dot(_af)<0.55) continue;
    best=m; bd=d;
  }
  if(!best) return false;
  const dmg=2+ (bestTool()>1?bestTool()*0.9:0);
  best.hp-=dmg; best.hurtT=0.3;
  _md.copy(best.p).sub(player.p).normalize();
  best.v.x+=_md.x*6; best.v.z+=_md.z*6; best.v.y=Math.max(best.v.y,3.2);
  player.swing=1;
  blockBits(best.p.x,best.p.y+0.7,best.p.z,best.kind==='shade'?OBSID:GRASS,4);
  sfxHit();
  return true;
}

let actx=null, dry=null, wet=null, ambOn=false;
function makeImpulse(sec,decay){
  const r=actx.sampleRate, n=(r*sec)|0, b=actx.createBuffer(2,n,r);
  for(let c=0;c<2;c++){
    const d=b.getChannelData(c);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay);
  }
  return b;
}
function audioInit(){
  if(actx) return;
  try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const comp=actx.createDynamicsCompressor();
  comp.threshold.value=-16; comp.ratio.value=7; comp.connect(actx.destination);
  dry=actx.createGain(); dry.gain.value=0.9; dry.connect(comp);
  const cv2=actx.createConvolver(); cv2.buffer=makeImpulse(2.0,2.6);
  wet=actx.createGain(); wet.gain.value=0.3; wet.connect(cv2); cv2.connect(comp);
}
function voice(f,dur,gain,type,send,det){
  if(!actx) return;
  const o=actx.createOscillator(), g=actx.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  if(det) o.detune.value=det;
  const t=actx.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(dry); if(send) g.connect(wet);
  o.start(t); o.stop(t+dur+0.03);
}
function noiseBurst(dur,gain,freq,q,send){
  if(!actx) return;
  const n=(actx.sampleRate*dur)|0, b=actx.createBuffer(1,Math.max(1,n),actx.sampleRate);
  const d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=actx.createBufferSource(); s.buffer=b;
  const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q||1;
  const g=actx.createGain(); g.gain.value=gain;
  s.connect(f); f.connect(g); g.connect(dry); if(send) g.connect(wet);
  s.start();
}
function sfxBreak(id){
  const B=BLOCKS[id]||BLOCKS[1];
  const stone=(id===STONE||id===COAL||id===CRYSTAL||id===BRICK||id===OBSID);
  noiseBurst(0.13,stone?0.20:0.14,stone?900:420,stone?1.6:0.9,true);
  voice(stone?150:92,0.09,0.06,'triangle');
}
function sfxPlace(){ noiseBurst(0.07,0.13,560,1.2); voice(220,0.07,0.05,'sine'); }
function sfxStep(){  noiseBurst(0.05,0.05,300+Math.random()*180,0.8); }
function sfxJump(){  voice(300,0.10,0.05,'sine'); }
function sfxHurt(){  voice(180,0.22,0.12,'sawtooth',true); voice(119,0.26,0.08,'sine'); }
function sfxHit(){   noiseBurst(0.08,0.16,700,1.0,true); voice(140,0.08,0.07,'square'); }
function sfxMobDie(){ [1,1.5,2.01].forEach(function(k,i){
  setTimeout(function(){ voice(180*k,0.3,0.06,'triangle',true); },i*55); }); }
function sfxCraft(){ [523.25,659.25,783.99].forEach(function(f,i){

let rainSrc=null, rainGain=null, rainFilt=null;
function rainBed(amt){
  if(!actx) return;
  if(!rainSrc){
    if(amt<=0.01) return;
    const n=actx.sampleRate*4, b=actx.createBuffer(1,n,actx.sampleRate),
          d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    rainSrc=actx.createBufferSource(); rainSrc.buffer=b; rainSrc.loop=true;
    rainFilt=actx.createBiquadFilter(); rainFilt.type='bandpass';
    rainFilt.frequency.value=1400; rainFilt.Q.value=0.4;
    rainGain=actx.createGain(); rainGain.gain.value=0;
    rainSrc.connect(rainFilt); rainFilt.connect(rainGain);
    rainGain.connect(dry); rainGain.connect(wet);
    rainSrc.start();
  }
  rainGain.gain.value=amt*0.075;
  rainFilt.frequency.value=lerp(1400,700,WEATHER.snow);
}
function startAmbience(){
  if(!actx||ambOn) return; ambOn=true;
  // a slow pad and a band of wind: the room tone a world needs to feel open
  [98,147,196].forEach(function(f,i){
    const o=actx.createOscillator(), g=actx.createGain(), l=actx.createOscillator(),
          lg=actx.createGain();
    o.type='sine'; o.frequency.value=f; o.detune.value=(i-1)*6;
    g.gain.value=0.0;
    l.frequency.value=0.03+i*0.011; lg.gain.value=0.012;
    l.connect(lg); lg.connect(g.gain);
    o.connect(g); g.connect(wet); g.connect(dry);
    o.start(); l.start();
  });
  const n=actx.sampleRate*4, b=actx.createBuffer(1,n,actx.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  const s=actx.createBufferSource(); s.buffer=b; s.loop=true;
  const f=actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=420; f.Q.value=0.6;
  const g=actx.createGain(); g.gain.value=0.012;
  const lf=actx.createOscillator(), lg=actx.createGain();
  lf.frequency.value=0.06; lg.gain.value=0.008; lf.connect(lg); lg.connect(g.gain);
  s.connect(f); f.connect(g); g.connect(dry); g.connect(wet);
  s.start(); lf.start();
}

let state='title', lastT=performance.now(), frameAvg=0.016, stepT=0;
function tick(){
  requestAnimationFrame(tick);
  if(document.hidden) return;
  resizeIfPending();   // recover from a 0x0 layout the moment one arrives
  const now=performance.now();
  const dt=Math.min(0.05,(now-lastT)/1000); lastT=now;
  const t=now/1000;
  CHUNK_U.uTime.value=t;
  RIM.dir.value.copy(SUN);   // the figures' rim rides the real sun
  starPts.material.uniforms.uTime.value=t;

  if(state==='play'){
    playerInput(dt);
    movePlayer(dt);
    if(player.hurtT>0) player.hurtT-=dt;
    updateDay(dt);
    updateWeather(dt);
    updateCamera(dt);
    animateAvatar(dt,t);
    updateChunks(player.p.x,player.p.z,false);
    pumpLocal();
    drainInbox();
    updateTarget();
    updateMining(dt);
    updateBits(dt);
    updateDrops(dt,t);
    updateHeldActions(dt);
    updateMobs(dt,t);
    // footfalls
    const sp=Math.hypot(player.v.x,player.v.z);
    if(player.onGround && sp>1.2){
      stepT-=dt*sp;
      if(stepT<=0){ stepT=1.7; sfxStep(); }
    }
    // a lantern, not a spotlight: off in daylight, and far enough from the
    // figure that it lights the ground around it instead of flaring the face
    if(motes) motes.position.set(Math.round(player.p.x),
        Math.floor(player.p.y)-2,Math.round(player.p.z));
    playerLamp.position.set(player.p.x,player.p.y+2.3,player.p.z);
    playerLamp.intensity=lerp(0.0,5.2,nightness);
    placeSunShadow(player.p.x,player.p.y+1,player.p.z);
    // under water: the post pass tints and bends, and the ears close up
    const head=blockAt(Math.floor(camera.position.x),Math.floor(camera.position.y),
                       Math.floor(camera.position.z));
    const wantU=(head===WATER)?1:0;
    const uu=matComp.uniforms.uUnder;
    uu.value+=(wantU-uu.value)*Math.min(1,dt*6);
    matComp.uniforms.uWet.value=WEATHER.wet;
    matRays.uniforms.uAmount.value*=(1.0-uu.value);   // no shafts under water
    if(dry) dry.gain.value=0.9-uu.value*0.62;
    rainBed(WEATHER.wet);
    refreshHp();
    $('#clock').style.setProperty('--d',(dayT*360)+'deg');
    $('#seedTag').textContent='种子 '+SEED_LABEL;
    $('#biome').textContent=BIOME_NAME[column(Math.floor(player.p.x),
      Math.floor(player.p.z)).biome]+' · '+(daylight>0.5?'白天':(daylight>0.12?'黄昏':'夜晚'));
  } else if(state==='loading'){
    updateDay(dt*0.2);
    updateChunks(player.p.x,player.p.z,false);
    pumpLocal();
    drainInbox();
    const c=CH.get(ckey(Math.floor(player.p.x/SX),Math.floor(player.p.z/SZ)));
    const done=CH.size?(1-pending/Math.max(1,CH.size)):0;
    $('#ldFill').style.width=Math.round(clamp(done,0,1)*100)+'%';
    if(c&&c.st==='ready'&&pending<CH.size*0.45){ beginPlay(); }
  } else {
    updateDay(dt*0.25);
    camera.position.set(TITLE_AT[0]+Math.sin(t*0.05)*44,SY+4,
                        TITLE_AT[2]+Math.cos(t*0.05)*44);
    camera.lookAt(TITLE_AT[0],TITLE_AT[1]-10,TITLE_AT[2]);
    pumpLocal();
    drainInbox();
  }

  renderFrame(t);
  frameAvg+=(dt-frameAvg)*0.05;
  if(state==='play' && now-startedAt>7000){
    if(!VIEW_LOCK && frameAvg>0.034 && VIEW>4){
      VIEW--; updateChunks(player.p.x,player.p.z,true); startedAt=now;
    } else if(!VIEW_LOCK && frameAvg<0.019 && VIEW<8){
      VIEW++; updateChunks(player.p.x,player.p.z,true); startedAt=now;
    }
  }
}
let startedAt=0;

/* ---- boot ------------------------------------------------------------ */
function beginPlay(){
  state='play'; startedAt=performance.now();
  // The chunk is real now, so settle on what is actually there. A canopy is
  // solid and the topmost solid block in a column is very often a leaf, which
  // is how you end up starting the game standing in a tree.
  let gy=SY-3;
  while(gy>1){
    const b=blockAt(player.p.x,gy,player.p.z);
    if(b>0 && b!==LEAF && b!==BLOSSOM && b!==LOG && b!==CLOUD) break;
    gy--;
  }
  player.p.y=gy+1;
  for(let k=0;k<SY&&boxBlocked(player.p.x,player.p.y,player.p.z);k++) player.p.y++;
  player.v.set(0,0,0);
  // and face the open way. Waking up nose-first into a cliff is a bad first
  // second, and the fix is eight raycasts.
  let bestYaw=player.yaw, bestOpen=-1;
  for(let k=0;k<12;k++){
    const yaw=k/12*Math.PI*2, dx=-Math.sin(yaw), dz=-Math.cos(yaw);
    let open=0;
    for(let r=1;r<=10;r++){
      if(solidAt(player.p.x+dx*r,player.p.y+1.2,player.p.z+dz*r)) break;
      open++;
    }
    if(open>bestOpen){ bestOpen=open; bestYaw=yaw; }
  }
  player.yaw=bestYaw; player.pitch=-0.15;
  $('#loading').style.display='none';
  $('#hud').style.display='block';
  invAdd(I_PICK_W,1); invAdd(PLANK,16); invAdd(LAMP,4);
  refreshHotbar();
  toast('WASD 走 · 空格 跳 · Shift 潜行 · Ctrl/双击W 疾跑 · 左键挖 · 右键放 · Q 丢 · E 背包 · F5 视角');
  wantLock();
}
const SPAWN=[0.5,40,0.5];
function startGame(id){
  audioInit(); startAmbience();
  // a typed seed makes the world repeatable, which is how you hand one to
  // somebody else; anything that is not a number is still a seed, hashed
  const raw=($('#seedIn').value||'').trim();
  if(raw){
    let n=/^-?\d+$/.test(raw)?(parseInt(raw,10)|0):0;
    if(!n){ n=0; for(let i=0;i<raw.length;i++) n=(Math.imul(n,31)+raw.charCodeAt(i))|0; }
    reseed(n||1);
    SEED_LABEL=raw;
  } else SEED_LABEL=String(WORLD_SEED);
  spawnAvatar(id);
  const sp=findSpawn();
  SPAWN[0]=sp[0]+0.5; SPAWN[1]=sp[2]+1; SPAWN[2]=sp[1]+0.5;
  player.p.set(SPAWN[0],SPAWN[1],SPAWN[2]);
  player.yaw=0.6; player.pitch=-0.12;
  state='loading'; VIEW=TOUCH?5:7; updateChunks(player.p.x,player.p.z,true);
  $('#title').style.display='none';
  $('#loading').style.display='flex';
  updateChunks(player.p.x,player.p.z,true);
}
function buildTitle(){
  const row=$('#cards');
  PLAYABLE.forEach(function(id,i){
    const c=CAST[id];
    const card=el('div','card'+(i===0?' on':''));
    card.innerHTML='<b>'+c.zh+'</b><em>'+c.en+'</em>';
    card.style.setProperty('--a',c.accent);
    card.onclick=function(){
      [].forEach.call(row.children,function(n){ n.classList.remove('on'); });
      card.classList.add('on');
      row.dataset.id=id; charInfo(id);
    };
    row.appendChild(card);
  });
  row.dataset.id=PLAYABLE[0];
  const c0=CAST[PLAYABLE[0]];
  charInfo(PLAYABLE[0]);
  $('#goBtn').onclick=function(){ startGame(row.dataset.id); };
  $('#respawnBtn').onclick=function(){ respawn(); wantLock(); };
}

addEventListener('unhandledrejection',function(e){
  const m=e&&e.reason&&e.reason.message||'';
  if(/pointer lock/i.test(m)) e.preventDefault();
});
// a phone has a quarter of the fill rate and a tenth of the patience
if(TOUCH){
  VIEW=5;
  pixelBudget=Math.min(window.devicePixelRatio||1,1.1);
  renderer.setPixelRatio(pixelBudget);
  camera.fov=70; camera.updateProjectionMatrix();   // Minecraft default FOV
  sunLight.shadow.mapSize.set(1024,1024);
  CHUNK_U.uShadowTexel.value.set(1/1024,1/1024);
}
resize();
setupTouch();
buildTitle();
bootWorkers(function(){
  if(!WORKERS_OK){
    $('#warn').style.display='block';
    $('#warn').textContent='后台线程不可用，世界会生成得慢一些。';
  }
  $('#goBtn').disabled=false;
  $('#goBtn').textContent=(typeof t==='function'?t('start'):'出 发');
  const s0=findSpawn();
  TITLE_AT[0]=s0[0]+0.5; TITLE_AT[1]=s0[2]+1; TITLE_AT[2]=s0[1]+0.5;
  VIEW=TOUCH?3:4; updateChunks(TITLE_AT[0],TITLE_AT[2],true);  // a world behind the menu
});
loadGLBs(function(){ if(avatar && GLB[charId]) spawnAvatar(charId); });
tick();
})();
